<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Greats</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Greats">

<link rel="manifest" href="manifest.json">

<style>
/* =============================================================================
   THE GREATS — design system
   One system, every value sourced. See DESIGN.md for the full provenance.

   TYPE   Apple HIG "Typography", iOS Large (default) Dynamic Type table, and the
          SF Pro tracking table (developer.apple.com HIG data, fetched 2026-10-30).
   COLOUR measured from real iOS 26 / iPadOS 26 Apple Music screenshots
          (Pinterest pins 739434832610073940, 1091911872195345882,
          898890406989751969, 1046946244644498781).
   MOTION Apple "Designing Fluid Interfaces": critically damped default
          (damping 1.0, response 0.4), sheets (0.8, 0.3). Springs run on Motion
          (motion@11.11.13); page morphs on the View Transitions API.
   ========================================================================== */
@font-face{font-family:'SF Pro';src:url('assets/fonts/SF-Pro.woff2') format('woff2');font-weight:100 1000;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('assets/fonts/InstrumentSerif-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url('assets/fonts/InstrumentSerif-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
/* the ground hue is a registered property, so moving between figures MORPHS the
   colour instead of cutting (art-tinted direction C) */
@property --gh{syntax:'<number>';inherits:true;initial-value:220}
@property --gs{syntax:'<number>';inherits:true;initial-value:0}

:root{
  /* ---------- colour ---------- */
  --bg:#000;
  --label:#fff;
  --label2:rgb(142,142,147);          /* measured, = systemGray            */
  --label3:rgba(235,235,245,.30);
  --danger:#ff453a;
  --red:#F3EDE4;                      /* legacy name: the interface accent is ivory */
  --ivory:#F3EDE4;
  --glow:208,48,48;                   /* measured: iPadOS Replay corner    */
  --fill:hsl(var(--gh) calc(var(--gs)*35%) 80% / .12);   /* C: panel = ground, desaturated, lifted */
  --fill2:hsl(var(--gh) calc(var(--gs)*30%) 90% / .20);
  --fill3:rgba(255,255,255,.06);
  --hair:rgba(255,255,255,.12);       /* measured: Replay card rim         */
  --sep:rgba(255,255,255,.09);
  --raised:hsl(var(--gh) calc(var(--gs)*40%) 70% / .09);

  /* ---------- type: HIG iOS Large table + SF Pro tracking ---------- */
  --f:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  /* ---------- space & shape ---------- */
  --m:18px;                           /* measured side margin (H, A)       */
  --r-hero:19px;                      /* measured hero card                */
  --r-card:14px;                      /* measured Replay card              */
  --r-tile:9px;
  --r-row:18px;
  --tabh:58px;                        /* measured tab bar                  */
  --minih:50px;                       /* 44pt controls plus player chrome  */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* ---------- glass ---------- */
  --g-blur:blur(30px) saturate(1.4);
  --g-shadow:inset 0 .5px 0 rgba(255,255,255,.30), inset 0 -.5px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.45);
  --g-rim:linear-gradient(160deg,rgba(255,255,255,.50),rgba(255,255,255,.10) 30%,rgba(255,255,255,0) 52%,rgba(255,255,255,.06) 74%,rgba(255,255,255,.24));

  /* ---------- motion: MEASURED from Apple screen recordings (this repo, commit 8d7f1ed) ----------
     push: translateX 100% -> 0 over 417ms, geometric decay r=0.795/frame = critically damped,
           tau 69ms, no overshoot; reaches 90% at ~150ms. Pop and every in-page morph ride it.
     sheet: translateY over 533ms, same spring (decay 0.80/frame). */
  --spring:cubic-bezier(.205,1.128,.496,.968);
  --sheet:cubic-bezier(.096,1.094,.369,.971);
  --dur:.417s; --dur-sheet:.533s;
}
@supports (animation-timing-function:linear(0,1)){:root{
  --spring:linear(0 0%, .2051 4%, .3641 8%, .4906 12%, .5983 16%, .6863 20%,
    .7573 24%, .8137 28%, .8581 32%, .8923 36%, .9188 40%, .9393 44%, .9547 48%,
    .9658 52%, .9744 56%, .9812 60%, .9863 64%, .9897 68%, .9923 72%, .9949 76%,
    .9957 80%, .9974 84%, .9974 88%, .9983 92%, .9991 96%, 1 100%);
  --sheet:linear(0 0%, .2694 3.125%, .4664 6.25%, .5442 9.375%, .6572 12.5%,
    .7231 15.62%, .7867 18.75%, .8428 21.88%, .8728 25%, .8878 28.12%, .9028 31.25%,
    .9147 34.38%, .9281 37.5%, .9475 40.62%, .9562 43.75%, .9656 46.87%, .9735 50%,
    .9795 53.12%, .9842 56.25%, .9878 59.38%, .9905 62.5%, .9929 65.62%, .9945 68.75%,
    .9957 71.87%, .9968 75%, .9976 78.12%, .998 81.25%, .9984 84.37%, .9988 87.5%,
    .9992 90.62%, .9992 93.75%, .9996 96.87%, 1 100%);
}}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--gh:0;--gs:0}
html,body{height:100%;color:var(--label);color-scheme:dark}
/* Neutral graphite media-room ground. Hue properties remain registered so a
   future contextual transition cannot cut between frames. */
body{background:
  radial-gradient(120% 70% at 50% -10%,hsl(var(--gh) calc(var(--gs)*100%) 30%),transparent 70%),
  linear-gradient(hsl(var(--gh) calc(var(--gs)*90%) 17%),hsl(var(--gh) calc(var(--gs)*70%) 8%) 60%,hsl(var(--gh) calc(var(--gs)*50%) 5%));
  background-attachment:fixed}
body{font-family:var(--f);overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit;outline:none;border:0;background:none}
img{display:block;-webkit-user-drag:none;user-select:none}
::-webkit-scrollbar{display:none}
::selection{background:rgba(243,237,228,.35)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* ============================== TYPE SCALE ============================== */
/* B: editorial serif for names and titles, SF for everything you operate */
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.t-hero{font-family:'Instrument Serif',Georgia,serif;font-size:56px;line-height:56px;font-weight:400;letter-spacing:-.02em}
.t-page{font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:46px;font-weight:400;letter-spacing:-.015em}
.t-sect{font-family:'Instrument Serif',Georgia,serif;font-size:28px;line-height:32px;font-weight:400;letter-spacing:-.01em}
.t-card{font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:24px;font-weight:400}
.t-display{font-size:40px;line-height:46px;font-weight:700;letter-spacing:.37px}   /* iPadOS Replay headline (measured ~39-40) */
.t-large  {font-size:34px;line-height:41px;font-weight:700;letter-spacing:.40px}
.t-title1 {font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px}
.t-title2 {font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.t-title3 {font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px}
.t-head   {font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.t-body   {font-size:17px;line-height:22px;font-weight:400;letter-spacing:-.43px}
.t-callout{font-size:16px;line-height:21px;font-weight:400;letter-spacing:-.31px}
.t-sub    {font-size:15px;line-height:20px;font-weight:400;letter-spacing:-.23px}
.t-foot   {font-size:13px;line-height:18px;font-weight:400;letter-spacing:-.08px}
.t-cap1   {font-size:12px;line-height:16px;font-weight:400;letter-spacing:0}
.t-cap2   {font-size:11px;line-height:13px;font-weight:400;letter-spacing:.06px}
.t-eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.c2{color:var(--label2)} .c3{color:var(--label3)} .cr{color:var(--red)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* =============================== ICONS ================================== */
.sfi{display:inline-block;flex:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background-color:currentColor}

/* =============================== GLASS ================================== */
.glass{position:relative;isolation:isolate;background:var(--fill);
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:var(--g-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* =============================== BUTTONS ================================ */
.press{transition:transform .3s var(--spring),opacity .3s var(--spring),background-color .2s}
.press:active{transform:scale(.97);opacity:.8;transition:transform .1s ease-out,opacity .1s ease-out}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;
  font-size:17px;font-weight:600;letter-spacing:-.43px;white-space:nowrap}
.btn-primary{background:var(--ivory);color:#1a1612}                       /* iOS 26 album "Play" pill */
.btn-tinted{background:var(--fill2);color:#fff}                /* Games "Play" pill        */
.btn-red{background:var(--ivory);color:#1a1612}
.btn-glass{color:#fff}
.btn-sm{height:44px;padding:0 16px;border-radius:22px;font-size:15px;letter-spacing:-.23px}
.btn-icon{width:44px;height:44px;padding:0;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-icon.sm{width:44px;height:44px;border-radius:22px}
.btn-play{width:61px;height:61px;border-radius:50%;background:var(--ivory);color:#1a1612;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}                       /* measured 61pt (A) */
.btn-play .sfi{transform:translateX(2px)}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:500;letter-spacing:-.23px;background:var(--fill);color:#fff;white-space:nowrap}
.chip.on{background:var(--ivory);color:#1a1612}
.textbtn{min-height:44px;display:inline-flex;align-items:center;color:rgba(255,255,255,.7);font-size:17px;letter-spacing:-.43px}

/* =============================== LAYOUT ================================= */
.page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 0 calc(var(--tabh) + var(--minih) + 60px + var(--safe-b))}
.content{min-width:0;overflow-x:clip}
.wrap{padding:0 var(--m)}
.bleed{margin:0 calc(-1 * var(--m))}
.sect{margin-top:30px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shead h2{display:flex;align-items:center;gap:3px}
.shead .sfi{color:var(--label2)}
.hrow{display:flex;gap:12px;max-width:100%;min-width:0;overflow-x:auto;overscroll-behavior-inline:contain;padding:0 var(--m);scroll-snap-type:x mandatory;scroll-padding:0 var(--m)}
.hrow>*{scroll-snap-align:start;flex:none}

/* large title + collapsing glass nav bar (scroll edge effect) */
.ltitle{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--safe-t) + 54px) var(--m) 6px}
.navbar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--safe-t) + 50px);padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.navbar::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  -webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.navbar.on{opacity:1;pointer-events:auto}
.navbar .nb-back{position:absolute;left:10px;top:calc(var(--safe-t) + 3px)}
.navbar .nb-r{position:absolute;right:10px;top:calc(var(--safe-t) + 3px)}

/* glow (Replay) */
.glow{display:none;position:absolute;top:0;right:0;width:100%;height:440px;pointer-events:none;z-index:-1;
  background:radial-gradient(80% 62% at 100% 0%,rgba(var(--glow),.85),rgba(var(--glow),.42) 26%,rgba(var(--glow),.12) 56%,transparent 82%)}

/* =============================== FIELD ================================== */
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 14px;background:var(--fill);color:var(--label2)}
.search input{flex:1;min-width:0;color:#fff;font-size:17px;letter-spacing:-.43px}
.search input::placeholder{color:var(--label2)}

/* =============================== CARDS ================================== */
/* every portrait is toned in its figure's hue: luminosity of the photo over a
   ground of that hue = a duotone, the way B's references colour their portraits */
.toned{}
.toned::before{mix-blend-mode:normal}
/* hero (iOS 26 Home, measured 356x443 r19, caption 22pt off the bottom) */
.hero{position:relative;display:block;width:100%;aspect-ratio:356/443;border-radius:var(--r-hero);overflow:hidden;background:#111;text-align:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 55%,rgba(0,0,0,.5) 82%,rgba(0,0,0,.75))}
.hero::after,.rcard::after,.tile .art::after,.pcard .art::after,.wide .art::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;box-shadow:inset 0 0 0 1px var(--hair);pointer-events:none}
.hero .eb{position:absolute;top:20px;left:0;right:0;z-index:2;color:rgba(255,255,255,.75)}
.hero .cap{position:absolute;left:22px;right:22px;bottom:22px;z-index:2}
/* ranked (Replay, measured 240x320 r14; rank 45pt) */
.rcard{position:relative;width:240px;height:320px;border-radius:var(--r-card);overflow:hidden;background:#111;text-align:center}
.rcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.rcard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 52%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.85))}
.rcard .rk{position:absolute;left:18px;top:9px;z-index:2;font-size:45px;line-height:54px;font-weight:700;letter-spacing:.37px}
.rcard .rn{position:absolute;left:12px;right:12px;bottom:34px;z-index:2}
.rcard .rm{position:absolute;left:12px;right:12px;bottom:14px;z-index:2;color:rgba(235,235,245,.72)}
/* square tile (Top Albums) */
.tile{width:162px;text-align:left}
.tile .art{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:var(--r-tile);overflow:hidden;background:#111}
.tile .art img,.pcard .art img,.wide .art img{width:100%;height:100%;object-fit:cover;object-position:center 15%;transition:transform .6s var(--spring)}
.tile .tt{display:block;margin-top:7px}
/* portrait card (Figures grid) */
.pcard{text-align:left;min-width:0}
.pcard .art{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111}
.pcard .tt{display:block;margin-top:8px}
/* wide continue card */
.wide{width:300px;text-align:left}
.wide .art{position:relative;display:block;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#111}
.wide .art .bar{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);z-index:3;overflow:hidden}
.wide .art .bar i{display:block;height:100%;background:#fff}
.wide .tt{display:block;margin-top:8px}
@media (hover:hover){ .tile:hover .art img,.pcard:hover .art img,.wide:hover .art img{transform:scale(1.04)} }
.badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--ivory);color:#1a1612;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:5px}
/* category tile: content stays monochrome; imagery, not tint, differentiates shelves */
.cat{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:16/10;text-align:left;isolation:isolate;background:linear-gradient(145deg,#242426,#121213)}
.cat::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,8,9,.96) 0%,rgba(8,8,9,.84) 58%,rgba(8,8,9,.12) 100%)}
.cat::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--hair)}
.cat .bgc{position:absolute;inset:0;z-index:-2;background:radial-gradient(90% 120% at 100% 10%,rgba(255,255,255,.13),transparent 62%)}
.cat img{position:absolute;right:-5%;bottom:-8%;height:120%;width:auto;z-index:0;filter:grayscale(1) contrast(1.05);opacity:.68;transition:transform .6s var(--spring)}
.cat .copy{position:absolute;left:14px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;align-items:flex-start}
.cat .tt{display:block;width:72%;white-space:normal;overflow-wrap:normal}
.cat .sub{display:block;margin-top:2px;color:rgba(255,255,255,.56)}
.cat .mark{position:absolute;right:12px;top:4px;z-index:0;font-family:'Instrument Serif',Georgia,serif;font-size:84px;line-height:1;color:rgba(255,255,255,.10)}
@media (hover:hover){.cat:hover img{transform:scale(1.04)} .cat:hover::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}}

/* =============================== LISTS ================================== */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;position:relative}
.row .lead{flex:none;width:44px;height:44px;border-radius:6px;overflow:hidden;background:#111}
.row .lead img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .n{flex:none;width:22px;text-align:right;color:var(--label2)}
.row .mid{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:8px 0;box-shadow:inset 0 -.5px 0 var(--sep)}
.row .end{flex:none;align-self:stretch;display:flex;align-items:center;gap:12px;color:var(--label2);box-shadow:inset 0 -.5px 0 var(--sep);padding-left:4px}
.row:last-child .mid,.row:last-child .end{box-shadow:none}
.row.cur .t,.row.cur .n{color:var(--red)}
.row .prog{position:absolute;left:34px;right:0;bottom:5px;height:2px;border-radius:1px;background:var(--fill)}
.row .prog i{display:block;height:100%;background:var(--red);border-radius:1px}
@media (hover:hover){ .row:hover{background:linear-gradient(90deg,transparent,var(--fill3) 6%,var(--fill3) 94%,transparent)} }
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;border-radius:1.5px;background:var(--red);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
.eq.paused i{animation-play-state:paused;height:5px}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
/* library nav rows (Apple Music Library) */
.lnav{display:flex;align-items:center;gap:16px;height:52px;width:100%;text-align:left}
.lnav .sfi{color:var(--red)}
.lnav .mid{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 -.5px 0 var(--sep);padding-right:2px}
/* grouped inset list (Settings, iOS 26) */
.group{background:var(--raised);border-radius:var(--r-row);overflow:hidden}
.group+.group{margin-top:28px}
.gh{padding:0 16px 7px;color:var(--label2)}
.gf{padding:7px 16px 0;color:var(--label2)}
.grow{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding-left:16px;text-align:left}
.grow .ico{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.grow .mid{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:16px;box-shadow:inset 0 -.5px 0 var(--sep)}
.grow:last-child .mid{box-shadow:none}
.grow.destructive .ico{color:var(--danger);background:rgba(255,69,58,.12)}
.grow:disabled{opacity:.45;cursor:default}

/* useful terminal states */
.empty-state{display:flex;min-height:210px;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid var(--hair);border-radius:22px}
.empty-state .btn{margin-top:20px}
.loading-shell .skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.04)}
.loading-shell .search-skeleton{height:44px;border-radius:22px;margin-top:10px}
.loading-shell .card-skeleton{height:380px;border-radius:24px;margin-top:30px}
.loading-shell .line-skeleton{height:18px;border-radius:9px;margin-top:16px;width:42%}

/* ============================ NOW PLAYING ================================ */
#np{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden;background:hsl(var(--gh) calc(var(--gs)*60%) 8%);
  padding:calc(var(--safe-t) + 10px) 26px calc(26px + var(--safe-b));transform:translateY(102%);visibility:hidden}

  animation:drift 22s ease-in-out infinite alternate}

#np .npbg img+img{animation-duration:31s;animation-direction:alternate-reverse;opacity:.6;mix-blend-mode:screen}
@keyframes drift{0%{transform:scale(1.1) rotate(0)}50%{transform:scale(1.35) rotate(12deg) translate(4%,-3%)}100%{transform:scale(1.2) rotate(-8deg) translate(-5%,4%)}}

  background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.11),transparent 42%),linear-gradient(145deg,rgba(255,255,255,.075),rgba(0,0,0,.18));
  box-shadow:0 34px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.10);transition:transform .6s var(--spring)}

/* =============================== SHEETS ================================= */

  display:flex;flex-direction:column;background:rgba(30,30,32,.82);transform:translateY(105%);visibility:hidden}

/* =============================== MOTION ================================= */
/* card -> page zoom (iOS 18 zoom transition) on the View Transitions API */
::view-transition-group(*){animation-duration:var(--dur);animation-timing-function:var(--spring)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
html.vt-push::view-transition-old(root){animation:var(--dur) var(--spring) both vt-out}
html.vt-push::view-transition-new(root){animation:var(--dur) var(--spring) both vt-in}
html.vt-pop::view-transition-old(root){animation:var(--dur) var(--spring) both vt-in-r}
html.vt-pop::view-transition-new(root){animation:var(--dur) var(--spring) both vt-out-r}
/* zoom: the portrait and the name morph; the rest of the page fades fast underneath */
html.vt-zoom::view-transition-group(hero),html.vt-zoom::view-transition-group(heroname){animation-duration:var(--dur);animation-timing-function:var(--spring)}
::view-transition-old(heroname),::view-transition-new(heroname){height:100%;width:auto;object-fit:none}
::view-transition-image-pair(hero){isolation:isolate}
@keyframes vt-in{from{transform:translateX(100%)}}
@keyframes vt-out{to{transform:translateX(-28%);filter:brightness(.6)}}
@keyframes vt-in-r{to{transform:translateX(100%)}}
@keyframes vt-out-r{from{transform:translateX(-28%);filter:brightness(.6)}}
html.vt-zoom::view-transition-old(root){animation:.18s ease-out both vt-fade}
html.vt-zoom::view-transition-new(root){animation:.24s ease-out .06s both vt-fadein}
@keyframes vt-fade{to{opacity:0}} @keyframes vt-fadein{from{opacity:0}}
::view-transition-old(hero),::view-transition-new(hero){height:100%;object-fit:cover;overflow:hidden}
::view-transition-group(dock),::view-transition-group(topnav){animation:none}
.rise{}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}}

};

/* ============================== data ============================== */
const META = {
 "Elon Musk":{cat:"business",sub:"SpaceX · Tesla · PayPal",bio:"Serial founder running the most ambitious industrial portfolio in history — rockets, cars, energy, tunnels, AI.\n\nThe episodes trace how he actually works: reasoning from first principles, setting insane deadlines, and committing everything he has, every time."},
 "Jeff Bezos":{cat:"business",sub:"Amazon · Blue Origin",bio:"Built Amazon from a garage bookstore into an everything company through long-term thinking, customer obsession, and written narratives instead of slides.\n\nHis shareholder letters are the closest thing modern business has to a syllabus."},
 "Bill Gates":{cat:"business",sub:"Microsoft",bio:"Co-founded Microsoft at nineteen and out-worked and out-positioned everyone through software's land-grab decade.\n\nA case study in leverage, focus, and knowing the whole board better than anyone playing on it."},
 "Jensen Huang":{cat:"business",sub:"Nvidia",bio:"Thirty-plus years running Nvidia from arcade graphics chips to the engine of the AI era — the longest-serving founder-CEO in tech.\n\nObsessed with work as craft, pain as fuel, and building for markets that don't exist yet."},
 "Mark Zuckerberg":{cat:"business",sub:"Facebook / Meta",bio:"Dropped out at nineteen and turned a dorm-room project into a communications empire, refusing to sell at every price on the way."},
 "Steve Jobs":{cat:"business",sub:"Apple · Pixar",bio:"Founded Apple twice — the second time from the ashes — and built the most valuable products company in history on taste, focus, and saying no.\n\nSenra has covered him more than anyone: the episodes span his heroes, his exile, and his return."},
 "John D. Rockefeller":{cat:"business",sub:"Standard Oil",bio:"Turned one Cleveland refinery into Standard Oil, history's most disciplined monopoly, through cost accounting, silence, and patience.\n\nThe most-covered founder in the catalog for a reason: every mechanism is on display."},
 "Andrew Carnegie":{cat:"business",sub:"Carnegie Steel",bio:"Scottish telegraph boy who became the richest man in the world by riding technological shifts and hiring men smarter than himself — then spent the rest of his life giving it all away."},
 "Henry Ford":{cat:"business",sub:"Ford Motor Company",bio:"Put the world on wheels by obsessing over one product at one falling price, and relentlessly removing waste from the production line.\n\nToday and Tomorrow — his 1926 book — reads like the source code for Toyota."},
 "Edwin Land - Polaroid":{cat:"business",sub:"Polaroid",bio:"Steve Jobs's hero. Ran Polaroid as an instrument for turning science into products people didn't know they needed — thirty years before the iPhone playbook existed."},
 "Intel - Noyce Grove Shockley":{cat:"business",sub:"Intel",bio:"Noyce, Grove, and the physics-to-fab lineage that invented the integrated circuit and then survived every wave that killed its rivals.\n\nGrove's paranoia is doctrine; Noyce's optimism is the counterweight."},
 "Peter Thiel":{cat:"business",sub:"PayPal · Palantir · Founders Fund",bio:"Contrarian operator behind PayPal, Palantir, and the sharpest question in tech: what important truth do very few people agree with you on?"},
 "Alexander the Great":{cat:"military",sub:"King of Macedon",bio:"Conquered the known world by thirty and never lost a battle.\n\nThe founding case study in speed, logistics, shared hardship, and leading from the front."},
 "Napoleon":{cat:"military",sub:"Emperor of the French",bio:"Artillery officer who became Emperor and rewrote the art of war, administration, and ambition itself.\n\nSenra calls his biography one of the best books on the will to power ever written."},
 "Winston Churchill":{cat:"military",sub:"Britain",bio:"Half a century of failure, exile, and writing — then the one job only he could do.\n\nThe definitive study in endurance, preparation, and language as a weapon."},

 "Claude Shannon":{cat:"science",sub:"Information theory",bio:"Invented information theory in a single paper and treated the frontier as a playground — juggling, unicycles, and the mathematics underneath the entire digital age."},
 "Vannevar Bush":{cat:"science",sub:"OSRD · Science policy",bio:"Ran American science during World War II — six thousand scientists pointed at one goal.\n\nThe blueprint for organizing research at scale."},
 "Alfred Lee Loomis":{cat:"science",sub:"Tuxedo Park · Rad Lab",bio:"Wall Street tycoon who built a private physics lab and bankrolled the radar work that arguably won the war before the bomb ended it."},

 "Jacob Fugger":{cat:"money",sub:"Renaissance finance",bio:"The Renaissance banker who financed emperors and died the richest man who ever lived. Leverage, information, and God."},

const fmtClock=s=>{s=Math.max(0,Math.round(s||0));const h=~~(s/3600),m=~~((s%3600)/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

function ground(p){ const [h,s]=p?pal(p):[220,.06]; const d=document.documentElement.style; d.setProperty('--gh',h); d.setProperty('--gs',s);
  document.querySelector('meta[name=theme-color]').content=`hsl(${h} ${Math.round(s*90)}% 17%)`; }
function epTitle(p, e){
  const t = e.title;
  const short = p.shortName || p.name;
  const words = short.split(/\s+/);
  const vars = [p.name, short];
  if (words.length === 2) vars.push(words[1]);       // surname, only for "First Last"
  const uniq = [...new Set(vars.filter(v => v && v.length > 2))]
                 .sort((a, b) => b.length - a.length);
  for (const v of uniq){
    const q = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // "Name (Subtitle)" -> "Subtitle"
    let m = t.match(new RegExp('^' + q + '\\s*\\((.+)\\)\\s*$', 'i'));
    if (m && m[1].length > 2) return m[1];
    // "Name: X" / "Name - X" only. Conjunctions are excluded on purpose:
    // "Steve Jobs and His Heroes" must stay whole, not become "His Heroes".
    m = t.match(new RegExp('^' + q + '\\s*(?::|\\u2013|\\u2014|-)\\s*(.+)$', 'i'));
    if (m && m[1].length > 2) return m[1];
  }
  return t;
}

/* Each Founders episode is built on one book, and that book is what actually
   separates two episodes about the same person — "Steve Jobs" #5 is Isaacson,
   #204 is Kahney. So on a person's shelf the book is the headline and the
   author replaces the feed's global episode number, which carries no meaning
   once you are looking at one person rather than the whole chronology. */
const rowTitle = (p, e) => (e.book && e.book.trim()) ? e.book.trim() : epTitle(p, e);
const rowSub = (p, e) => {
  if (e.sub) return e.sub;
  const a = (e.author || '').trim(), d = mon(e.date);
  return a ? a + ' · ' + d : d;
};

function render(r,kind='none',zoomEl=null){
  const prev=route; if(prev){ const pg=$('view').firstElementChild; if(pg) scrollMem[prev]=pg.scrollTop; }
  route=r; if(!depth(r)) lastTab=r==='search'?'search':r;
  ground(r.startsWith('p/')?BYSLUG[r.slice(2)]:r==='home'?featured():null);
  const paint=()=>{ $('view').setAttribute('aria-busy','false'); $('view').innerHTML=''; $('view').appendChild(build(r)); paintChrome();
    const pg=$('view').firstElementChild; if(pg){ pg.scrollTop=(kind==='pop'||kind==='tab')?(scrollMem[r]||0):0; wireNav(pg); } };
  const doc=document.documentElement;
  if(!document.startViewTransition||kind==='none'||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches){ paint(); return; }
  doc.classList.remove('vt-push','vt-pop','vt-zoom');
  /* tab switches are instant, as on iOS: no transition at all */
  if(kind==='tab'){ paint(); return; }
  /* popping back from a figure: morph the hero back into that figure's card */
  const backTo=kind==='pop'&&prev&&prev.startsWith('p/')?prev.slice(2):null;
  const k=zoomEl||backTo?'zoom':kind==='push'?'push':kind==='pop'?'pop':null; if(k) doc.classList.add('vt-'+k);
  const nameEl=zoomEl&&zoomEl.closest('[data-p]')?.querySelector('.t-card,.rn');
  if(zoomEl){ zoomEl.style.viewTransitionName='hero'; if(nameEl) nameEl.style.viewTransitionName='heroname'; }
  const t=document.startViewTransition(()=>{ if(zoomEl){ zoomEl.style.viewTransitionName=''; if(nameEl) nameEl.style.viewTransitionName=''; } paint();
    if(backTo){ const card=[...document.querySelectorAll(`#view [data-p="${backTo}"]`)].find(c=>{ const r=c.getBoundingClientRect(); return r.bottom>0&&r.top<innerHeight&&r.width; });
      const im=card&&card.querySelector('img'); if(im){ im.style.viewTransitionName='hero'; const nm=card.querySelector('.t-card,.rn'); if(nm) nm.style.viewTransitionName='heroname';
        t.finished.finally(()=>{ im.style.viewTransitionName=''; if(nm) nm.style.viewTransitionName=''; }); } } });
  /* never let a stalled transition leave a stale snapshot on screen */
  t.ready.catch(()=>{}); t.updateCallbackDone.catch(()=>{});
  const cap=setTimeout(()=>{ try{ t.skipTransition(); }catch(e){} },700);
  t.finished.catch(()=>{}).finally(()=>{ clearTimeout(cap); doc.classList.remove('vt-push','vt-pop','vt-zoom'); });
}

function bind(el,r){
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openPerson(b.dataset.p,b));
  el.querySelectorAll('[data-favp]').forEach(b=>b.onclick=()=>{ const p=BYSLUG[b.dataset.favp]; if(!p) return; toggleFav(p.name);
    const on=favs.includes(p.name); b.innerHTML=IC.star(18,on); b.setAttribute('aria-pressed',String(on)); b.setAttribute('aria-label',`${on?'Remove '+p.shortName+' from':'Add '+p.shortName+' to'} Favourites`); });
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  el.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{ npFrom=b.querySelector('.cover,.lead,img'); const [s,k,i]=b.dataset.ep.split('|'); const p=BYSLUG[s];
    if(cur&&cur.p===p&&cur.k===k&&cur.i===+i){ toggle(); return; } playEp(p,+i,k); openNP(); });
  el.querySelectorAll('[data-fil]').forEach(b=>b.onclick=()=>{ figFilter=b.dataset.fil; render('figures','none'); });
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,r));
  const q=el.querySelector('#q'); if(q){ q.oninput=()=>{ searchQuery=q.value; $('qres').innerHTML=searchResults(searchQuery); $('cats').style.display=searchQuery.trim()?'none':''; bind($('qres'),r); };
    if(matchMedia('(min-width:900px) and (hover:hover) and (pointer:fine)').matches) q.focus(); }
  if(r.startsWith('p/')){ const pimg=el.querySelector('#pimg'); el.addEventListener('scroll',()=>{ const y=el.scrollTop; if(pimg) pimg.style.transform=y<0?`scale(${1+Math.min(80,-y)*.002})`:`translateY(${y*.35}px)`; },{passive:true}); }
}
function act(a,r){
  const p=r.startsWith('p/')?BYSLUG[r.slice(2)]:null;
  if(a==='back') back();
  else if(a==='fav'&&p){ toggleFav(p.name); render(r,'none'); }
  else if(a==='about'&&p) openAbout(p);
  else if(a==='play'&&p){ playEp(p,resumeIndex(p),'bio'); openNP(); }
  else if(a==='shuffle'&&p){ shuffleOn=true; playEp(p,~~(Math.random()*p.episodes.length),'bio'); openNP(); }
  else if(a==='speed'){ const o=[1,1.25,1.5,1.75,2]; const n=o[(o.indexOf(store.get('speed',1))+1)%o.length]; store.set('speed',n); audio.playbackRate=n; paintNP(); render(r,'none'); }
  else if(a==='sleep'){ cycleSleep(); render(r,'none'); }
  else if(a==='clear') confirmClearHistory();
  else if(a==='favs') go('l/favs');
  else if(a==='system') go('system');
  else if(a==='update'){ fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(x=>x.text()).then(v=>{ v=v.trim(); if(v&&v!==BUILD){ sessionStorage.removeItem('tg.reloaded'); location.reload(); } else toast('You’re on the latest version'); }).catch(()=>toast('Offline')); }
}
function toggleFav(n){ const on=!favs.includes(n); favs=on?[...favs,n]:favs.filter(x=>x!==n); store.set('favs',favs); toast(on?'Added to Favourites':'Removed from Favourites'); }
function resumeIndex(p){ const L=p.episodes; let i=L.findIndex(e=>pos(p,e)>60&&!done(p,e)); if(i<0) i=L.findIndex(e=>!done(p,e)); return i<0?0:i; }

/* ============================== sheets (spring) ============================== */
/* Motion runs on the Web Animations API (compositor, promise-based), driven by the
   curves MEASURED from Apple recordings (see :root): --sheet 533ms, --spring 417ms. */
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const EASE={sheet:()=>css('--sheet'),push:()=>css('--spring')};
function anim(el,frames,dur,ease){ const a=el.animate(frames,{duration:dur,easing:ease,fill:'forwards'});
  return a.finished.then(()=>{ try{ a.commitStyles(); }catch(e){} a.cancel(); }).catch(()=>{}); }
const cur_t=el=>{ const m=new DOMMatrix(getComputedStyle(el).transform); return m.m42; };   /* live y, for interruptions */
const setAppInert=on=>['view','navbar','topnav','dock'].forEach(id=>$(id).inert=on);
function slide(el,show){ if(show) el.classList.add('show');
  const from=`translateY(${show?(el.getBoundingClientRect().height? cur_t(el):0)+'px':cur_t(el)+'px'})`;
  return anim(el,[{transform:show?'translateY(105%)':from},{transform:show?'translateY(0%)':'translateY(105%)'}],show?533:417,show?EASE.sheet():EASE.push())
    .then(()=>{ if(!show) el.classList.remove('show'); }); }
let sheetReturnFocus=null;
function openSheet(title,html){ const sheet=$('sheet'); sheetReturnFocus=document.activeElement; $('sht').textContent=title; $('shb').innerHTML=html;
  if(document.body.classList.contains('np-open')) $('np').inert=true; else setAppInert(true);
  sheet.setAttribute('aria-hidden','false'); $('scrim').classList.add('on'); slide(sheet,true).then(()=>$('shx').focus()); }
function closeSheet(){ const sheet=$('sheet'); $('scrim').classList.remove('on'); return slide(sheet,false).then(()=>{ sheet.setAttribute('aria-hidden','true');
  if(document.body.classList.contains('np-open')) $('np').inert=false; else setAppInert(false);
  if(sheetReturnFocus?.isConnected) sheetReturnFocus.focus(); sheetReturnFocus=null; }); }
$('shx').innerHTML=IC.x(15); $('shx').onclick=closeSheet; $('scrim').onclick=()=>{ closeSheet(); };
function openAbout(p){ const m=meta(p);
  openSheet(p.shortName,`<div style="display:flex;gap:14px;align-items:center"><img src="${P[p.name]}" style="width:76px;height:76px;border-radius:38px;object-fit:cover;object-position:top"><div><div class="t-head">${esc(m.sub)}</div><div class="t-foot c2">${p.episodes.length} books · ${hours(p)} hours</div></div></div>

    <div class="sheet-actions"><button class="btn btn-danger press" id="confirm-clear">Clear History</button><button class="btn btn-tinted press" id="cancel-clear">Cancel</button></div>`);

/* ============================== playback ============================== */
function playEp(p,i,k='bio'){
  const e=items(p,k)[i]; if(!e) return;
  cur={p,i,k}; audio.src=e.url; const start=pos(p,e);
  audio.play().then(()=>{ if(start>5&&start<(e.sec||1)-20) audio.currentTime=start; }).catch(()=>{});
  audio.playbackRate=store.get('speed',1);
  store.set('last',{slug:p.slug,i,k}); store.set('t.'+epKey(p,e),Date.now());
  document.body.classList.add('has-track'); paintNP(); setSession(p,e); refreshRows();
}
function toggle(){ if(!cur) return; audio.paused?audio.play():audio.pause(); }
function next(auto){ if(!cur) return; const L=items(cur.p,cur.k);
  if(shuffleOn&&L.length>1){ let j; do j=~~(Math.random()*L.length); while(j===cur.i); playEp(cur.p,j,cur.k); return; }
  if(cur.i+1<L.length) playEp(cur.p,cur.i+1,cur.k); }
function prev(){ if(cur&&audio.currentTime>10){ audio.currentTime=0; return; } if(cur&&cur.i>0) playEp(cur.p,cur.i-1,cur.k); }
function refreshRows(){ document.querySelectorAll('[data-ep]').forEach(b=>{ const [s,k,i]=b.dataset.ep.split('|'); const on=cur&&cur.p.slug===s&&cur.k===k&&cur.i===+i;
  if(!b.classList.contains('row')) return; b.classList.toggle('cur',on); const n=b.querySelector('.n');
  if(n) n.innerHTML=on?`<span class="eq${audio.paused?' paused':''}"><i></i><i></i><i></i></span>`:(+i+1); }); }
let saveT=0;
audio.addEventListener('timeupdate',()=>{ if(!cur) return; const now=Date.now(), e=curEp();
  if(now-saveT>4000){ saveT=now; store.set('pos.'+epKey(cur.p,e),Math.round(audio.currentTime)); }
  if(sleepUntil&&now>=sleepUntil){ audio.pause(); sleepUntil=null; sleepMin=0; paintNP(); }
  paintTime(); });
audio.addEventListener('ended',()=>{ if(!cur) return; const e=curEp(); store.set('done.'+epKey(cur.p,e),true); store.set('pos.'+epKey(cur.p,e),0); next(true); });
audio.addEventListener('play',()=>{ document.body.classList.add('playing'); paintNP(); refreshRows(); });
audio.addEventListener('pause',()=>{ document.body.classList.remove('playing'); paintNP(); refreshRows(); if(cur) store.set('pos.'+epKey(cur.p,curEp()),Math.round(audio.currentTime)); });
function setSession(p,e){ if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:rowTitle(p,e),artist:p.shortName,album:'The Greats · '+KLABEL[cur.k],artwork:[{src:new URL(P[p.name],location.href).href,sizes:'900x1200',type:'image/jpeg'}]});
  const h=navigator.mediaSession.setActionHandler.bind(navigator.mediaSession);
  h('play',()=>audio.play()); h('pause',()=>audio.pause()); h('previoustrack',prev); h('nexttrack',()=>next(false));
  h('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-30)); h('seekforward',()=>audio.currentTime+=15);
  try{ h('seekto',d=>{ if(d.seekTime!=null) audio.currentTime=d.seekTime; }); }catch(e){} }

/* ============================== now playing ============================== */
function paintNP(){
  if(!cur) return; const {p}=cur, e=curEp(), playing=!audio.paused;
  $('miniimg').src=P[p.name]; $('minit').textContent=rowTitle(p,e); $('minis').textContent=p.shortName;
  document.querySelector('#mini .tg').innerHTML=playing?IC.pause(20):IC.play(20);
  document.querySelector('#mini .tg').setAttribute('aria-label',playing?'Pause':'Play');
  document.querySelector('#mini .ff').innerHTML=IC.ff(22); document.querySelector('#mini .rw').innerHTML=IC.rw(22); document.querySelector('#mini .q').innerHTML=IC.list(20);
  $('npart').innerHTML=artifactVisual(p,cur.k,e,cur.i); $('npbg1').src=$('npbg2').src=P[p.name]; $('np').dataset.kind=cur.k;
  { const [h,s]=pal(p); $('np').style.setProperty('--h',h); $('np').style.setProperty('--s',s); $('mini').style.setProperty('--h',h); $('mini').style.setProperty('--s',s); }
  $('npt').textContent=rowTitle(p,e);
  $('npplay').innerHTML=playing?sfi('pause_fill',30):`<span style="transform:translateX(2px);display:flex">${sfi('play_fill',30)}</span>`;
  $('npplay').setAttribute('aria-label',playing?'Pause':'Play');
  $('nprw').innerHTML=sfi('backward_fill',24)+'<span>30</span>'; $('npff').innerHTML=sfi('forward_fill',24)+'<span>15</span>';
  const isFav=favs.includes(p.name); $('npfav').innerHTML=IC.star(20,isFav); $('npfav').setAttribute('aria-pressed',String(isFav));
  $('npfav').setAttribute('aria-label',isFav?'Remove from Favourites':'Add to Favourites'); $('npmore').innerHTML=IC.more(17); $('npclose').innerHTML=innerWidth>=900?IC.x(15):IC.down(15);
  const sp=store.get('speed',1); $('npspeeds').innerHTML=[0.75,1,1.25,1.5,2].map(v=>`<button class="press${v===sp?' on':''}" data-sp="${v}" aria-label="Playback speed ${v} times" aria-pressed="${v===sp}">${v}×</button>`).join('');
  $('npspeeds').querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ store.set('speed',+b.dataset.sp); audio.playbackRate=+b.dataset.sp; paintNP(); });
  { const e2=curEp(); const d=e2.sec||1; $('nps').textContent=p.shortName+' · '+Math.round(100*(audio.currentTime||pos(p,e2))/d)+'% complete'; }
  $('npspeed').textContent=store.get('speed',1)+'×';
  $('npsleep').innerHTML=IC.moon(21)+(sleepMin?`<span class="t-cap1">${sleepMin}m</span>`:''); $('npsleep').classList.toggle('on',!!sleepMin);
  $('npsleep').setAttribute('aria-pressed',String(!!sleepMin)); $('npsleep').setAttribute('aria-label',sleepMin?`Sleep timer, ${sleepMin} minutes`:'Sleep timer, off');
  $('npair').innerHTML=IC.air(24); $('npq').innerHTML=IC.list(22);
  paintTime();
}
let scrubbing=false, scrubT=0;
function paintTime(){ if(!cur) return; const e=curEp(); const d=isFinite(audio.duration)&&audio.duration?audio.duration:(e.sec||1);
  const t=scrubbing?scrubT:(audio.currentTime||pos(cur.p,e)); if(!scrubbing) $('scrubi').style.width=(100*t/d)+'%';
  $('tel').textContent=fmtClock(t); $('trem').textContent='-'+fmtClock(d-t);
  $('scrub').setAttribute('aria-valuemax',String(Math.round(d))); $('scrub').setAttribute('aria-valuenow',String(Math.round(t)));
  $('scrub').setAttribute('aria-valuetext',`${fmtClock(t)} of ${fmtClock(d)}`); }
/* FLIP: the Now Playing artwork grows out of the element that was tapped (mini player art, a book
   cover, a row thumbnail) on the sheet spring, while the sheet itself slides up underneath it */
let npFrom=null, npReturnFocus=null;
function flipArt(fromEl){ const art=document.querySelector('#np .art'); if(!fromEl||!art) return;
  const a=fromEl.getBoundingClientRect(), b=art.getBoundingClientRect(); if(!a.width||!b.width) return;
  const sx=a.width/b.width, sy=a.height/b.height, dx=a.left-b.left, dy=a.top-b.top;
  art.style.transformOrigin='0 0';
  anim(art,[{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,borderRadius:'8px'},{transform:'translate(0,0) scale(1,1)',borderRadius:'18px'}],533,EASE.sheet()); }
function openNP(){ const np=$('np'); if(cur) ground(cur.p); npReturnFocus=document.activeElement; setAppInert(true); np.setAttribute('aria-hidden','false'); np.classList.add('show'); document.body.classList.add('np-open');
  const from=npFrom||document.querySelector('#mini .art'); npFrom=null;
  /* measure the art's resting rect first, then start sheet + art together */
  np.style.transform='translateY(0%)'; const art=document.querySelector('#np .art'); const restT=art.getBoundingClientRect();
  $('npclose').focus({preventScroll:true}); np.style.transform=''; anim(np,[{transform:'translateY(102%)'},{transform:'translateY(0%)'}],533,EASE.sheet());
  if(from){ const a=from.getBoundingClientRect(); if(a.width){ const sx=a.width/restT.width, sy=a.height/restT.height;
    art.style.transformOrigin='0 0'; anim(art,[{transform:`translate(${a.left-restT.left}px,${a.top-restT.top}px) scale(${sx},${sy})`,borderRadius:'8px'},{transform:'none',borderRadius:'18px'}],533,EASE.sheet()); } } }
function closeNP(){ const np=$('np'); ground(route.startsWith('p/')?BYSLUG[route.slice(2)]:route==='home'?featured():null); document.body.classList.remove('np-open');
  const y=cur_t(np); anim(np,[{transform:`translateY(${y}px)`},{transform:'translateY(102%)'}],417,EASE.push()).then(()=>{ np.classList.remove('show'); np.style.transform='translateY(102%)';
    np.setAttribute('aria-hidden','true'); setAppInert(false); if(npReturnFocus?.isConnected) npReturnFocus.focus(); npReturnFocus=null; }); }
function cycleSleep(){ const o=[0,15,30,60]; sleepMin=o[(o.indexOf(sleepMin)+1)%o.length]; sleepUntil=sleepMin?Date.now()+sleepMin*6e4:null; paintNP(); toast(sleepMin?`Sleep in ${sleepMin} minutes`:'Sleep timer off'); }
$('npclose').onclick=closeNP;
$('npplay').onclick=toggle; $('nprw').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-30); $('npff').onclick=()=>audio.currentTime+=15;
$('nptabq').onclick=openQueue;
$('npspeed').onclick=()=>act('speed',route); $('npsleep').onclick=cycleSleep;
$('npair').onclick=()=>{ if(audio.remote&&audio.remote.prompt) audio.remote.prompt().catch(()=>{}); else toast('AirPlay is available on Safari'); };
$('npq').onclick=openQueue; $('npfav').onclick=()=>{ if(cur){ toggleFav(cur.p.name); paintNP(); } };
$('npmore').onclick=()=>{ if(cur) openAbout(cur.p); };
$('mini').onclick=ev=>{ const a=ev.target.closest('[data-a]')?.dataset.a;
  if(a==='toggle') toggle(); else if(a==='next') next(false); else if(a==='prev') prev(); else if(a==='queue') openQueue(); else if(a==='open') openNP(); };
/* scrubbing: 1:1 with the pointer, captured */
(()=>{ const s=$('scrub');
  const at=x=>{ const r=s.getBoundingClientRect(), f=Math.min(1,Math.max(0,(x-r.left)/r.width)); const e=curEp(); const d=isFinite(audio.duration)&&audio.duration?audio.duration:(e?e.sec:1); scrubT=f*d; $('scrubi').style.width=f*100+'%'; paintTime(); };
  s.addEventListener('pointerdown',e=>{ if(!cur) return; scrubbing=true; s.classList.add('grab'); s.setPointerCapture(e.pointerId); at(e.clientX); });
  s.addEventListener('pointermove',e=>{ if(scrubbing) at(e.clientX); });
  s.addEventListener('pointerup',e=>{ if(!scrubbing) return; at(e.clientX); audio.currentTime=scrubT; scrubbing=false; s.classList.remove('grab'); });
  s.addEventListener('keydown',e=>{ if(!cur||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return; e.preventDefault();
    const ep=curEp(), d=isFinite(audio.duration)&&audio.duration?audio.duration:(ep?.sec||1);
    audio.currentTime=e.key==='Home'?0:e.key==='End'?d:Math.min(d,Math.max(0,audio.currentTime+(e.key==='ArrowLeft'?-10:10))); paintTime(); });
})();
/* drag the now-playing sheet down: tracks the finger, springs home or dismisses on velocity */
(()=>{ const np=$('np'); let y0=null,t0=0,last=0,lt=0,v=0;
  np.addEventListener('pointerdown',e=>{ if(innerWidth>=900||(e.target.closest('.scrub,button')&&!e.target.closest('#npclose'))) return; y0=e.clientY; t0=lt=performance.now(); last=y0; v=0; });
  window.addEventListener('pointermove',e=>{ if(y0===null) return; const dy=Math.max(0,e.clientY-y0); const now=performance.now(); v=(e.clientY-last)/Math.max(1,now-lt)*1000; last=e.clientY; lt=now;
    np.style.transform=`translateY(${dy}px)`; });
  window.addEventListener('pointerup',e=>{ if(y0===null) return; const dy=e.clientY-y0; y0=null;
    /* Apple's momentum projection: v/1000 * d/(1-d), d=0.998 */
    const proj=dy+(v/1000)*.998/(1-.998);
    if(proj>innerHeight*.35) closeNP(); else { const yy=cur_t(np); np.style.transform=''; anim(np,[{transform:`translateY(${yy}px)`},{transform:'translateY(0%)'}],417,EASE.push()); } });
})();
document.addEventListener('keydown',e=>{ const modal=$('sheet').classList.contains('show')?$('sheet'):document.body.classList.contains('np-open')?$('np'):null;
  if(e.key==='Tab'&&modal){ const f=[...modal.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){ const first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } } }
  if(e.key==='Escape'){ if($('sheet').classList.contains('show')) closeSheet(); else if(document.body.classList.contains('np-open')) closeNP(); else if(depth(route)) back(); return; }
  const editing=e.target.closest('input,textarea,[contenteditable="true"]'), command=e.metaKey||e.ctrlKey;
  if(!modal&&command&&e.key.toLowerCase()==='f'){ e.preventDefault(); go('search'); setTimeout(()=>$('q')?.focus(),0); return; }
  if(!modal&&command&&e.key===','){ e.preventDefault(); go('settings'); return; }
  if(!modal&&!editing&&e.key==='/'){ e.preventDefault(); go('search'); setTimeout(()=>$('q')?.focus(),0); return; }
  if(e.target.closest('input,button,[role="slider"],[contenteditable="true"]')) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); } });

/* ============================== boot ============================== */
const requiredJSON=url=>fetch(url).then(r=>{ if(!r.ok) throw new Error(`Failed to load ${url}`); return r.json(); });
Promise.all([requiredJSON('episodes.json?v='+BUILD),requiredJSON('portraits.json?v='+BUILD),
  fetch('media.json?v='+BUILD).then(r=>r.ok?r.json():{people:{}}).catch(()=>({people:{}})),
  fetch('palette.json?v='+BUILD).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,pr,md,pl])=>{ PAL=pl;
  DATA=d; P=Object.fromEntries(Object.entries(pr).map(([k,v])=>[k,v+'?v='+BUILD]));
  DATA.people.forEach(p=>{ p.slug=slug(p.name); p.shortName=p.name.split(' - ')[0]; p.media=(md.people||{})[p.name]||{}; BYSLUG[p.slug]=p; });
  const last=store.get('last',null);
  if(last&&BYSLUG[last.slug]&&items(BYSLUG[last.slug],last.k||'bio')[last.i]){ cur={p:BYSLUG[last.slug],i:last.i,k:last.k||'bio'}; audio.src=curEp().url; document.body.classList.add('has-track'); paintNP(); }
  const r=parse(location.hash); render(r,'none');
  const st=new URLSearchParams(location.search).get('state');
  if(st==='player'){ if(!cur){ cur={p:BYSLUG['steve-jobs'],i:0,k:'bio'}; document.body.classList.add('has-track'); } paintNP(); openNP(); }
}).catch(()=>{ const v=$('view'); v.setAttribute('aria-busy','false'); v.innerHTML=`<div class="page"><div class="load-state" role="alert"><h1 class="t-page">The archive couldn’t load.</h1><p class="t-body c2">Check your connection, then try again. Your saved listening state is untouched.</p><button class="btn btn-primary press" id="retry-load">Try Again</button></div></div>`;
  $('retry-load').onclick=()=>location.reload(); });
/* the zoom transition needs the tapped image, which only exists before the hash changes */
window.addEventListener('hashchange',()=>{},true);
const _render=render;
render=function(r,kind,z){ const zoom=pendingZoom; pendingZoom=null; return _render(r,kind,z||(r.startsWith('p/')?zoom:null)); };
</script>
