<meta name="mobile-web-app-capable" content="yes">

<style>
/* =============================================================================
   FOUNDERS — structure rebuilt from the reference recordings at 1170x2532 (@3x).
   Every number below is a measurement divided by 3, not an estimate.
   ========================================================================== */
:root{
  --pad:16px;                 /* 48px @3x — large title x=54 incl. sidebearing */
  --bg:#000000;
  --card:#181818;             /* detail list card: measured rgb(24,24,24)      */
  --tile:#242424;             /* detail number tile: measured rgb(36,36,36)    */
  --text:#FFFFFF;
  --grey:#8E8E93;
  --blue:#3B82F7;
  --green:#2E9E22;

  /* ---- Liquid Glass, derived from the reference ---------------------------
     Queue card reads rgb(24,24,37) over bg(0,0,17) and rgb(23,25,38) over
     bg(1,16,63)  =>  transmission ~6%, tint rgb(25,25,39).
     Specular top edge reads rgb(62,63,91) over fill 24 => white @ ~0.16.     */
  --glass-deep:rgba(25,25,39,.94);
  --glass-bar:rgba(30,30,30,.72);       /* tab bar: measured rgb(34,34,34)/blk */
  --glass-raise:rgba(46,47,58,.92);     /* top pill: measured rgb(44,45,55)    */
  --glass-inner:rgb(43,44,54);          /* fields/rows inside the queue card   */
  --glass-tile:rgb(35,36,43);           /* queue number tile                   */
  --spec:rgba(255,255,255,.16);
  --spec-soft:rgba(255,255,255,.10);
  /* MEASURED BLUR RADII (round 4). Chrome delivers ~0.96x the declared
     blur(Npx), calibrated on a random-block backdrop at DSF 3 over ten radii,
     so each declared value below is (reference sigma / 0.96).
       --blur-dock  reference sigma 21.4 CSS (tab bar) and 21.6 (mini pill),
                    from the browse portrait row passing under both, with the
                    unoccluded backdrop recovered by registering the same list
                    from a scrolled frame (v2 pts 0 vs pts 128, shift 1071.95px).
                    ONE significant figure: one frame pair, two edges. The
                    reference measures the SAME radius for the bar and the pill,
                    i.e. one material for the whole dock; we had 30 and 13.
       --blur       queue card and player top pill. NOT measurable in either the
                    reference or our own render: both sit over a smooth ambient
                    gradient. Our own top pill, fitted against an exact
                    visibility:hidden ground truth at a known declared 30px,
                    returns signal 0.00 and rms 0.00 at every sigma from 4 to
                    220 - there is nothing there to blur. Left at 30.           */
  --blur:blur(30px) saturate(1.8);
  --blur-dock:blur(22px) saturate(1.8);
  --blur-lite:blur(22px) saturate(1.7);

  /* ---- player surface ---- */
  --ptitle:#FFFFFF; --psub:#9AA6D8; --ptrack:rgb(53,70,133);

  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.32,.72,.33,1);
  --ease-out:cubic-bezier(.16,1,.3,1);

  /* ---- MEASURED EASINGS (round 4) -----------------------------------------
     Every curve below was recovered frame-by-frame from the reference
     recordings (60fps pts timebase) and emitted as an exact linear() ramp, so
     the shape is the measurement rather than a guessed bezier.
       push      v2 pts 178-202, incoming translateX 1170px -> 0 (417ms).
                 Geometric decay r=0.795/frame => a critically damped spring,
                 tau = 69ms. The outgoing view rides the SAME curve to -30%.
       sheetup   v2 pts 392-424, about sheet translateY 2532px -> 0 (533ms).
                 These stops ARE the measured per-frame displacement, not a
                 model: dy = 2532,1850,1351,1154,868,701,540,398,322,...,3,2,1,0
                 px@3x. Mean decay 0.80/frame, i.e. the same spring as the push.
       qopen     v1 pts 354-367, queue card opacity 0 -> 1 (229ms).
       qclose    v1 pts 481-495, queue card opacity 1 -> 0 (217ms).            */
  --e-qopen:cubic-bezier(.155,0,.633,1);
  /* cubic-bezier fallbacks, fitted to the same measured series (push rms .0019,
     sheetup rms .0106, qclose rms .0080). The linear() ramps below replace them
     wherever linear() easing is supported - they are exact, the beziers are not. */
  --e-push:cubic-bezier(.205,1.128,.496,.968);
  --e-sheetup:cubic-bezier(.096,1.094,.369,.971);
  --e-qclose:cubic-bezier(.411,.2,.767,1.138);
  --d-push:.417s; --d-sheetup:.533s; --d-qopen:.229s; --d-qclose:.217s;
}
@supports (animation-timing-function:linear(0,1)){:root{
  --e-push:linear(0 0%, .2051 4%, .3641 8%, .4906 12%, .5983 16%, .6863 20%,
    .7573 24%, .8137 28%, .8581 32%, .8923 36%, .9188 40%, .9393 44%, .9547 48%,
    .9658 52%, .9744 56%, .9812 60%, .9863 64%, .9897 68%, .9923 72%, .9949 76%,
    .9957 80%, .9974 84%, .9974 88%, .9983 92%, .9991 96%, 1 100%);
  --e-sheetup:linear(0 0%, .2694 3.125%, .4664 6.25%, .5442 9.375%, .6572 12.5%,
    .7231 15.62%, .7867 18.75%, .8428 21.88%, .8728 25%, .8878 28.12%, .9028 31.25%,
    .9147 34.38%, .9281 37.5%, .9475 40.62%, .9562 43.75%, .9656 46.87%, .9735 50%,
    .9795 53.12%, .9842 56.25%, .9878 59.38%, .9905 62.5%, .9929 65.62%, .9945 68.75%,
    .9957 71.87%, .9968 75%, .9976 78.12%, .998 81.25%, .9984 84.37%, .9988 87.5%,
    .9992 90.62%, .9992 93.75%, .9996 96.87%, 1 100%);
  --e-qclose:linear(0 0%, .069 7.692%, .118 15.38%, .179 23.08%, .279 30.77%,
    .398 38.46%, .484 46.15%, .592 53.85%, .704 61.54%, .802 69.23%, .898 76.92%,
    .955 84.62%, .985 92.31%, 1 100%);
}}
@font-face{font-family:'SF Pro';src:url('assets/fonts/SF-Pro.woff2') format('woff2');font-weight:100 1000;font-style:normal;font-display:block}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{
  font-family:"SF Pro",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color:var(--text); overscroll-behavior-y:none; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;outline:none}
img{-webkit-user-drag:none;user-select:none;display:block}
::-webkit-scrollbar{display:none}

/* Apple's tracking table, per size (pt) — applied by role, never guessed. */
.t34{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px}
.t28{font-size:28px;font-weight:700;letter-spacing:.36px;line-height:34px}
.t22{font-size:22px;font-weight:700;letter-spacing:.35px;line-height:28px}
.t20{font-size:20px;font-weight:700;letter-spacing:.38px;line-height:25px}
.t17{font-size:17px;font-weight:400;letter-spacing:-.41px;line-height:22px}
.t16{font-size:16px;font-weight:600;letter-spacing:-.32px;line-height:21px}
.t15{font-size:15px;font-weight:400;letter-spacing:-.24px;line-height:20px}
.t13{font-size:13px;font-weight:400;letter-spacing:-.08px;line-height:18px}
.t12{font-size:12px;font-weight:600;letter-spacing:0;line-height:16px}
.t11{font-size:11px;font-weight:500;letter-spacing:.07px;line-height:13px}

.sfi{display:inline-block;flex:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.press{transition:transform .16s var(--ease), opacity .16s var(--ease)}
.press:active{transform:scale(.94);opacity:.82}

/* =============================== view stack ============================== */
.view{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--bg);
  -webkit-overflow-scrolling:touch; max-width:390px; margin:0 auto;
}
/* push/pop: measured travel is 100% in, exactly 30.0% out (v2 pts 178-202:
   outgoing/incoming displacement ratio held at 351/1170 = 0.300 on every frame) */
.view.push-in{animation:pushIn var(--d-push) var(--e-push) both}
.view.push-under{animation:pushUnder var(--d-push) var(--e-push) both}
.view.pop-out{animation:popOut var(--d-push) var(--e-push) both}
.view.pop-back{animation:popBack var(--d-push) var(--e-push) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pushUnder{from{transform:translateX(0)}to{transform:translateX(-30%)}}
@keyframes popOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes popBack{from{transform:translateX(-30%)}to{transform:translateX(0)}}

/* ================================ browse ================================= */
/* measured: large-title baseline y=79.7pt; search field 101.7–146; card 147.3–341 */
#browse{padding:0 var(--pad) 190px;position:fixed}
/* top-of-list ambient wash — sampled from video-2 f13, x-uniform, dies at 214pt */
#browse::before{
  content:"";position:absolute;top:0;left:-16px;right:-16px;height:214px;z-index:-1;
  background:linear-gradient(to bottom,
    rgb(19,0,84) 0, rgb(19,0,82) 47px, rgb(20,0,72) 60.3px, rgb(16,0,62) 73.7px,
    rgb(9,2,52) 87px, rgb(2,4,44) 100.3px, rgb(0,5,36) 113.7px, rgb(0,5,31) 127px,
    rgb(0,7,25) 140.3px, rgb(0,5,22) 153.7px, rgb(0,4,19) 167px, rgb(0,1,15) 180.3px,
    rgb(0,1,11) 193.7px, rgb(1,0,2) 207px, rgb(0,0,0) 214px);
}
.bigtitle{
  padding-top:calc(var(--safe-t) + 7.5px);
  height:calc(var(--safe-t) + 40.4px);
  display:flex;align-items:flex-end;
}
/* collapsed nav that cross-fades in on scroll (reference: v2 f40) */
#navbar{
  position:fixed;left:0;right:0;top:0;z-index:30;max-width:390px;margin:0 auto;
  padding:calc(var(--safe-t) + 4px) var(--pad) 8px;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
  background:linear-gradient(to bottom, rgba(6,6,14,.86) 60%, rgba(6,6,14,0));
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
}
body.scrolled #navbar{opacity:1;pointer-events:auto}
#navbar .nt{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.41px;line-height:22px}

.field{
  display:flex;align-items:center;gap:9px;height:44px;border-radius:22px;padding:0 15px;
  background:rgba(120,124,150,.13);
  -webkit-backdrop-filter:var(--blur-lite);backdrop-filter:var(--blur-lite);
  box-shadow:inset 0 0 0 .5px var(--spec-soft);
}
.field input{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font-size:17px;letter-spacing:-.41px}
.field input::placeholder{color:rgba(235,235,245,.42)}
#browse .field{margin-top:14.7px}

/* Top figures card — reference "Top Reciters / This month", y 147.3–341 (194pt) */
.topcard{
  position:relative;margin-top:2px;height:187px;border-radius:24px;overflow:hidden;
  background:linear-gradient(to bottom,rgb(31,32,36) 0%,rgb(29,29,29) 9%,rgb(18,18,18) 59%,rgb(7,7,7) 87%,rgb(2,2,2) 100%);
  display:block;width:100%;text-align:left;
}
.topcard .fan{position:absolute;left:0;right:0;top:23px;height:108px;
  display:flex;align-items:center;justify-content:center;gap:15.3px}
.topcard .fan span{border-radius:50%;overflow:hidden;background:#151515;flex:none;
  box-shadow:0 0 0 3px #101010}
.topcard .fan span:nth-child(1){width:66px;height:66px}
.topcard .fan span:nth-child(2){width:108px;height:108px}
.topcard .fan span:nth-child(3){width:66px;height:66px}
.topcard .fan img{width:100%;height:100%;object-fit:cover;object-position:top center}
.topcard .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:600;background:linear-gradient(150deg,#C4783A,#7C4318)}
.topcard .tc-t{position:absolute;left:16px;bottom:31.2px;font-size:17px;font-weight:600;
  letter-spacing:-.41px;line-height:22px}
.topcard .tc-s{position:absolute;left:16px;bottom:10.5px;font-size:15px;letter-spacing:-.24px;
  line-height:20px;color:rgba(235,235,245,.6)}
.topcard .tc-c{position:absolute;right:14.5px;bottom:19.5px;line-height:0}

.sect{margin-top:31.3px}
.sect-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:10px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:.35px;line-height:28px;
  display:flex;align-items:center;gap:9px;min-width:0}
.sect-head .seeall{font-size:15.5px;font-weight:400;letter-spacing:-.24px;color:var(--blue);flex:none}
.starmark{filter:drop-shadow(0 0 9px rgba(255,214,10,.45))}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px;min-width:0;
  background:none;border:none;padding:0}
.discwrap{position:relative;display:block}
.disc{display:block;border-radius:50%;overflow:hidden;position:relative;flex:none;background:#151515}
.disc img{width:100%;height:100%;object-fit:cover;object-position:top center}
.pcard .disc{width:106px;height:106px;max-width:28.4vw;max-height:28.4vw}
.badge-new{position:absolute;top:1px;right:-4px;z-index:2;background:var(--green);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.2px;border-radius:8px;padding:2px 7px}
.pcard .pname{font-size:17px;line-height:22px;letter-spacing:-.41px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  height:44px}

/* ======================= bottom dock: pill + tab bar ====================== */
/* measured @3x: bar y 2285–2466 (h 60.3), x 67–898; circle Ø65.3 centered on
   the same axis; mini pill y 2135–2259 (h 41.3), gap to bar 8.7             */
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:390px;margin:0 auto;
  padding:0 22px 19.7px;pointer-events:none;
}
#dock>*{pointer-events:auto}

#minipill{
  width:100%;height:41px;border-radius:21px;display:flex;align-items:center;gap:9px;
  padding:0 14px 0 6px;text-align:left;margin-bottom:8.7px;
  /* measured: the reference pill over the detail list card (rgb 24) reads
     rgb 26 — transmission ~91%. It is visible almost entirely by its specular
     edge (rgb 58 over the 26 fill => white at .14), not by its fill.          */
  background:rgba(50,50,58,.10);
  -webkit-backdrop-filter:var(--blur-dock);backdrop-filter:var(--blur-dock);
  box-shadow:inset 0 0 0 .55px rgba(255,255,255,.14), 0 8px 26px rgba(0,0,0,.42);
  transform:translateY(180%);opacity:0;
  transition:transform .5s var(--ease), opacity .3s var(--ease);
}
body.has-track #minipill{transform:none;opacity:1}
#minipill .art{width:29px;height:29px;border-radius:8px;overflow:hidden;flex:none;background:#222}
#minipill .art img{width:100%;height:100%;object-fit:cover;object-position:top center}
#minipill .mp-meta{flex:1;min-width:0}
#minipill .mp-t{display:block;font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:17px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minipill .mp-s{display:block;font-size:12.5px;letter-spacing:-.08px;line-height:15px;
  color:rgba(235,235,245,.56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minipill .mp-btn{width:30px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}

#tabrow{display:flex;align-items:center;gap:4px}
#tabbar{
  flex:1;min-width:0;height:61.7px;border-radius:31px;display:flex;align-items:stretch;
  padding:0 9px;
  background:var(--glass-bar);
  -webkit-backdrop-filter:var(--blur-dock);backdrop-filter:var(--blur-dock);
  box-shadow:inset 0 0 0 .5px var(--spec-soft), 0 8px 26px rgba(0,0,0,.42);
}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.5px;position:relative;z-index:0;color:rgba(255,255,255,.98)}
.tab .lbl{font-size:10px;font-weight:500;letter-spacing:.12px;line-height:8px;
  white-space:nowrap;position:relative;top:-2px}
/* active capsule: measured 43.7pt tall inside a 61.7pt bar, 11.3pt from its top */
.tab.on::before{content:"";position:absolute;left:0;right:0;top:11.3px;height:43.7px;
  border-radius:21.9px;background:rgba(255,255,255,.11);z-index:-1}
#tabsearch{
  width:65px;height:65px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bar);
  -webkit-backdrop-filter:var(--blur-dock);backdrop-filter:var(--blur-dock);
  box-shadow:inset 0 0 0 .5px var(--spec-soft), 0 8px 26px rgba(0,0,0,.42);
}
/* collapsed dock — measured on the reference's pushed/scrolled pages:
   three 48pt-tall elements, 28pt side inset, 8.3pt gaps, 28.3pt above the
   screen bottom (the expanded tab bar is 61.7pt at a 22pt inset)             */
body.scrolled #dock,body.detail-open #dock{
  display:flex;flex-direction:row;align-items:center;gap:8.3px;padding:0 28px 28.3px;
}
body.scrolled #tabrow,body.detail-open #tabrow{display:contents}
body.scrolled #tabbar,body.detail-open #tabbar{
  order:1;flex:none;width:48px;height:48px;border-radius:24px;padding:0;
}
body.scrolled .tab,body.detail-open .tab{display:none}
body.scrolled .tab.on,body.detail-open .tab.on{display:flex;flex:1}
body.scrolled .tab.on::before,body.detail-open .tab.on::before{display:none}
body.scrolled .tab.on .lbl,body.detail-open .tab.on .lbl{display:none}
body.scrolled #minipill,body.detail-open #minipill{
  order:2;flex:1;min-width:0;height:48px;border-radius:24px;margin:0;padding:0 16px 0 7px;
}
body.scrolled #minipill .art,body.detail-open #minipill .art{width:34px;height:34px;border-radius:9px}
body.scrolled #tabsearch,body.detail-open #tabsearch{order:3;width:48px;height:48px}
#tabbar,#minipill,#tabsearch{transition:height .34s var(--ease), width .34s var(--ease),
  border-radius .34s var(--ease), transform .5s var(--ease), opacity .3s var(--ease)}

/* ================================ detail ================================= */
#detail{padding-bottom:190px}
.hero{position:relative;height:437px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center top;will-change:transform}
.hero .fade{position:absolute;inset:0;/* measured: the reference hero is essentially unfaded to 76% of its height
   (turban still reads 253/255 at y=1000 @3x) and only then falls steeply     */
background:linear-gradient(to bottom,
  transparent 0%, transparent 62%, rgba(0,0,0,.10) 70%, rgba(0,0,0,.30) 78%,
  rgba(0,0,0,.60) 85%, rgba(0,0,0,.85) 92%, #000 99%)}
.hero-top{position:absolute;top:calc(var(--safe-t) + 4px);left:var(--pad);right:var(--pad);
  display:flex;justify-content:space-between;align-items:center;z-index:3}
.gcircle{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(120,124,150,.24);
  -webkit-backdrop-filter:var(--blur-lite);backdrop-filter:var(--blur-lite);
  box-shadow:inset 0 0 0 .5px var(--spec-soft);
}
/* the reference's top-right is a two-item glass group, not two loose circles */
.ggroup{display:flex;align-items:center;height:44px;border-radius:22px;overflow:hidden;
  background:rgba(120,124,150,.24);
  -webkit-backdrop-filter:var(--blur-lite);backdrop-filter:var(--blur-lite);
  box-shadow:inset 0 0 0 .5px var(--spec-soft)}
.ggroup button{width:49px;height:44px;display:flex;align-items:center;justify-content:center}
.ggroup .sep{width:.5px;align-self:stretch;background:rgba(255,255,255,.14)}

.hero-body{position:absolute;left:var(--pad);right:var(--pad);bottom:7px;z-index:2;text-align:center}
.hero-name{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px;
  text-shadow:0 1px 22px rgba(0,0,0,.5)}
.hero-sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;
  font-size:17px;letter-spacing:-.41px;line-height:22px;color:rgba(235,235,245,.9)}
.hero-sub .dot{width:12px;height:12px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:8px;font-weight:700;
  background:#2E9E22;color:#fff}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:15.8px}
.act-circle{width:44px;height:44px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;background:#242424}
.act-circle.faved .sfi{background-color:#FFD60A!important}
.playpill{height:43.3px;min-width:91px;border-radius:21.7px;background:#fff;color:#000;
  font-size:17px;font-weight:600;letter-spacing:-.41px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px}

.bio-wrap{margin:15.7px var(--pad) 0}
.bio{font-size:13px;line-height:16px;letter-spacing:-.08px;color:rgba(235,235,245,.6);display:inline}
.bio-more{color:var(--blue);font-size:13px;letter-spacing:-.08px;display:inline;margin-left:4px}

.epsect{margin:20.6px var(--pad) 0}
.epsect-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20.4px}

/* ======================== player (full-screen sheet) ====================== */
/* Vertical skeleton, measured @3x then /3:
   grab 54–59.3 | pill 87–123 | disc 534.3–578.3 | controls c=627.5
   scrub 687–693.7 | times baseline 723 | bottom icons c=774.5              */
#player{
  position:fixed;inset:0;z-index:60;max-width:390px;margin:0 auto;background:#000011;
  display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 7px) 24px 47.5px;
  transform:translateY(100%);overflow:hidden;transform-origin:50% 50%;
  /* PRESENT — v1 pts 8-18: the same sheet spring as the about sheet
     (dy 906 -> 709 across one frame = r 0.78/frame), so it shares --e-sheetup. */
  transition:transform var(--d-sheetup) var(--e-sheetup);
  border-radius:0;
}
#player.show{transform:none}
/* DISMISS — re-measured in round 4 by tracking the white scrub bar (its pixel
   length gives the scale directly, its centre gives the translation) across
   v1 pts 1118-1132, cross-checked with a 3-parameter image registration.
   Round 3 had the SCALE right but every translateY exactly half the truth:
        scale  .979  .959  .928  .892  .862
        ty r3   13    25    44    66    84   pt
        ty ref  17    50    86   127   160   pt      <- measured
   The sheet does not settle at -100px; it keeps accelerating downward and
   leaves the bottom of the screen (ty 314pt by pts 1132) while fading.
   Times below are t-pts1122, i.e. after the finger's hold, over 200ms.
   Caveat, stated honestly: the only dismissal in the recordings is a finger
   drag + release, so the tail past 133ms is an extrapolation of the measured
   trend, not a measurement.                                                  */
#player.dismissing{
  animation:sheetDismiss .2s linear forwards;   /* the shape is in the keyframes */
  transition:none;
}
@keyframes sheetDismiss{
   0%  {transform:none;border-radius:0;opacity:1}
   8.35%{transform:translate(3px,25px)  scale(.978);border-radius:24px;opacity:1}
  16.7%{transform:translate(7px,59px)  scale(.949);border-radius:24px;opacity:1}
  25%  {transform:translate(13px,98px) scale(.914);border-radius:24px;opacity:1}
  33.4%{transform:translate(19px,129px)scale(.886);border-radius:24px;opacity:1}
  50%  {transform:translate(32px,174px)scale(.863);border-radius:24px;opacity:1}
  58.5%{transform:translate(34px,211px)scale(.849);border-radius:24px;opacity:.92}
  66.7%{transform:translate(36px,251px)scale(.840);border-radius:24px;opacity:.74}
  75%  {transform:translate(38px,300px)scale(.833);border-radius:24px;opacity:.52}
 100%  {transform:translate(42px,400px)scale(.820);border-radius:24px;opacity:0}
}
/* live finger tracking while dragging */
#player.dragging{transition:none}
/* ===================== AMBIENT FIELD (rebuilt, round 4) =====================
   Round 3 fitted this to a SINGLE still (f_player.png) and got the shape, the
   extent and the horizontal bias wrong at every other moment of the loop.
   Round 4 re-derives it from the whole cycle: 88 player-only frames of video 1
   (pts 0-356, i.e. one full period plus the previous tail), sampled on 102
   content-free probes (vertical lanes at x=20 / x=1150, horizontal lanes at
   y=1555 / y=2440), then a physical layer model was fitted to all of them at
   once with least-squares (scratchpad/r4/fitfield7.py, scratchpad/r4/fit7.json).

   What the measurement actually says, and what round 3 had wrong:
   * The glow NEVER climbs above y~1100 @3x (43% of the screen). At every one of
     the 88 frames, y=400 / y=700 / y=1000 read blue 17-18, i.e. pure #000011.
   * It is TWO lobes, not one: a right-hand column anchored off the bottom-right
     corner that pulses in place, and a left-hand column that rises AND blooms.
     The right lobe leads the left by ~30 frames, which is why the bottom of the
     screen is right-biased while the wash is rising (pts 216: bottom row
     224,201,175,164,178,216,253) and left-biased while it recedes (pts 340:
     254,248,229,209,198,206,222). A single translating layer cannot do that.
   * At the trough the field does not vanish: a static bottom-right corner glow
     and a shallow bottom floor remain (pts 160 bottom row 80,61,60,75,108,150,181).
     That residue is .fld-base, fitted to the trough frame alone: mean |dB| 1.29,
     max 7.2 over all 102 probes.
   * Period: successive troughs are 300 frames apart at 60fps => 5.000s
     (round 3 used 4.967s).
   Phase 0 == the trough == video-1 pts 160.  ?phase=0..1 still freezes it.     */
#player .fld{position:absolute;inset:0;z-index:0;pointer-events:none}
/* the two animated layers are drawn into a box twice the size of the player,
   because translating/scaling an inset:0 layer drags its own edge into view
   and the field simply stops (that cost the bottom 207px at pts 216). All
   their percentages below are therefore halved / re-centred accordingly. */
#player .fld-r,#player .fld-l{inset:-50%}
#player .fld-base{background:
    /* SL  static left corner */
    radial-gradient(16.25% 24.9% at 1.709% 116.5%,
      rgba(84,21,255,0.7686) 0%,
      rgba(0,110,255,0.6991) 51.63%,
      rgba(0,73,255,0.2642) 61.95%,
      rgba(0,73,255,0) 100%),
    /* SR  static right corner */
    radial-gradient(65.05% 42.81% at 101.2% 113.4%,
      rgba(61,255,255,0.99) 0%,
      rgba(0,114,255,0.6243) 35.99%,
      rgba(0,135,255,0.2114) 58.57%,
      rgba(0,135,255,0) 100%),
    /* static bottom floor */
    linear-gradient(to bottom, rgba(6,134,255,0) 81.99%, rgba(6,134,255,0.2271) 100%);}
#player .fld-r{transform-origin:71.5% 89.17%;background:
    /* PR  right pulse */
    radial-gradient(31% 24.19% at 71.5% 89.17%,
      rgba(98,255,255,0.99) 0%,
      rgba(0,148,255,0.99) 47.18%,
      rgba(0,85,255,0.7065) 65.45%,
      rgba(0,85,255,0) 100%);}
#player .fld-l{transform-origin:28.92% 75.59%;background:
    /* PL  left riser */
    radial-gradient(26.9% 15.35% at 28.92% 75.59%,
      rgba(109,255,255,0.99) 0%,
      rgba(0,107,255,0.99) 34.83%,
      rgba(0,56,255,0.2232) 75.82%,
      rgba(0,56,255,0) 100%);}

}

#player .fld-l{animation-name:fldL}

  /* measured: pure fade, NO scale. Open and close are different curves and
     different durations, so they are declared on the two states separately. */
  transition:opacity var(--d-qclose) var(--e-qclose);
}

/* =============================== about sheet ============================= */
/* reference: full-bleed blurred backdrop, X circle top-left, centred portrait
   (Ø 100), name 24 bold, meta row, body 17/26 with paragraph gaps           */
#about{
  position:fixed;inset:0;z-index:80;overflow-y:auto;max-width:390px;margin:0 auto;
  background:rgba(28,28,30,.62);
  /* reference sigma 44.5 CSS px (6 observation frames, spread +-0.15,
     model explains 99.2% of variance); 44.5/0.96 = 46 declared */
  -webkit-backdrop-filter:blur(46px) saturate(1.35);backdrop-filter:blur(46px) saturate(1.35);
  /* MEASURED (v2 pts 392-424): this is a SHEET THAT SLIDES UP, not a cross-fade.
     The sheet is fully opaque from its first visible frame; only translateY
     changes (2532px -> 0 over 567ms on the spring above). Its corner radius is
     ~38pt while travelling and 0 once it lands (the settled reference frame is
     full-bleed to the corners: rgb(67,81,80) at (2,0)).                        */
  transform:translateY(100%);pointer-events:none;
  border-radius:38px 38px 0 0;
  transition:transform var(--d-sheetup) var(--e-sheetup),

/* Reduce Motion asks for less LARGE positional movement — it does not ask for a
   dead interface. The previous blanket `animation-duration:.01ms !important` on
   every element made each screen snap into place with no movement at all, which
   reads as a slide deck rather than an app. Here the slides become cross-fades at
   the same measured durations: nothing travels across the screen, but everything
   still moves. */
@media (prefers-reduced-motion:reduce){
  @keyframes pushIn{from{opacity:0}to{opacity:1}}
  @keyframes popOut{from{opacity:1}to{opacity:0}}
  @keyframes pushUnder{from{opacity:1}to{opacity:1}}
  @keyframes popBack{from{opacity:1}to{opacity:1}}
  #player{transition:transform 1ms linear, opacity var(--d-sheetup) var(--e-sheetup);opacity:0}
  #player.show{opacity:1}
  #player.dismissing{animation:none;transition:opacity .2s linear;opacity:0}
  .eq i{animation:none;height:11px}
}

<script>
/* ============ SF Symbols (real glyphs, CSS-mask tinted) ============ */
const sfi=(n,s,c='currentColor')=>`<i class="sfi" style="--m:url(assets/sf/${n}.svg);width:${s}px;height:${s}px;background-color:${c}"></i>`;
const IC = {
  play:(s=24,c='#fff')=>sfi('play_fill',s,c),
  pause:(s=24,c='#fff')=>sfi('pause_fill',s,c),
  rw:(s=35,c='#fff')=>sfi('backward_fill',s,c),
  ff:(s=35,c='#fff')=>sfi('forward_fill',s,c),
  bigplay:()=>sfi('play_fill',48),
  bigpause:()=>sfi('pause_fill',48),
  star:(s=24,filled=false)=>sfi(filled?'star_fill':'star',s,filled?'#FFD60A':'#fff'),
  search:(s=18,c='rgba(235,235,245,.5)')=>sfi('search',s,c),
  chevL:(s=20,c='#fff')=>sfi('chevron_left',s,c),
  chevR:(s=18,c='rgba(235,235,245,.5)')=>sfi('chevron_right',s,c),
  chevD:(s=15,c='#DCDCE6')=>sfi('chevron_down',s,c),
  x:(s=17,c='#fff')=>sfi('xmark',s,c),
  info:(s=21,c='#fff')=>sfi('info_circle',s,c),
  shuffle:(s=22,c='#fff')=>sfi('shuffle',s,c),
  repeat:(s=22,one=false,c='#fff')=>sfi(one?'repeat_1':'repeat',s,c),
  vol:(s=25,muted=false,c='rgba(235,241,255,.62)')=>sfi(muted?'speaker_slash_fill':'speaker_1_fill',s,c),
  list:(s=28,c='rgba(235,241,255,.62)')=>sfi('list_bullet',s,c),
  moon:(s=23,c='#979DB4')=>sfi('moon_zzz_fill',s,c),
  house:(s=25,c='#fff')=>sfi('house_fill',s,c),
  people:(s=25,c='#fff')=>sfi('person_2_fill',s,c),
  grid:(s=25,c='#fff')=>sfi('square_grid_2x2_fill',s,c),
  gear:(s=25,c='#fff')=>sfi('gear_alt_fill',s,c),
  check:(s=17,c='#2E9E22')=>sfi('checkmark',s,c),
  ellipsis:(s=20,c='rgba(235,235,245,.5)')=>sfi('ellipsis',s,c),
  /* airplayaudio: concentric arcs broken at the bottom + a triangle */
  airplay:(s=27,c='rgba(235,241,255,.62)')=>`<svg width="${s}" height="${s*.9}" viewBox="0 0 28 25.2" style="fill:none;stroke:${c};stroke-width:1.85;stroke-linecap:round"><path d="M20.9 20.4a9.8 9.8 0 10-13.8 0"/><path d="M17.6 17.4a5.2 5.2 0 10-7.2 0"/><circle cx="14" cy="12.6" r="1.35" style="fill:${c};stroke:none"/><path d="M14 16.9l4.4 7.1H9.6z" style="fill:${c};stroke:none"/></svg>`,
};

/* ============ people meta (category · descriptor · bio) ============ */
const META = {
 "Elon Musk":{cat:"business",sub:"SpaceX · Tesla · PayPal",bio:"Serial founder running the most ambitious industrial portfolio in history — rockets, cars, energy, tunnels, AI.\n\nThe episodes trace how he actually works: reasoning from first principles, setting insane deadlines, and committing everything he has, every time."},
 "Jeff Bezos":{cat:"business",sub:"Amazon · Blue Origin",bio:"Built Amazon from a garage bookstore into an everything company through long-term thinking, customer obsession, and written narratives instead of slides.\n\nHis shareholder letters are the closest thing modern business has to a syllabus."},
 "Bill Gates":{cat:"business",sub:"Microsoft",bio:"Co-founded Microsoft at nineteen and out-worked and out-positioned everyone through software's land-grab decade.\n\nA case study in leverage, focus, and knowing the whole board better than anyone playing on it."},
 "Jensen Huang":{cat:"business",sub:"Nvidia",bio:"Thirty-plus years running Nvidia from arcade graphics chips to the engine of the AI era — the longest-serving founder-CEO in tech.\n\nObsessed with work as craft, pain as fuel, and building for markets that don't exist yet."},
 "Mark Zuckerberg":{cat:"business",sub:"Facebook / Meta",bio:"Dropped out at nineteen and turned a dorm-room project into a communications empire, refusing to sell at every price on the way."},
 "Steve Jobs":{cat:"business",sub:"Apple · Pixar",bio:"Founded Apple twice — the second time from the ashes — and built the most valuable products company in history on taste, focus, and saying no.\n\nSenra has covered him more than anyone: the episodes span his heroes, his exile, and his return."},
 "John D. Rockefeller":{cat:"business",sub:"Standard Oil",bio:"Turned one Cleveland refinery into Standard Oil, history's most disciplined monopoly, through cost accounting, silence, and patience.\n\nThe most-covered founder in the catalog for a reason: every mechanism is on display."},
 "Andrew Carnegie":{cat:"business",sub:"Carnegie Steel",bio:"Scottish telegraph boy who became the richest man in the world by riding technological shifts and hiring men smarter than himself — then spent the rest of his life giving it all away."},
 "Henry Ford":{cat:"business",sub:"Ford Motor Company",bio:"Put the world on wheels by obsessing over one product at one falling price, and relentlessly removing waste from the production line.\n\nToday and Tomorrow — his 1926 book — reads like the source code for Toyota."},
 "Edwin Land - Polaroid":{cat:"business",sub:"Polaroid",bio:"Steve Jobs's hero. Ran Polaroid as an instrument for turning science into products people didn't know they needed — thirty years before the iPhone playbook existed."},
 "Intel - Noyce Grove Shockley":{cat:"business",sub:"Intel",bio:"Noyce, Grove, and the physics-to-fab lineage that invented the integrated circuit and then survived every wave that killed its rivals.\n\nGrove's paranoia is doctrine; Noyce's optimism is the counterweight."},
 "Peter Thiel":{cat:"business",sub:"PayPal · Palantir · Founders Fund",bio:"Contrarian operator behind PayPal, Palantir, and the sharpest question in tech: what important truth do very few people agree with you on?"},
 "Alexander the Great":{cat:"military",sub:"King of Macedon",bio:"Conquered the known world by thirty and never lost a battle.\n\nThe founding case study in speed, logistics, shared hardship, and leading from the front."},
 "Napoleon":{cat:"military",sub:"Emperor of the French",bio:"Artillery officer who became Emperor and rewrote the art of war, administration, and ambition itself.\n\nSenra calls his biography one of the best books on the will to power ever written."},
 "Winston Churchill":{cat:"military",sub:"Britain",bio:"Half a century of failure, exile, and writing — then the one job only he could do.\n\nThe definitive study in endurance, preparation, and language as a weapon."},
 "Charles de Gaulle":{cat:"military",sub:"France",bio:"Rebuilt a nation's spine twice on sheer will and a refusal to be small. Statecraft as a study in identity."},
 "Nikola Tesla":{cat:"science",sub:"AC power · Invention",bio:"Inventor of the alternating-current world who saw entire machines complete in his mind — and died broke.\n\nThe cautionary half of the genius equation: invention without commercialization."},
 "J. Robert Oppenheimer":{cat:"science",sub:"Manhattan Project",bio:"The physicist who ran Los Alamos and delivered the atomic bomb in twenty-seven months.\n\nWith General Groves, the deepest study of scientific project leadership ever run."},
 "Claude Shannon":{cat:"science",sub:"Information theory",bio:"Invented information theory in a single paper and treated the frontier as a playground — juggling, unicycles, and the mathematics underneath the entire digital age."},
 "Vannevar Bush":{cat:"science",sub:"OSRD · Science policy",bio:"Ran American science during World War II — six thousand scientists pointed at one goal.\n\nThe blueprint for organizing research at scale."},
 "Alfred Lee Loomis":{cat:"science",sub:"Tuxedo Park · Rad Lab",bio:"Wall Street tycoon who built a private physics lab and bankrolled the radar work that arguably won the war before the bomb ended it."},
 "Demis Hassabis - DeepMind":{cat:"science",sub:"DeepMind",bio:"Chess prodigy and game designer who built DeepMind to solve intelligence itself — a live case study in organizing frontier research."},
 "Cornelius Vanderbilt":{cat:"money",sub:"Shipping · Railroads",bio:"The Commodore — ferries to steamships to railroads, crushing rivals with price wars and nerve for sixty straight years."},
 "J.P. Morgan":{cat:"money",sub:"Banking",bio:"The banker who reorganized America's railroads, bailed out the U.S. Treasury, and ran finance as a one-man central bank."},
 "The Rothschilds":{cat:"money",sub:"Banking dynasty",bio:"Five brothers in five cities running Europe's money as one organism — the original network business."},
 "Jacob Fugger":{cat:"money",sub:"Renaissance finance",bio:"The Renaissance banker who financed emperors and died the richest man who ever lived. Leverage, information, and God."},
 "James J. Hill":{cat:"money",sub:"Great Northern Railway",bio:"Built the only transcontinental railroad that never went bankrupt — by walking the ground himself, mile by mile, before laying track."},
 "Jim Simons":{cat:"money",sub:"Renaissance Technologies",bio:"Mathematician who left academia and built the best-performing investment machine in history by hiring scientists and trusting the model."},
 "Kelly Johnson - Skunk Works":{cat:"systems",sub:"Lockheed Skunk Works",bio:"Lockheed's chief engineer built the U-2 and SR-71 with tiny teams, absurd deadlines, and fourteen rules.\n\nThe manual for manufacturing capability itself."},
 "Ed Catmull - Pixar":{cat:"systems",sub:"Pixar",bio:"Co-founded Pixar and engineered the culture — Braintrust, candor, iteration — that shipped a string of masterpieces no other studio has matched."},
 "Bill Walsh":{cat:"systems",sub:"San Francisco 49ers",bio:"Took the worst team in football to three Super Bowls by scripting everything.\n\n'The score takes care of itself' is a complete operating system."},
};
const SECTIONS = [
 ["business","Business & industry"],
 ["military","War & statecraft"],
 ["science","Science & invention"],
 ["money","Money & markets"],
 ["systems","Capability factories"],
];

/* ============ state ============ */
/* Build stamp. An iOS home-screen web app has no reload button, so a cached
   index.html can persist across deploys with no way for the user to notice or
   clear it. On boot we compare this against version.txt (fetched no-store) and
   reload once if the served build is newer. sessionStorage guards the loop. */
const BUILD='20260826-1942';
(()=>{
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(v=>{
    v=(v||'').trim();
    if(v && v!==BUILD && !sessionStorage.getItem('fs.reloaded')){
      sessionStorage.setItem('fs.reloaded','1');
      location.reload();
    }
  }).catch(()=>{});
})();
let DATA=null, PORTRAITS=null;
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
(()=>{ const sv=qs.get('safe');
  if(sv){ document.documentElement.style.setProperty('--safe-t',(parseInt(sv)||47)+'px');
          document.documentElement.style.setProperty('--safe-b','34px'); }
  const ph=qs.get('phase');
  if(ph!==null){ document.body.classList.add('phase-lock');
    document.getElementById('player').style.setProperty('--pd',(-parseFloat(ph)*5)+'s'); } })();
const store = {
  get(k,d){ try{const v=localStorage.getItem('fs.'+k);return v===null?d:JSON.parse(v)}catch(e){return d} },
  set(k,v){ try{localStorage.setItem('fs.'+k,JSON.stringify(v))}catch(e){} },
};
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const epKey = (p,e) => p.slug+'::'+(e.n!==null?e.n:e.title);
const pos  = (p,e) => store.get('pos.'+epKey(p,e),0);
const done = (p,e) => store.get('done.'+epKey(p,e),false);
let cur=null, saveTick=0, scrubbing=false, shuffleOn=false, repeatOn=false;
let sleepUntil=null, sleepMin=0, muted=false;
let favs = store.get('favs',[]);
let curDetail=null, curTab='browse';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

const fmtDur = s => {s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~((s%3600)/60);return h?h+'h '+String(m).padStart(2,'0'):m+' min'};
const fmtClock = s => {s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~((s%3600)/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const mon = d => d? new Date(d).toLocaleDateString(undefined,{month:'short',year:'numeric'}) : '';

/* Feed titles are written for one global chronological stream, so most of them
   lead with the subject's name: on Steve Jobs's shelf eight rows in a row open
   with "Steve Jobs" and the part that actually distinguishes them ("The NeXT
   Years", "The Pixar Story") sits behind it. Inside a person's shelf that name
   is already established, so strip it when it is a leading prefix and promote
   what follows. Titles where the name is load-bearing rather than a prefix
   ("Becoming Steve Jobs", "Titan: The Life of John D. Rockefeller") are left
   whole — the name is not at the front, so nothing matches. */
function epTitle(p, e){
  const t = e.title;
  const short = p.shortName || p.name;
  const words = short.split(/\s+/);
  const vars = [p.name, short];
  if (words.length === 2) vars.push(words[1]);       // surname, only for "First Last"
  const uniq = [...new Set(vars.filter(v => v && v.length > 2))]
                 .sort((a, b) => b.length - a.length);
  for (const v of uniq){
    const q = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // "Name (Subtitle)" -> "Subtitle"
    let m = t.match(new RegExp('^' + q + '\\s*\\((.+)\\)\\s*$', 'i'));
    if (m && m[1].length > 2) return m[1];
    // "Name: X" / "Name - X" only. Conjunctions are excluded on purpose:
    // "Steve Jobs and His Heroes" must stay whole, not become "His Heroes".
    m = t.match(new RegExp('^' + q + '\\s*(?::|\\u2013|\\u2014|-)\\s*(.+)$', 'i'));
    if (m && m[1].length > 2) return m[1];
  }
  return t;
}

/* Each Founders episode is built on one book, and that book is what actually
   separates two episodes about the same person — "Steve Jobs" #5 is Isaacson,
   #204 is Kahney. So on a person's shelf the book is the headline and the
   author replaces the feed's global episode number, which carries no meaning
   once you are looking at one person rather than the whole chronology. */
const rowTitle = (p, e) => (e.book && e.book.trim()) ? e.book.trim() : epTitle(p, e);
const rowSub = (p, e) => {
  const a = (e.author || '').trim(), d = mon(e.date);
  return a ? a + ' · ' + d : d;
};

/* ============ browse (Shelf) ============ */
function renderBrowse(filter=''){
  const v=$('browse'); const f=filter.trim().toLowerCase();
  const people = DATA.people.filter(p=>!f||p.name.toLowerCase().includes(f)||p.shortName.toLowerCase().includes(f));
  const card = p => {
    const isNew = p.episodes.some(e=>e.date && e.date>='2026-01-01');
    return `<button class="pcard press" data-p="${p.slug}">
      <span class="discwrap">${isNew?'<span class="badge-new">NEW</span>':''}
        <span class="disc"><img loading="lazy" src="${PORTRAITS[p.name]}" alt="${esc(p.shortName)}"></span></span>
      <span class="pname">${esc(p.shortName)}</span></button>`;
  };
  const top = DATA.people.slice().sort((a,b)=>b.episodes.length-a.episodes.length).slice(0,3);
  let html = `<div class="bigtitle"><h1 class="t34">Founders</h1></div>
  <div class="field">${IC.search(18)}<input id="b-search" type="text" placeholder="Search figures" value="${esc(filter)}" autocomplete="off"></div>
  <button class="topcard press" id="topcard">
    <span class="fan">
      <span><img src="${PORTRAITS[top[1].name]}" alt=""></span>
      <span><img src="${PORTRAITS[top[0].name]}" alt=""></span>
      <span>${PORTRAITS[top[2].name]?`<img src="${PORTRAITS[top[2].name]}" alt="">`:`<span class="ini">${esc(top[2].shortName.split(' ').map(w=>w[0]).join('').slice(0,2))}</span>`}</span>
    </span>
    <span class="tc-t">Most covered</span>
    <span class="tc-s">All time</span>
    <span class="tc-c">${IC.chevR(20,'#fff')}</span>
  </button>`;
  const favp = people.filter(p=>favs.includes(p.name));
  if (favp.length) html += `<section class="sect">
      <div class="sect-head"><h2><span class="starmark">${sfi('star_fill',20,'#FFD60A')}</span>Your favourites</h2><span class="seeall">See all</span></div>
      <div class="pgrid">${favp.map(card).join('')}</div></section>`;
  for (const [key,label] of SECTIONS){
    const ps = people.filter(p=>(META[p.name]||{}).cat===key && !favs.includes(p.name));
    if (!ps.length) continue;
    html += `<section class="sect">
      <div class="sect-head"><h2>${label}</h2><span class="seeall">See all</span></div>
      <div class="pgrid">${ps.map(card).join('')}</div></section>`;
  }
  v.innerHTML = html;
  const si=$('b-search');
  si.addEventListener('input',()=>{ const val=si.value, sel=si.selectionStart;
    renderBrowse(val); const s2=$('b-search'); s2.focus(); s2.setSelectionRange(sel,sel); });
  $('topcard').onclick=()=>openDetail(top[0].slug);
  v.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>openDetail(b.dataset.p));
}

/* ============ scroll → collapsed nav + collapsed dock ============ */
function wireScroll(el){
  el.addEventListener('scroll',()=>{
    document.body.classList.toggle('scrolled', el.scrollTop>18);
  },{passive:true});
}

/* ============ push navigation ============ */
let navBusy=false;
function openDetail(pslug){
  if (navBusy) return; navBusy=true;
  const p=DATA.people.find(x=>x.slug===pslug); if(!p){navBusy=false;return}
  curDetail=p; renderDetail(p);
  const b=activeView(), d=$('detail');
  d.style.display='block'; d.scrollTop=0; document.body.classList.remove('scrolled');
  document.body.classList.add('detail-open');
  curTab='figures'; paintTabs();   /* a figure page belongs to the Figures tab */
  d.classList.add('push-in'); b.classList.add('push-under');
  setTimeout(()=>{ d.classList.remove('push-in'); b.classList.remove('push-under'); b.style.display='none'; navBusy=false; },440);
  history.pushState({v:'detail',p:pslug},'','#/p/'+pslug);
}
function activeView(){ return $(curTab==='figures'?'browse':curTab); }
function closeDetail(fromPop){
  if (navBusy) return; navBusy=true;
  const b=activeView(), d=$('detail');
  b.style.display='block';
  d.classList.add('pop-out'); b.classList.add('pop-back');
  setTimeout(()=>{ d.classList.remove('pop-out'); b.classList.remove('pop-back'); d.style.display='none';
    curDetail=null; navBusy=false; document.body.classList.toggle('scrolled', b.scrollTop>18); },400);
  document.body.classList.remove('detail-open');
  if (!fromPop) history.back();

function renderDetail(p){
  const v=$('detail');
  const m=META[p.name]||{sub:'',bio:''};
  let ndone=0; p.episodes.forEach(e=>{if(done(p,e))ndone++});
  const rows=p.episodes.map((e,i)=>{
    const isCur=cur&&cur.p.slug===p.slug&&cur.i===i;
    const dn=done(p,e), ps=pos(p,e), started=ps>60&&!dn;
    const tile=isCur?`<span class="eq${audio.paused?' paused':''}"><i></i><i></i><i></i></span>`:(i+1);
    const side= started? `<span class="lft">${fmtDur((e.sec||0)-ps)} left</span>`
              : dn? IC.check(17)
              : `<span>${fmtDur(e.sec)}</span>`;
    const prog= started? `<span class="ep-prog"><i style="width:${Math.min(99,100*ps/(e.sec||1))}%"></i></span>`:'';
    return `<button class="eprow press ${isCur?'active':''} ${dn?'done':''}" data-i="${i}">
      <span class="numtile">${tile}</span>
      <span class="ep-main"><span class="ep-t">${esc(rowTitle(p,e))}</span>
        <span class="ep-s">${esc(rowSub(p,e))}</span></span>
      <span class="ep-side">${side}${IC.ellipsis(20)}</span>${prog}</button>`;
  }).join('');
  const faved=favs.includes(p.name);
  v.innerHTML=`
    <div class="hero">
      <img id="heroimg" src="${PORTRAITS[p.name]}" alt="">
      <div class="fade"></div>
      <div class="hero-top">
        <button class="gcircle press" id="d-back">${IC.chevL(20)}</button>
        <div class="ggroup">
          <button class="press" id="d-fav">${IC.star(20,faved)}</button>
          <span class="sep"></span>
          <button class="press" id="d-info">${IC.info(21)}</button>
        </div>
      </div>
      <div class="hero-body">
        <div class="hero-name">${esc(p.shortName)}</div>
        <div class="hero-sub"><span class="dot">ƒ</span><span>${esc(m.sub||'')}</span></div>
        <div class="hero-actions">
          <button class="act-circle press" id="d-shuffle">${IC.shuffle(18)}</button>
          <button class="playpill press" id="d-play">${IC.play(15,'#000')} Play</button>
          <button class="act-circle press ${faved?'faved':''}" id="d-star">${IC.star(20,faved)}</button>
        </div>
      </div>
    </div>
    <div class="bio-wrap"><span class="bio" id="d-bio">${esc((m.bio||'').split('\n')[0])}</span><button class="bio-more" id="d-more">More</button></div>
    <div class="epsect">
      <div class="epsect-head"><h2>${p.episodes.length} episodes recorded</h2>
        ${ndone?`<span class="ep-side"><span>${ndone} done</span></span>`:''}</div>
      <div class="eplist">${rows}</div>
    </div>`;
  requestAnimationFrame(()=>{ const bio=$('d-bio'); if(!bio) return; const wrap=bio.parentElement;
    let words=bio.textContent.split(' '), guard=0;
    while(wrap.scrollHeight>40 && words.length>4 && guard++<250){
      words.pop(); bio.textContent=words.join(' ').replace(/[,.;:]$/,'')+'…';
    }
  });
  $('d-back').onclick=()=>closeDetail(false);
  $('d-info').onclick=()=>openAbout(p);
  $('d-more').onclick=()=>openAbout(p);
  $('d-fav').onclick=$('d-star').onclick=()=>{ toggleFav(p.name); renderDetail(p); };
  $('d-play').onclick=()=>{ playEp(p,resumeIndex(p),true); openPlayer(); };
  $('d-shuffle').onclick=()=>{ shuffleOn=true; playEp(p,~~(Math.random()*p.episodes.length),true); openPlayer(); paintQueueIcons(); };
  v.querySelectorAll('.eprow').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if (cur&&cur.p.slug===p.slug&&cur.i===i){ toggle(); refreshDetail(); return; }
    playEp(p,i,true); openPlayer();
  });
  v.onscroll=()=>{ const y=v.scrollTop, img=$('heroimg');
    document.body.classList.toggle('scrolled', y>18);
    /* measured: the reference hero scrolls 1:1 with the page (cross-correlated
       hero band vs content band over v2 f1110-1119 => ratio 1.000, no parallax).
       Only the pull-down overscroll stretches it. */
    if(img) img.style.transform = y<0 ? `scale(${1 + Math.min(60,-y)*.0016})` : 'none';
  };
}

function resumeIndex(p){
  let i=p.episodes.findIndex(e=>pos(p,e)>60&&!done(p,e));

/* ============ playback engine ============ */
function playEp(p,i,fromSaved){
  const e=p.episodes[i];
  cur={p,i};
  audio.src=e.url;
  const start=fromSaved?pos(p,e):0;
  audio.play().then(()=>{ if(start>5&&start<(e.sec||1)-20) audio.currentTime=start; }).catch(()=>{});
  audio.playbackRate=store.get('speed',1);
  audio.muted=muted;
  store.set('last',{slug:p.slug,i});
  document.body.classList.add('has-track');
  paintShells(); setMediaSession(p,e); renderQueue();
  if(curDetail) refreshDetail();
}
function toggle(){ if(!cur)return; audio.paused?audio.play():audio.pause(); }
function seekBy(d){ if(cur) audio.currentTime=Math.max(0,audio.currentTime+d); }
function nextEp(auto){
  if(!cur)return; const {p,i}=cur;
  if(repeatOn&&auto){ playEp(p,i,false); return; }
  if(shuffleOn){ const c=p.episodes.map((_,j)=>j).filter(j=>j!==i);
    if(c.length) playEp(p,c[~~(Math.random()*c.length)],true); return; }
  if(i+1<p.episodes.length) playEp(p,i+1,true);
}
function prevEp(){ if(cur&&audio.currentTime>10){audio.currentTime=0;return} if(cur&&cur.i>0) playEp(cur.p,cur.i-1,true); }

audio.addEventListener('timeupdate',()=>{
  if(!cur)return;
  const now=Date.now();
  if(now-saveTick>4000){ saveTick=now; store.set('pos.'+epKey(cur.p,cur.p.episodes[cur.i]),Math.round(audio.currentTime)); }
  if(sleepUntil&&now>=sleepUntil){ audio.pause(); sleepUntil=null; sleepMin=0; paintMoon(); }
  paintProgress();
});
audio.addEventListener('ended',()=>{
  if(!cur)return;
  const e=cur.p.episodes[cur.i];
  store.set('done.'+epKey(cur.p,e),true);
  store.set('pos.'+epKey(cur.p,e),0);
  nextEp(true);
});
audio.addEventListener('play',paintShells);
audio.addEventListener('pause',()=>{ paintShells();
  if(cur) store.set('pos.'+epKey(cur.p,cur.p.episodes[cur.i]),Math.round(audio.currentTime)); });

function setMediaSession(p,e){
  if(!('mediaSession' in navigator))return;
  const art=new URL(PORTRAITS[p.name],location.href).href;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:rowTitle(p,e),artist:p.shortName,album:'Founders',
    artwork:[{src:art,sizes:'800x800',type:'image/jpeg'}]});
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward',()=>seekBy(-15));
  navigator.mediaSession.setActionHandler('seekforward',()=>seekBy(30));
  navigator.mediaSession.setActionHandler('previoustrack',prevEp);
  navigator.mediaSession.setActionHandler('nexttrack',()=>nextEp(false));
  try{navigator.mediaSession.setActionHandler('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime})}catch(e){}
}

/* scrubbing */
let scrubT=0;
const bar=$('scrubbar');
function barSeek(clientX,commit){
  if(!cur)return;
  const r=bar.getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  const e=cur.p.episodes[cur.i];
  const d=audio.duration&&isFinite(audio.duration)?audio.duration:(e.sec||1);
  scrubT=f*d;
  $('scrubfill').style.width=(f*100)+'%';
  paintProgress();
  if(commit) audio.currentTime=scrubT;
}
bar.addEventListener('pointerdown',e=>{ scrubbing=true; bar.classList.add('grab'); bar.setPointerCapture(e.pointerId); barSeek(e.clientX,false); });
bar.addEventListener('pointermove',e=>{ if(scrubbing) barSeek(e.clientX,false); });
bar.addEventListener('pointerup',e=>{ if(scrubbing){ barSeek(e.clientX,true); scrubbing=false; bar.classList.remove('grab'); } });

/* swipe-down to dismiss the player */
(()=>{ let y0=null,x0=null,t0=0;
  const sh=$('player');
  sh.addEventListener('touchstart',e=>{ if(e.target.closest('#queue'))return;
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; t0=Date.now(); },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0===null||scrubbing)return;
    const dy=Math.max(0,e.touches[0].clientY-y0), dx=e.touches[0].clientX-x0;
    /* the reference tracks the finger: scale falls to .836 across ~550px of
       drag, matching the measured 1.000->.836 over the dismiss distance */
    const k=Math.min(1,dy/550), sc=1-.164*k;
    sh.classList.add('dragging');
    sh.style.transform=`translate(${dx*.06}px,${dy*.18}px) scale(${sc})`;
    sh.style.borderRadius=(24*Math.min(1,dy/60))+'px';
  },{passive:true});
  sh.addEventListener('touchend',e=>{ if(y0===null)return;
    const dy=e.changedTouches[0].clientY-y0, dt=Date.now()-t0;
    sh.classList.remove('dragging'); sh.style.transform=''; sh.style.borderRadius='';
    if(dy>80&&dt<900&&!scrubbing) closePlayer();
    y0=null; },{passive:true});
})();

Promise.all([fetch('episodes.json?v='+BUILD).then(r=>r.json()),
             fetch('portraits.json?v='+BUILD).then(r=>r.json())])
.then(([d,pr])=>{
  DATA=d;PORTRAITS=pr;

  if(m){const p=DATA.people.find(x=>x.slug===decodeURIComponent(m[1]));
    if(p){curDetail=p;renderDetail(p);$('browse').style.display='none';$('detail').style.display='block';document.body.classList.add('detail-open');curTab='figures';paintTabs();
      history.replaceState({v:'detail',p:p.slug},'','#/p/'+p.slug);}}

  const last=store.get('last',null);
  if(last){const p=DATA.people.find(x=>x.slug===last.slug);
    if(p&&p.episodes[last.i]){cur={p,i:last.i};document.body.classList.add('has-track');
      const e=p.episodes[last.i];
      audio.src=e.url;audio.preload='none';
      paintShells();
      const sv=pos(p,e);
      if(sv>5){ const dur=e.sec||1;
        $('scrubfill').style.width=(100*sv/dur)+'%';
        $('t-el').textContent=fmtClock(sv);$('t-rem').textContent='-'+fmtClock(Math.max(0,dur-sv));
        audio.addEventListener('loadedmetadata',()=>{audio.currentTime=sv},{once:true});
      }
    }}

  /* static-state hooks for pixel verification — never call audio.play() */
  const st=qs.get('state');
  if(st){
    const p=curDetail||DATA.people.slice().sort((a,b)=>b.episodes.length-a.episodes.length)[0];
    if(st==='about'){
      curDetail=p; renderDetail(p);
      $('browse').style.display='none'; $('detail').style.display='block';
      document.body.classList.add('detail-open'); curTab='figures'; paintTabs();
      const other=DATA.people.find(x=>x.slug!==p.slug)||p;
      cur={p:other,i:0}; document.body.classList.add('has-track'); paintShells();
      openAbout(p);
    }
    else if(st==='playlists'||st==='settings'){ goTab(st); }
    else if(st==='detail'&&!curDetail){
      curDetail=p; renderDetail(p);
      $('browse').style.display='none'; $('detail').style.display='block';
      document.body.classList.add('detail-open'); curTab='figures'; paintTabs();
      /* the reference has a DIFFERENT figure playing in the mini pill, so no
         row on this page is the active one — mirror that */
      const other=DATA.people.find(x=>x.slug!==p.slug)||p;
      cur={p:other,i:0}; document.body.classList.add('has-track'); paintShells();
      renderDetail(p);
    }
    else {
      cur={p,i:0}; document.body.classList.add('has-track');
      audio.src=p.episodes[0].url; paintShells();
      if(st==='player'||st==='queue') openPlayer();
      if(st==='queue'){ renderQueue(); openQueue(); }
      if(st==='scrolled'){ document.body.classList.add('scrolled'); }
    }
  }
});
</script>
</body>
</html>
