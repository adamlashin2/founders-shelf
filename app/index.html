/* Ionic owns drill-down motion and swipe-back. Avoid a second custom zoom layer:
   clipping and scaling two full pages at once caused 100–250 ms frames on image-heavy routes. */

/* In-place updates keep scroll and focus context. A single page fade avoids running
   dozens of FLIP animations over image grids and makes rapid filter taps interruptible. */
/* ===================== screen A -> screen B: Apple's zoom transition =====================
   Apple, WWDC24 "Enhance your UI animations and transitions" (10145): "the cell you tap morphs
   into the incoming view"; continuously interactive; the source is looked up again on zoom-out by
   a stable identifier. Curve: Apple's default spring, WWDC23 "Animate with springs" (10158):
   bounce 0, stiffness = (2pi/duration)^2, damping = 4pi/duration, mass 1, duration 0.5s
   (Apple's own zoom-session example). Computed, not eyeballed: 98.6% at 0.5s, settles at 735ms.
   Runs on Ionic's animation engine, so ion-nav's edge swipe scrubs it with the finger.
   Cards zoom into their figure page; rows and lists keep Ionic's iOS slide (Apple's drill-down). */
const APPLE_SPRING={dur:735,ease:'linear(0 0%, 0.0278 2.8%, 0.0942 5.6%, 0.1804 8.3%, 0.2739 11.1%, 0.3671 13.9%, 0.4553 16.7%, 0.5360 19.4%, 0.6080 22.2%, 0.6712 25.0%, 0.7259 27.8%, 0.7727 30.6%, 0.8123 33.3%, 0.8456 36.1%, 0.8735 38.9%, 0.8967 41.7%, 0.9158 44.4%, 0.9316 47.2%, 0.9445 50.0%, 0.9551 52.8%, 0.9638 55.6%, 0.9708 58.3%, 0.9765 61.1%, 0.9811 63.9%, 0.9848 66.7%, 0.9879 69.4%, 0.9903 72.2%, 0.9922 75.0%, 0.9938 77.8%, 0.9950 80.6%, 0.9960 83.3%, 0.9969 86.1%, 0.9975 88.9%, 0.9980 91.7%, 0.9984 94.4%, 0.9987 97.2%, 1 100%)'};
let ION=null;
import('https://cdn.jsdelivr.net/npm/@ionic/core@9.0.10/dist/esm/index.js').then(m=>{ ION=m;
  customElements.whenDefined('ion-nav').then(()=>{ navEl().animation=navAnimation; }); }).catch(()=>{});
/* the card for a figure, on the page underneath: matched by the figure's id (Apple: stable identifier) */
function zoomSource(view,slug){
  if(!view||!slug) return null;
  return [...view.querySelectorAll(`[data-p="${slug}"]`)].map(c=>c.querySelector('.art')||c).find(c=>{ const r=c.getBoundingClientRect();
    return r.width>40&&r.height>40&&r.bottom>0&&r.top<innerHeight; })||null; }
function navAnimation(baseEl,opts){
  const back=opts.direction==='back', fig=back?opts.leavingEl:opts.enteringEl, other=back?opts.enteringEl:opts.leavingEl;
  const route=fig&&fig.dataset.route||'', slug=route.startsWith('p/')?route.slice(2):null;
  const src=slug&&zoomSource(other,slug);
  if(!src||!ION) return ION?ION.iosTransitionAnimation(baseEl,opts):null;
  const figPage=fig.querySelector(':scope>.page'), otherPage=other.querySelector(':scope>.page');
  const box=baseEl.getBoundingClientRect(), c=src.getBoundingClientRect();
  const W=box.width, H=box.height, s=c.width/W, r=parseFloat(getComputedStyle(src).borderRadius)||20;
  /* the figure page, drawn at the card's size and place, clipped to the card's shape */
  const small={transform:`translate(${c.left-box.left}px,${c.top-box.top}px) scale(${s})`,clipPath:`inset(0px 0px ${Math.max(0,H-c.height/s)}px 0px round ${r/s}px)`,opacity:'1'};
  const full={transform:'translate(0px,0px) scale(1)',clipPath:'inset(0px 0px 0px 0px round 0px)',opacity:'1'};
  const figAni=ION.createAnimation().addElement(figPage).beforeStyles({'transform-origin':'0 0'}).afterClearStyles(['transform-origin','clip-path'])
    .keyframes(back?[{offset:0,...full},{offset:1,...small}]:[{offset:0,...small},{offset:1,...full}]);
  /* the screen it came from recedes and dims toward the ground */
  const rest={transform:'scale(1)',opacity:'1'}, away={transform:'scale(.94)',opacity:'.45'};
  const otherAni=ION.createAnimation().addElement(otherPage).beforeStyles({'transform-origin':'50% 40%'}).afterClearStyles(['transform-origin'])
    .keyframes(back?[{offset:0,...away},{offset:1,...rest}]:[{offset:0,...rest},{offset:1,...away}]);
  /* the card itself is the thing that becomes the page: hide it while its page is in flight */
  const srcAni=ION.createAnimation().addElement(src).beforeStyles({visibility:'hidden'}).afterClearStyles(['visibility']);
  return ION.createAnimation().addElement(opts.enteringEl).beforeRemoveClass('ion-page-invisible')
    .duration(APPLE_SPRING.dur).easing(APPLE_SPRING.ease).fill('both').addAnimation([figAni,otherAni,srcAni]);
}

/* images: mark decoded (cached images included), so .fade reveals them */
document.addEventListener('load',e=>{ const t=e.target; if(t.tagName==='IMG'&&t.classList.contains('fade')) t.classList.add('in'); },true);
document.addEventListener('error',e=>{ const t=e.target; if(t.tagName==='IMG'&&t.classList.contains('fade')) t.classList.add('in'); },true);
const revealDecoded=root=>root.querySelectorAll('img.fade:not(.in)').forEach(i=>{ if(i.complete&&i.naturalWidth) i.classList.add('in'); });
/* a screen settles in the first time it is shown (not on back, not on in-place updates) */
function settle(pg){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const c=pg.querySelector(':scope>.content')||pg; c.classList.add('settle');
  setTimeout(()=>c.classList.remove('settle'),1100); }

/* ===================== in-place morph (no page rebuild snap) =====================
   Filters, favourites, settings rows and history filters update the live page element in place:
   scroll is kept, moved items FLIP, new items rise in; the selected text tab's capsule slides
   (Ionic segment indicator: transform 260ms cubic-bezier(0.4,0,0.2,1)). */
const KEYS=['data-p','data-ep','data-history-item','data-fil','data-hfil','data-a','data-go','data-favp'];
function keyed(root){ const m=new Map(), seen={};
  root.querySelectorAll(KEYS.map(k=>`[${k}]`).join(',')).forEach(el=>{ const k=KEYS.find(a=>el.hasAttribute(a)); const id=k+'='+el.getAttribute(k);
    seen[id]=(seen[id]||0)+1; m.set(id+'#'+seen[id],el); }); return m; }
function morph(r){
  const pg=activePage(); if(!pg||pg.dataset.route!==r) return render(r,'none');
  const before=new Map(), vh=innerHeight;
  keyed(pg).forEach((el,id)=>{ const b=el.getBoundingClientRect(); if(b.bottom>-200&&b.top<vh+200&&b.width) before.set(id,b); });
  const segFrom=pg.querySelector('.chip.on')?.getBoundingClientRect(), st=pg.scrollTop;
  route=r; pg.innerHTML=build(r,false).innerHTML; pg.querySelectorAll('img.fade').forEach(i=>i.classList.add('in')); setTimeout(()=>bind(pg,r),0); paintChrome(); pg.scrollTop=st; wireNav(pg);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ease='cubic-bezier(0.32,0.72,0,1)';
  let n=0;
  keyed(pg).forEach((el,id)=>{ const a=el.getBoundingClientRect(); if(!(a.bottom>0&&a.top<vh&&a.width)) return;
    const b=before.get(id);
    if(b){ const dx=b.left-a.left, dy=b.top-a.top, sx=b.width/a.width, sy=b.height/a.height;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5||Math.abs(sx-1)>.01||Math.abs(sy-1)>.01)
        el.animate([{transformOrigin:'0 0',transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transformOrigin:'0 0',transform:'none'}],{duration:400,easing:ease}); }
    else el.animate([{opacity:0,transform:'translateY(10px) scale(.97)'},{opacity:1,transform:'none'}],{duration:260,easing:ease,fill:'backwards',delay:Math.min(n++*18,160)}); });
  const segOn=pg.querySelector('.chip.on');
  if(segFrom&&segOn){ const a=segOn.getBoundingClientRect();
    if(Math.abs(a.left-segFrom.left)>.5||Math.abs(a.width-segFrom.width)>.5){
      const cap=document.createElement('i'); cap.className='seg-fly';
      cap.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`; document.body.appendChild(cap);
      segOn.classList.add('seg-moving');
      cap.animate([{transform:`translateX(${segFrom.left-a.left}px) scaleX(${segFrom.width/a.width})`},{transform:'none'}],{duration:260,easing:'cubic-bezier(0.4,0,0.2,1)'})
        .finished.then(()=>{ cap.remove(); segOn.classList.remove('seg-moving'); });
      segOn.animate([{color:'var(--dim)'},{color:'var(--label)'}],{duration:160,easing:'linear'}); } }
}

function openPerson(s){ go('p/'+s); }

function build(r,bindPage=true){
  const el=document.createElement('div'); el.className='page';
  if(r==='home') el.innerHTML=pageHome();
  else if(r==='figures') el.innerHTML=pageFigures();
  else if(r==='library') el.innerHTML=pageLibrary();
  else if(r==='history') el.innerHTML=pageHistory();
  else if(r==='search') el.innerHTML=pageSearch();
  else if(r==='settings') el.innerHTML=pageSettings();
  else if(r==='system') el.innerHTML=pageSystem();
  else if(r.startsWith('p/')) el.innerHTML=pagePerson(BYSLUG[r.slice(2)]);
  else if(r.startsWith('l/')) el.innerHTML=pageList(r.slice(2));
  else el.innerHTML=pageHome();
  if(bindPage) setTimeout(()=>bind(el,r),0);
  return el;
}
/* large-title pages get a glass nav bar once the title scrolls away */
function wireNav(pg){
  const nb=$('navbar'), t=pg.querySelector('[data-title]');
  $('nbt').textContent=t?t.dataset.title:'';
  nb.innerHTML=`<span class="t-head" id="nbt">${esc(t?t.dataset.title:'')}</span>`+(depth(route)?`<button class="btn-icon press nb-back" data-a="back" aria-label="Back">${IC.back(20)}</button>`:'');
  const thr=t?t.offsetTop+t.offsetHeight-10:60, nbt=nb.querySelector('#nbt');
  const on=()=>{ const p=Math.max(0,Math.min(1,(pg.scrollTop-thr+28)/28)); nb.style.opacity=p; nb.classList.toggle('on',p>.5);
    if(nbt) nbt.style.transform=`translateY(${(1-p)*6}px)`; };
  pg.addEventListener('scroll',on,{passive:true}); on();
  nb.querySelector('[data-a=back]')?.addEventListener('click',back);
}

/* ============================== chrome ============================== */
function paintChrome(){
  const active=depth(route)?(route.startsWith('p/')?'figures':route==='settings'||route==='system'?'settings':route.startsWith('l/')?'library':lastTab):route;
  const tb=$('tabbar');
  const keepHL=$('tabhl')||Object.assign(document.createElement('span'),{id:'tabhl'});
  tb.innerHTML=TABS.map(([id,l,ic])=>`<button class="tab press${active===id?' on':''}" data-t="${id}"${active===id?' aria-current="page"':''}>${IC[ic](24)}<span class="lb">${l}</span></button>`).join('');
  tb.prepend(keepHL);
  tb.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const on=tb.querySelector('.tab.on'), hl=$('tabhl');
  placeHL();
  $('tabsearch').innerHTML=IC.search(26); $('tabsearch').classList.toggle('on',active==='search'); $('tabsearch').setAttribute('aria-keyshortcuts','Control+F Meta+F');
  if(active==='search') $('tabsearch').setAttribute('aria-current','page'); else $('tabsearch').removeAttribute('aria-current');
  $('tabsearch').onclick=()=>go('search');
  /* desktop: iPadOS 26 sidebar (refs pin 4604649247285910912 Photos, 1122663013395119080 Music) */
  const sb=(id,l,ic,extra='')=>{ const on=active===id||route===id; return `<button class="press${on?' on':''}" data-t="${id}"${on?' aria-current="page"':''}${extra}>${ic}<span>${l}</span></button>`; };
  $('topnav').innerHTML=`<button class="lg press" data-t="home" aria-label="The Greats"><img src="assets/icon-192.png?v=5" alt=""><span>The Greats</span></button>`+
    `<div class="nav-primary">${sb('search','Search',IC.search(19),' aria-keyshortcuts="Control+F Meta+F" title="Search (⌘F)"')}${TABS.map(([id,l,ic])=>sb(id,l,IC[ic](19))).join('')}</div>`+
    `<div class="nav-sect">Library</div><div class="nav-primary">${sb('l/favs','Favourites',IC.star(18))}${sb('l/continue','Continue',IC.play(16))}${sb('l/finished','Finished',IC.check(17))}</div>`+
    `<div class="nav-sect">Archive</div><div class="nav-primary">${sb('l/speeches','Speeches',sfi('speaker_2_fill',18))}${sb('l/letters','Letters',sfi('list_bullet',18))}${sb('l/edits','Edits',sfi('shuffle',17))}</div>`+
    `<div class="nav-tools">${sb('settings','Settings',IC.gear(18),' aria-keyshortcuts="Control+, Meta+," title="Settings (⌘,)"')}</div>`;
  $('topnav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
  { const tn=$('topnav'); let pill=window.__sbhl; if(!pill){ pill=document.createElement('span'); pill.id='sbhl'; window.__sbhl=pill; }
    tn.prepend(pill); const onB=tn.querySelector('button.on:not(.lg)');
    if(onB&&onB.offsetWidth){ pill.style.opacity=1; pill.style.height=onB.offsetHeight+'px'; pill.style.width=onB.offsetWidth+'px';
      pill.style.transform=`translate(${onB.offsetLeft}px,${onB.offsetTop}px)`; } else pill.style.opacity=0; }
}

/* the travelling tab highlight: placed synchronously (layout is sync), and again on resize */
function placeHL(){ const on=document.querySelector('#tabbar .tab.on'), hl=$('tabhl'); if(!hl) return;
  if(!on||!on.offsetWidth){ hl.style.opacity=0; return; } hl.style.opacity=1; hl.style.width=on.offsetWidth+'px'; hl.style.transform=`translateX(${on.offsetLeft-4}px)`; }

/* generated book jacket for one Founders episode */
function cover(p,k,e,i,{cls=''}={}){
  const isCur=cur&&cur.p===p&&cur.k===k&&cur.i===i, dn=done(p,e), ps=pos(p,e), st=ps>60&&!dn;
  const title=(e.book&&e.book.trim())||rowTitle(p,e);
  const [jacket,ink]=JACKETS[objectSeed(title+p.name)%JACKETS.length];
  const real=e.book&&COVERS[e.book.trim()];
  return `<span class="cover${isCur?' cur':''}${real?' real':''} ${cls}" style="--jacket:${jacket};--ink:${ink}"><img class="cimg fade" src="${real?real+'?v='+BUILD:thumbSrc(p)}" alt="" width="480" height="${real?720:640}" decoding="async" loading="lazy"><span class="no">The Greats · ${e.n?'No. '+e.n:KLABEL[k]}</span>
    <span class="ti">${esc(title)}</span><span class="mark" aria-hidden="true">${esc(p.shortName[0]||'G')}</span><span class="au">${esc((e.author||'').trim()||p.shortName)}</span>
    ${dn?`<span class="dn">${IC.check(11)}</span>`:''}${st?`<span class="pr"><i style="width:${Math.min(99,100*ps/(e.sec||1))}%"></i></span>`:''}</span>`;

function historyBucket(t){
  const d=new Date(t), now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(t>=today) return 'Today';

}
function historyWhen(t){
  const d=new Date(t), now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(t>=today) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if(t>=today-6*864e5) return d.toLocaleDateString(undefined,{weekday:'short'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function act(a,r){

  else if(a==='about'&&p) openAbout(p);
  else if(a==='play'&&p){ playEp(p,resumeIndex(p),'bio'); openNP(); }
  else if(a==='shuffle'&&p){ shuffleOn=true; playEp(p,~~(Math.random()*p.episodes.length),'bio'); openNP(); }
  else if(a==='speed'){ const o=[1,1.25,1.5,1.75,2]; const n=o[(o.indexOf(store.get('speed',1))+1)%o.length]; store.set('speed',n); audio.playbackRate=n; paintNP(); morph(r); }
  else if(a==='sleep'){ cycleSleep(); morph(r); }
  else if(a==='theme'){ const o=['system','light','dark']; store.set('theme',o[(o.indexOf(store.get('theme','system'))+1)%3]); applyTheme(); morph(r); }
  else if(a==='history-clear') clearHistoryTimeline();

/* ===================== overlays: Ionic ion-modal (the library itself) =====================
   Now Playing is an iOS card modal (presentingElement = the app, swipe down to close);
   sheets are iOS sheet modals with a grabber (breakpoints 0 / .6 / 1). Ionic runs the motion,
   the backdrop, swipe-to-close and focus handling. The app's nodes are moved in and back out. */
async function presentModal(node,{cls='',sheet=false,onGone}={}){
  await customElements.whenDefined('ion-modal');
  const m=document.createElement('ion-modal'); m.className='greats-modal '+cls;
  if(innerWidth<768&&sheet){
    m.breakpoints=[0,.55,.9]; m.initialBreakpoint=.55; m.backdropBreakpoint=0;
    m.handle=true; m.expandToScroll=false;
  } else if(innerWidth<768) m.presentingElement=navEl();
  const wrap=document.createElement('div'); wrap.className='ion-page modal-page';
  const home=node.parentNode, next=node.nextSibling; wrap.appendChild(node); m.appendChild(wrap); document.body.appendChild(m);
  document.body.classList.add('modal-open');
  m.addEventListener('ionModalWillDismiss',()=>{ if(document.querySelectorAll('ion-modal.show-modal').length<=1) document.body.classList.remove('modal-open'); },{once:true});
  m.addEventListener('ionModalDidDismiss',()=>{ try{ if(next&&next.parentNode===home) home.insertBefore(node,next); else home.appendChild(node); }catch(e){ home.appendChild(node); }
    onGone&&onGone(); requestAnimationFrame(()=>m.isConnected&&m.remove()); },{once:true});
  await m.present(); return m;
}

function openSheet(title,html){ const sheet=$('sheet'); sheetReturnFocus=document.activeElement; $('sht').textContent=title; $('shb').innerHTML=html;

  const go=()=>presentModal(sheet,{cls:'sheet-modal',sheet:true,onGone:()=>{ sheet.classList.remove('show'); sheet.setAttribute('aria-hidden','true'); sheetModal=null;
    if(sheetReturnFocus?.isConnected) sheetReturnFocus.focus(); sheetReturnFocus=null; }}).then(m=>{ sheetModal=m; });
  return sheetModal?sheetModal.dismiss().then(()=>new Promise(r=>setTimeout(r,0))).then(go):go(); }

function playEp(p,i,k='bio'){
  const e=items(p,k)[i]; if(!e) return;
  cur={p,i,k}; const start=pos(p,e), resume=start>5&&start<(e.sec||1)-20;
  /* seek BEFORE playing: a media fragment starts decoding at the saved position (no blip of the intro) */
  audio.src=e.url+(resume?'#t='+start:''); document.body.classList.add('buffering');
  audio.playbackRate=store.get('speed',1);
  audio.play().catch(()=>{});
  store.set('last',{slug:p.slug,i,k}); store.set('t.'+epKey(p,e),Date.now());
  document.body.classList.add('has-track'); paintNP(); setSession(p,e); refreshRows();
}
function toggle(){ if(!cur) return; audio.paused?audio.play():audio.pause(); }
/* next: your queue first, then the rest of this figure's list, then the next figure (never a dead end) */
function next(auto){ if(!cur) return; const L=items(cur.p,cur.k);
  while(upNext.length){ const q=upNext.shift(); saveQueue(); const p=BYSLUG[q.slug]; if(p&&items(p,q.k)[q.i]){ playEp(p,q.i,q.k); return; } }
  if(shuffleOn&&L.length>1){ let j; do j=~~(Math.random()*L.length); while(j===cur.i); playEp(cur.p,j,cur.k); return; }
  if(cur.i+1<L.length){ playEp(cur.p,cur.i+1,cur.k); return; }
  const ps=DATA.people, start=ps.indexOf(cur.p);
  for(let n=1;n<ps.length;n++){ const p=ps[(start+n)%ps.length], M=items(p,cur.k); const j=M.findIndex(e=>!done(p,e)); if(j>=0){ playEp(p,j,cur.k); toast('Up next: '+p.shortName); return; } }
  toast('You have finished everything here'); }

function queueEp(p,k,i,front){ const q={slug:p.slug,k,i}; upNext=upNext.filter(x=>!(x.slug===q.slug&&x.k===k&&x.i===i)); front?upNext.unshift(q):upNext.push(q); saveQueue();
  toast(front?'Playing next':'Added to Up Next'); }

/* iOS Safari never fires contextmenu on long-press: 500 ms hold opens the menu and swallows the tap */
(()=>{ let t=null, x0=0, y0=0, fired=false;
  document.addEventListener('pointerdown',ev=>{ if(ev.pointerType!=='touch') return; const el=ev.target.closest('[data-ep]'); if(!el) return;
    fired=false; x0=ev.clientX; y0=ev.clientY; clearTimeout(t); t=setTimeout(()=>{ fired=true; navigator.vibrate&&navigator.vibrate(8); epMenuFrom(el); },500); },{passive:true});
  document.addEventListener('pointermove',ev=>{ if(t&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>10){ clearTimeout(t); t=null; } },{passive:true});
  ['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{ clearTimeout(t); t=null; },{passive:true}));
  document.addEventListener('click',ev=>{ if(fired&&ev.target.closest('[data-ep]')){ ev.preventDefault(); ev.stopPropagation(); fired=false; } },true); })();
function refreshRows(){ document.querySelectorAll('[data-ep]').forEach(b=>{ const [s,k,i]=b.dataset.ep.split('|'); const on=cur&&cur.p.slug===s&&cur.k===k&&cur.i===+i;
  if(!b.classList.contains('row')) return; b.classList.toggle('cur',on); const n=b.querySelector('.n');
  if(n) n.innerHTML=on?`<span class="eq${audio.paused?' paused':''}"><i></i><i></i><i></i></span>`:(+i+1); }); }
/* lock screen / control centre scrubber */
function posState(){ try{ if('mediaSession' in navigator&&isFinite(audio.duration)&&audio.duration>0)
  navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)}); }catch(e){} }
let saveT=0, posT=0;
audio.addEventListener('timeupdate',()=>{ if(!cur) return; const now=Date.now(), e=curEp();
  if(now-saveT>4000){ saveT=now; store.set('pos.'+epKey(cur.p,e),Math.round(audio.currentTime)); }
  if(now-posT>5000){ posT=now; posState(); }
  if(sleepUntil&&now>=sleepUntil){ audio.pause(); sleepUntil=null; sleepMin=0; paintNP(); }
  paintTime(); });
audio.addEventListener('ended',()=>{ if(!cur) return; const e=curEp(); store.set('done.'+epKey(cur.p,e),true); store.set('pos.'+epKey(cur.p,e),0); next(true); });
audio.addEventListener('play',()=>{ document.body.classList.add('playing'); paintNP(); refreshRows(); });
audio.addEventListener('pause',()=>{ document.body.classList.remove('playing'); paintNP(); refreshRows(); if(cur) store.set('pos.'+epKey(cur.p,curEp()),Math.round(audio.currentTime)); });
audio.addEventListener('waiting',()=>document.body.classList.add('buffering'));
audio.addEventListener('playing',()=>{ document.body.classList.remove('buffering'); posState(); });
audio.addEventListener('canplay',()=>document.body.classList.remove('buffering'));
audio.addEventListener('loadedmetadata',posState); audio.addEventListener('ratechange',posState); audio.addEventListener('seeked',posState);
audio.addEventListener('error',()=>{ document.body.classList.remove('buffering'); if(!cur||!audio.src) return; const c={...cur};
  toast("This episode couldn't play",'Retry',()=>playEp(c.p,c.i,c.k)); });
function setSession(p,e){ if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata=new MediaMetadata({title:rowTitle(p,e),artist:p.shortName,album:'The Greats · '+KLABEL[cur.k],artwork:[{src:new URL(P[p.name],location.href).href,sizes:'900x1200',type:'image/jpeg'}]});
  const h=(a,f)=>{ try{ navigator.mediaSession.setActionHandler(a,f); }catch(e){} };
  h('play',()=>audio.play()); h('pause',()=>audio.pause()); h('previoustrack',prev); h('nexttrack',()=>next(false));
  h('seekbackward',d=>skipBy(-(d&&d.seekOffset||SKIP.back))); h('seekforward',d=>skipBy(d&&d.seekOffset||SKIP.fwd));
  h('seekto',d=>{ if(d.seekTime!=null){ audio.currentTime=d.seekTime; posState(); } }); }

/* ============================== now playing ============================== */
function paintNP(){
  if(!cur) return; const {p}=cur, e=curEp(), playing=!audio.paused;
  $('miniimg').src=thumbSrc(p); $('minit').textContent=rowTitle(p,e); $('minis').textContent=p.shortName;
  { const tg=document.querySelector('#mini .tg'), was=tg.dataset.st, now=playing?'pause':'play';
    tg.innerHTML=playing?IC.pause(20):IC.play(20); tg.dataset.st=now;
    if(was&&was!==now) tg.firstElementChild&&tg.firstElementChild.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(0.32,0.72,0,1)'}); }
  document.querySelector('#mini .tg').setAttribute('aria-label',playing?'Pause':'Play');
  document.querySelector('#mini .ff').innerHTML=IC.ff(22); document.querySelector('#mini .rw').innerHTML=IC.rw(22); document.querySelector('#mini .q').innerHTML=IC.list(20);
  $('npart').innerHTML=artifactVisual(p,cur.k,e,cur.i); $('npbg1').src=$('npbg2').src=P[p.name]; $('np').dataset.kind=cur.k;
  { const [h,s]=pal(p); $('np').style.setProperty('--h',h); $('np').style.setProperty('--s',s); $('mini').style.setProperty('--h',h); $('mini').style.setProperty('--s',s); }
  $('npt').textContent=rowTitle(p,e);
  { const pb=$('npplay'), was=pb.dataset.st, now=playing?'pause':'play';
    pb.innerHTML=playing?sfi('pause_fill',30):`<span style="transform:translateX(2px);display:flex">${sfi('play_fill',30)}</span>`; pb.dataset.st=now;
    if(was&&was!==now) pb.firstElementChild&&pb.firstElementChild.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(0.32,0.72,0,1)'}); }
  $('npplay').setAttribute('aria-label',playing?'Pause':'Play');
  $('nprw').innerHTML=sfi('backward_fill',24)+'<span>'+SKIP.back+'</span>'; $('npff').innerHTML=sfi('forward_fill',24)+'<span>'+SKIP.fwd+'</span>';
  document.querySelector('#mini .sk').innerHTML=sfi('forward_fill',20)+'<span>30</span>';
  const isFav=favs.includes(p.name); $('npfav').innerHTML=IC.star(20,isFav); $('npfav').setAttribute('aria-pressed',String(isFav));
  $('npfav').setAttribute('aria-label',isFav?'Remove from Favourites':'Add to Favourites'); $('npmore').innerHTML=IC.more(17); $('npclose').innerHTML=innerWidth>=900?IC.x(15):IC.down(15);
  const sp=store.get('speed',1); $('npspeeds').innerHTML=[0.75,1,1.25,1.5,2].map(v=>`<button class="press${v===sp?' on':''}" data-sp="${v}" aria-label="Playback speed ${v} times" aria-pressed="${v===sp}">${v}×</button>`).join('');
  $('npspeeds').querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ store.set('speed',+b.dataset.sp); audio.playbackRate=+b.dataset.sp; paintNP(); });
  { const e2=curEp(); const d=e2.sec||1; $('nps').textContent=p.shortName+' · '+Math.round(100*(audio.currentTime||pos(p,e2))/d)+'% complete'; }
  $('npspeed').textContent=store.get('speed',1)+'×';
  $('npsleep').innerHTML=IC.moon(21)+(sleepMin?`<span class="t-cap1">${sleepMin}m</span>`:''); $('npsleep').classList.toggle('on',!!sleepMin);
  $('npsleep').setAttribute('aria-pressed',String(!!sleepMin)); $('npsleep').setAttribute('aria-label',sleepMin?`Sleep timer, ${sleepMin} minutes`:'Sleep timer, off');
  $('npair').innerHTML=IC.air(24); $('npq').innerHTML=IC.list(22);
  paintTime();
}
let scrubbing=false, scrubT=0;
function paintTime(){ if(!cur) return; const e=curEp(); const d=isFinite(audio.duration)&&audio.duration?audio.duration:(e.sec||1);
  const t=scrubbing?scrubT:(audio.currentTime||pos(cur.p,e)); if(!scrubbing) $('scrubi').style.width=(100*t/d)+'%';
  $('tel').textContent=fmtClock(t); $('trem').textContent='-'+fmtClock(d-t);
  $('scrub').setAttribute('aria-valuemax',String(Math.round(d))); $('scrub').setAttribute('aria-valuenow',String(Math.round(t)));
  $('scrub').setAttribute('aria-valuetext',`${fmtClock(t)} of ${fmtClock(d)}`); }
let npReturnFocus=null;
/* opening is idempotent from the first moment: npModal holds the pending promise, so a second tap can't stack a second modal */
let npOpening=null;
function openNP(){ if(npModal||npOpening) return; const np=$('np'); if(cur) ground(cur.p); npReturnFocus=document.activeElement; np.setAttribute('aria-hidden','false'); np.classList.add('show'); document.body.classList.add('np-open');
  presentModal(np,{cls:'np-modal',onGone:()=>{ ground(route.startsWith('p/')?BYSLUG[route.slice(2)]:route==='home'?featured():null); document.body.classList.remove('np-open');
    np.classList.remove('show'); np.setAttribute('aria-hidden','true'); npModal=null; npOpening=null; if(npReturnFocus?.isConnected) npReturnFocus.focus(); npReturnFocus=null; }})
    .then(m=>{ npModal=m; npOpening=null; });
  npOpening=true; }
function closeNP(){ if(npModal) npModal.dismiss(); else if(npOpening) setTimeout(closeNP,120); }
function cycleSleep(){ const o=[0,15,30,60]; sleepMin=o[(o.indexOf(sleepMin)+1)%o.length]; sleepUntil=sleepMin?Date.now()+sleepMin*6e4:null; paintNP(); toast(sleepMin?`Sleep in ${sleepMin} minutes`:'Sleep timer off'); }
$('npclose').onclick=closeNP;
const toFigure=()=>{ if(!cur) return; const slug=cur.p.slug; closeNP(); if(route!=='p/'+slug) setTimeout(()=>{ pendingPush=true; go('p/'+slug); },180); };
['npart','npt','nps'].forEach(id=>{ const el=$(id); el.addEventListener('click',toFigure); el.setAttribute('role','link'); el.setAttribute('tabindex','0'); });
$('npart').setAttribute('aria-label','Go to this figure');
$('npplay').onclick=toggle; $('nprw').onclick=()=>skipBy(-SKIP.back); $('npff').onclick=()=>skipBy(SKIP.fwd);
$('nptabq').onclick=openQueue;
$('npspeed').onclick=()=>act('speed',route); $('npsleep').onclick=cycleSleep;
$('npair').onclick=()=>{ if(audio.remote&&audio.remote.prompt) audio.remote.prompt().catch(()=>{}); else toast('AirPlay is available on Safari'); };
$('npq').onclick=openQueue; $('npfav').onclick=()=>{ if(cur){ toggleFav(cur.p.name); paintNP(); } };
$('npmore').onclick=()=>{ if(cur) openAbout(cur.p); };
$('mini').onclick=ev=>{ const a=ev.target.closest('[data-a]')?.dataset.a;
  if(a==='toggle') toggle(); else if(a==='skip') skipBy(SKIP.fwd); else if(a==='next') next(false); else if(a==='prev') prev(); else if(a==='queue') openQueue(); else if(a==='open') openNP(); };
/* scrubbing: 1:1 with the pointer, captured */
(()=>{ const s=$('scrub');
  const at=x=>{ const r=s.getBoundingClientRect(), f=Math.min(1,Math.max(0,(x-r.left)/r.width)); const e=curEp(); const d=isFinite(audio.duration)&&audio.duration?audio.duration:(e?e.sec:1); scrubT=f*d; $('scrubi').style.width=f*100+'%'; paintTime(); };
  s.addEventListener('pointerdown',e=>{ if(!cur) return; scrubbing=true; s.classList.add('dragging'); s.setPointerCapture(e.pointerId); at(e.clientX); });
  s.addEventListener('pointermove',e=>{ if(scrubbing) at(e.clientX); });
  s.addEventListener('pointerup',e=>{ if(!scrubbing) return; at(e.clientX); audio.currentTime=scrubT; scrubbing=false; s.classList.remove('dragging'); });
  s.addEventListener('keydown',e=>{ if(!cur||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return; e.preventDefault();
    const ep=curEp(), d=isFinite(audio.duration)&&audio.duration?audio.duration:(ep?.sec||1);
    audio.currentTime=e.key==='Home'?0:e.key==='End'?d:Math.min(d,Math.max(0,audio.currentTime+(e.key==='ArrowLeft'?-10:10))); paintTime(); });
})();
/* drag-to-dismiss for Now Playing and sheets is Ionic's swipe-to-close (ion-modal) */
document.addEventListener('keydown',e=>{ const modal=$('sheet').classList.contains('show')?$('sheet'):document.body.classList.contains('np-open')?$('np'):null;
  if(e.key==='Tab'&&modal){ const f=[...modal.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){ const first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } } }
  if(e.key==='Escape'){ if($('sheet').classList.contains('show')) closeSheet(); else if(document.body.classList.contains('np-open')) closeNP(); else if(depth(route)) back(); return; }
  const editing=e.target.closest('input,textarea,[contenteditable="true"]'), command=e.metaKey||e.ctrlKey;
  if(!modal&&command&&e.key.toLowerCase()==='f'){ e.preventDefault(); go('search'); setTimeout(()=>$('q')?.focus(),0); return; }
  if(!modal&&command&&e.key===','){ e.preventDefault(); go('settings'); return; }
  if(!modal&&!editing&&e.key==='/'){ e.preventDefault(); go('search'); setTimeout(()=>$('q')?.focus(),0); return; }
  if(e.target.closest('input,button,[role="slider"],[contenteditable="true"]')) return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); return; }
  if(e.key==='ArrowLeft'){ e.preventDefault(); e.shiftKey?prev():skipBy(-SKIP.back); return; }
  if(e.key==='ArrowRight'){ e.preventDefault(); e.shiftKey?next(false):skipBy(SKIP.fwd); return; } });

/* ============================== boot ============================== */
const requiredJSON=url=>fetch(url).then(r=>{ if(!r.ok) throw new Error(`Failed to load ${url}`); return r.json(); });
fetch('data/covers.json?v='+BUILD).then(r=>r.ok?r.json():{}).catch(()=>({})).then(c=>{ COVERS=c; });
Promise.all([requiredJSON('data/episodes.json?v='+BUILD),requiredJSON('data/portraits.json?v='+BUILD),
  fetch('data/media.json?v='+BUILD).then(r=>r.ok?r.json():{people:{}}).catch(()=>({people:{}})),
  fetch('data/palette.json?v='+BUILD).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,pr,md,pl])=>{ PAL=pl;
  DATA=d; P=Object.fromEntries(Object.entries(pr).map(([k,v])=>[k,v+'?v='+BUILD]));
  DATA.people.forEach(p=>{ p.slug=slug(p.name); p.shortName=p.name.split(' - ')[0]; p.media=(md.people||{})[p.name]||{}; BYSLUG[p.slug]=p; });
  const last=store.get('last',null);
  if(last&&BYSLUG[last.slug]&&items(BYSLUG[last.slug],last.k||'bio')[last.i]){ cur={p:BYSLUG[last.slug],i:last.i,k:last.k||'bio'}; audio.src=curEp().url; document.body.classList.add('has-track'); paintNP(); }
  const r=parse(location.hash); navStack=[r]; customElements.whenDefined('ion-nav').then(()=>navEl().componentOnReady()).then(()=>{ navEl().innerHTML=''; render(r,'none'); });
  const st=new URLSearchParams(location.search).get('state');
  if(st==='player'){ if(!cur){ cur={p:BYSLUG['steve-jobs'],i:0,k:'bio'}; document.body.classList.add('has-track'); } paintNP(); openNP(); }
}).catch(()=>{ const v=$('view'); v.setAttribute('aria-busy','false'); v.innerHTML=`<div class="page"><div class="load-state" role="alert"><h1 class="t-page">The archive couldn’t load.</h1><p class="t-body c2">Check your connection, then try again. Your saved listening state is untouched.</p><button class="btn btn-primary press" id="retry-load">Try Again</button></div></div>`;
  $('retry-load').onclick=()=>location.reload(); });
</script>
