/* =============================================================================
   THE GREATS — design system
   One system, every value sourced. See DESIGN.md for the full provenance.

   TYPE   Apple HIG "Typography", iOS Large (default) Dynamic Type table, and the
          SF Pro tracking table (developer.apple.com HIG data, fetched 2026-10-30).
   COLOUR measured from real iOS 26 / iPadOS 26 Apple Music screenshots
          (Pinterest pins 739434832610073940, 1091911872195345882,
          898890406989751969, 1046946244644498781).
   MOTION Ionic's native iOS navigation and sheet transitions. State changes
          use brief, interruptible opacity and indicator motion only.
   ========================================================================== */
@font-face{font-family:'SF Pro';src:url('assets/fonts/SF-Pro.woff2') format('woff2');font-weight:100 1000;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url('assets/fonts/InstrumentSerif-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url('assets/fonts/InstrumentSerif-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
/* the ground hue is a registered property, so moving between figures MORPHS the
   colour instead of cutting (art-tinted direction C) */
@property --gh{syntax:'<number>';inherits:true;initial-value:220}
@property --gs{syntax:'<number>';inherits:true;initial-value:0}

:root{
  /* ---------- colour ---------- */
  --bg:#000;
  --label:#fff;
  --label2:rgb(142,142,147);          /* measured, = systemGray            */
  --label3:rgba(235,235,245,.30);
  --danger:#ff453a;
  --red:#F3EDE4;                      /* legacy name: the interface accent is ivory */
  --ivory:#F3EDE4;
  --glow:208,48,48;                   /* measured: iPadOS Replay corner    */
  --fill:hsl(var(--gh) calc(var(--gs)*35%) 80% / .12);   /* C: panel = ground, desaturated, lifted */
  --fill2:hsl(var(--gh) calc(var(--gs)*30%) 90% / .20);
  --fill3:rgba(255,255,255,.06);
  --hair:rgba(255,255,255,.08);       /* pin 355714070590901781: chip rim #e8e8e8 on #f7f7f7, inverted */
  --sep:rgba(255,255,255,.08);
  --raised:#1c1c1e;
  /* v5 surfaces, measured by script from pin 808888783111165642 (dark journal) */
  --panel:#1c1c1e;                    /* panel fill                        */
  --panel2:#323234;                   /* inner square (play tile)          */
  --dim:#69696b;                      /* second tone of large text, placeholders */
  --text2:rgba(255,255,255,.75);      /* long-form copy on the ground      */

  /* ---------- type: HIG iOS Large table + SF Pro tracking ---------- */
  --f:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  /* ---------- space & shape ---------- */
  --m:12px;                           /* measured panel inset 12pt (pin 808888783111165642) */
  --gap:8px;                          /* measured gap between panels       */
  --r-panel:20px;                     /* measured panel corner             */
  --r-big:28px;                       /* measured card corner (pin 355714070590901781) */
  --r-inner:12px;                     /* measured play tile corner         */
  --r-hero:28px;
  --r-card:20px;
  --r-tile:14px;
  --r-row:20px;
  --tabh:58px;                        /* measured tab bar                  */
  --minih:50px;                       /* 44pt controls plus player chrome  */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* ---------- glass ---------- */
  --g-blur:blur(30px) saturate(1.4);
  --g-shadow:inset 0 .5px 0 rgba(255,255,255,.30), inset 0 -.5px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.45);
  --g-rim:linear-gradient(160deg,rgba(255,255,255,.50),rgba(255,255,255,.10) 30%,rgba(255,255,255,0) 52%,rgba(255,255,255,.06) 74%,rgba(255,255,255,.24));

  /* ---------- motion: MEASURED from Apple screen recordings (this repo, commit 8d7f1ed) ----------
     push: translateX 100% -> 0 over 417ms, geometric decay r=0.795/frame = critically damped,
           tau 69ms, no overshoot; reaches 90% at ~150ms. Pop and every in-page morph ride it.
     sheet: translateY over 533ms, same spring (decay 0.80/frame). */
  --spring:cubic-bezier(.205,1.128,.496,.968);
  --sheet:cubic-bezier(.096,1.094,.369,.971);
  --dur:.417s; --dur-sheet:.533s;
}
@supports (animation-timing-function:linear(0,1)){:root{
  --spring:linear(0 0%, .2051 4%, .3641 8%, .4906 12%, .5983 16%, .6863 20%,
    .7573 24%, .8137 28%, .8581 32%, .8923 36%, .9188 40%, .9393 44%, .9547 48%,
    .9658 52%, .9744 56%, .9812 60%, .9863 64%, .9897 68%, .9923 72%, .9949 76%,
    .9957 80%, .9974 84%, .9974 88%, .9983 92%, .9991 96%, 1 100%);
  --sheet:linear(0 0%, .2694 3.125%, .4664 6.25%, .5442 9.375%, .6572 12.5%,
    .7231 15.62%, .7867 18.75%, .8428 21.88%, .8728 25%, .8878 28.12%, .9028 31.25%,
    .9147 34.38%, .9281 37.5%, .9475 40.62%, .9562 43.75%, .9656 46.87%, .9735 50%,
    .9795 53.12%, .9842 56.25%, .9878 59.38%, .9905 62.5%, .9929 65.62%, .9945 68.75%,
    .9957 71.87%, .9968 75%, .9976 78.12%, .998 81.25%, .9984 84.37%, .9988 87.5%,
    .9992 90.62%, .9992 93.75%, .9996 96.87%, 1 100%);
}}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{--gh:0;--gs:0}
html,body{height:100%;color:var(--label);color-scheme:dark}
/* Neutral graphite media-room ground. Hue properties remain registered so a
   future contextual transition cannot cut between frames. */
body{background:var(--bg)}          /* flat black ground, as measured */
body{font-family:var(--f);overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit;outline:none;border:0;background:none}
img{display:block;background:var(--panel2);-webkit-user-drag:none;user-select:none}
::-webkit-scrollbar{display:none}
::selection{background:rgba(243,237,228,.35)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* ============================== TYPE SCALE ============================== */
/* B: editorial serif for names and titles, SF for everything you operate */
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.t-hero{font-family:'Instrument Serif',Georgia,serif;font-size:56px;line-height:56px;font-weight:400;letter-spacing:-.02em}
.t-page{font-family:'Instrument Serif',Georgia,serif;font-size:44px;line-height:46px;font-weight:400;letter-spacing:-.015em}
.t-sect{font-family:'Instrument Serif',Georgia,serif;font-size:28px;line-height:32px;font-weight:400;letter-spacing:-.01em}
.t-card{font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:24px;font-weight:400}
.t-display{font-size:40px;line-height:46px;font-weight:700;letter-spacing:.37px}   /* iPadOS Replay headline (measured ~39-40) */
.t-large  {font-size:34px;line-height:41px;font-weight:700;letter-spacing:.40px}
.t-title1 {font-size:28px;line-height:34px;font-weight:700;letter-spacing:.38px}
.t-title2 {font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.26px}
.t-title3 {font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px}
.t-head   {font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.t-body   {font-size:17px;line-height:22px;font-weight:400;letter-spacing:-.43px}
.t-callout{font-size:16px;line-height:21px;font-weight:400;letter-spacing:-.31px}
.t-sub    {font-size:15px;line-height:20px;font-weight:400;letter-spacing:-.23px}
.t-foot   {font-size:13px;line-height:18px;font-weight:400;letter-spacing:-.08px}
.t-cap1   {font-size:12px;line-height:16px;font-weight:400;letter-spacing:0}
.t-cap2   {font-size:11px;line-height:13px;font-weight:400;letter-spacing:.06px}
.t-eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.c2{color:var(--label2)} .c3{color:var(--label3)} .cr{color:var(--red)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* =============================== ICONS ================================== */
.sfi{display:inline-block;flex:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background-color:currentColor}

/* =============================== GLASS ================================== */
.glass{position:relative;isolation:isolate;background:var(--fill);
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:var(--g-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* =============================== BUTTONS ================================ */
.press{position:relative;transition:transform .3s var(--spring),opacity .3s var(--spring),background-color .2s,color .2s,box-shadow .25s}
.press:active{transform:scale(.965);opacity:.82;transition:transform .09s ease-out,opacity .09s ease-out}
.press:disabled{cursor:default;opacity:.36}
@media (hover:hover){
  .btn-primary:hover,.pill:not(.ghost):hover{background:#fff;box-shadow:0 10px 30px rgba(243,237,228,.18)}
  .btn-tinted:hover,.btn-icon:hover,.chip:hover,.textbtn:hover{background-color:rgba(255,255,255,.12);color:#fff}
  .press:not(:disabled):focus-visible{box-shadow:0 0 0 4px rgba(243,237,228,.16)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;
  font-size:17px;font-weight:600;letter-spacing:-.43px;white-space:nowrap}
.btn-primary{background:var(--ivory);color:#1a1612}                       /* iOS 26 album "Play" pill */
.btn-tinted{background:var(--fill2);color:#fff}                /* Games "Play" pill        */
.btn-red{background:var(--ivory);color:#1a1612}
.btn-glass{color:#fff}
.btn-sm{height:44px;padding:0 16px;border-radius:22px;font-size:15px;letter-spacing:-.23px}
.btn-icon{width:44px;height:44px;padding:0;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-icon.sm{width:44px;height:44px;border-radius:22px}
.btn-play{width:61px;height:61px;border-radius:50%;background:var(--ivory);color:#1a1612;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}                       /* measured 61pt (A) */
.btn-play .sfi{transform:translateX(2px)}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:500;letter-spacing:-.23px;background:var(--fill);color:#fff;white-space:nowrap}
.chip.on{background:var(--ivory);color:#1a1612}
.textbtn{min-height:44px;display:inline-flex;align-items:center;color:rgba(255,255,255,.7);font-size:17px;letter-spacing:-.43px}

/* =============================== LAYOUT ================================= */
.page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);
  padding:0 0 calc(var(--tabh) + var(--minih) + 60px + var(--safe-b))}
.content{min-width:0;overflow-x:clip}
.wrap{padding:0 var(--m)}
.bleed{margin:0 calc(-1 * var(--m))}
.sect{margin-top:30px;content-visibility:auto;contain-intrinsic-size:auto 480px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shead h2{display:flex;align-items:center;gap:3px}
.shead .sfi{color:var(--label2)}
.hrow{display:flex;gap:12px;max-width:100%;min-width:0;overflow-x:auto;overscroll-behavior-inline:contain;padding:0 var(--m);scroll-snap-type:x mandatory;scroll-padding:0 var(--m)}
.hrow>*{scroll-snap-align:start;flex:none}

/* The app's purpose is a practice, not a feed. One calm orienting surface leads
   into the next useful listening action; the archive remains the visual hero. */
.purpose-card{position:relative;min-height:360px;margin-top:12px;border-radius:28px;overflow:hidden;display:flex;align-items:flex-end;padding:26px;
  background:#111;box-shadow:inset 0 0 0 1px var(--hair),0 24px 70px rgba(0,0,0,.32)}
.purpose-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:grayscale(1) contrast(1.04);opacity:.62;transition:transform .8s var(--spring)}
.purpose-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,6,.96) 0%,rgba(5,5,6,.78) 58%,rgba(5,5,6,.18)),linear-gradient(transparent 46%,rgba(0,0,0,.56));pointer-events:none}
.purpose-copy{position:relative;z-index:1;max-width:620px}
.purpose-copy h2{font-family:'Instrument Serif',Georgia,serif;font-size:46px;line-height:45px;font-weight:400;letter-spacing:-.02em;text-wrap:balance;margin-top:9px}
.purpose-copy p{max-width:500px;margin-top:12px;color:rgba(255,255,255,.7)}
.purpose-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.purpose-stat{display:inline-flex;align-items:center;gap:7px;min-height:44px;color:rgba(255,255,255,.62)}
.purpose-stat b{color:#fff;font-weight:600}
@media (hover:hover){.purpose-card:hover>img{transform:scale(1.025)}}

/* YouTube-like chronology, expressed with this product's physical objects. */
.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:6px}
.history-head p{max-width:570px;margin-top:7px;color:var(--label2)}
.history-tools{display:flex;align-items:center;gap:8px;flex:none}
.history-filters{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding-bottom:2px}
.history-section{margin-top:28px}
.history-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.history-list{display:flex;flex-direction:column}
.history-item{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 0;box-shadow:inset 0 -.5px 0 var(--sep)}
.history-item:last-child{box-shadow:none}
.hist-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left;border-radius:16px;padding:4px}
.hist-object{position:relative;width:84px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;
  background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.10),transparent 48%),rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hist-object .cover{width:42px}
.hist-object .letter-object{width:46px;height:61px;padding:7px 6px;border-radius:2px}.hist-object .letter-object>*{display:none}
.hist-object .edit-object{width:66px;height:47px;padding:5px;border-radius:6px}.hist-object .edit-object .tape-label{height:28px;padding:3px}.hist-object .edit-object .object-title,.hist-object .edit-object .wave{display:none}.hist-object .edit-object .reels{margin-top:3px}.hist-object .edit-object .reel{width:12px;height:12px;border-width:3px;box-shadow:0 0 0 1px #8d8375}.hist-object .edit-object .window{width:18px;height:8px}
.hist-object .speech-object{width:48px;height:57px;padding:6px}.hist-object .speech-object .kicker,.hist-object .speech-object .speaker,.hist-object .speech-object .mic{display:none}.hist-object .speech-object .object-title{margin-top:7px;font-size:8px;line-height:8px;-webkit-line-clamp:4}
.hist-copy{flex:1;min-width:0}
.hist-meta{display:flex;align-items:center;gap:7px;margin-top:4px;color:var(--label2)}
.hist-kind{color:#c9a96f;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}
.hist-progress{height:3px;margin-top:8px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden;max-width:420px}.hist-progress i{display:block;height:100%;background:var(--ivory);border-radius:inherit}
.hist-actions{display:flex;align-items:center;gap:2px;flex:none}
.hist-action{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.72)}
@media (hover:hover){.hist-main:hover{background:rgba(255,255,255,.055)}.hist-action:hover{background:rgba(255,255,255,.09);color:#fff}.history-item:hover .hist-object{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}}
@media (max-width:520px){
  .purpose-card{min-height:420px;padding:22px}.purpose-card::after{background:linear-gradient(0deg,rgba(5,5,6,.97) 0%,rgba(5,5,6,.78) 55%,rgba(5,5,6,.12))}.purpose-card>img{object-position:center top}.purpose-copy h2{font-size:39px;line-height:39px}
  .history-head{display:block}.history-tools{margin-top:14px}.history-item{gap:2px}.hist-main{gap:10px;padding-left:0}.hist-object{width:68px;height:64px}.hist-actions{gap:0}.hist-copy .t-head{font-size:15px;line-height:19px}.hist-meta{gap:5px}
}

/* large title + collapsing glass nav bar (scroll edge effect) */
.ltitle{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--safe-t) + 54px) var(--m) 6px}
.navbar{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--safe-t) + 50px);padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility 0s linear .18s}
.navbar::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  -webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.navbar.on{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.navbar .nb-back{position:absolute;left:10px;top:calc(var(--safe-t) + 3px)}
.navbar .nb-r{position:absolute;right:10px;top:calc(var(--safe-t) + 3px)}

/* glow (Replay) */
.glow{display:none;position:absolute;top:0;right:0;width:100%;height:440px;pointer-events:none;z-index:-1;
  background:radial-gradient(80% 62% at 100% 0%,rgba(var(--glow),.85),rgba(var(--glow),.42) 26%,rgba(var(--glow),.12) 56%,transparent 82%)}

/* =============================== FIELD ================================== */
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 14px;background:var(--fill);color:var(--label2)}
.search input{flex:1;min-width:0;color:#fff;font-size:17px;letter-spacing:-.43px}
.search input::placeholder{color:var(--label2)}

/* =============================== CARDS ================================== */
/* every portrait is toned in its figure's hue: luminosity of the photo over a
   ground of that hue = a duotone, the way B's references colour their portraits */
.toned{}
.toned::before{mix-blend-mode:normal}
/* hero (iOS 26 Home, measured 356x443 r19, caption 22pt off the bottom) */
.hero{position:relative;display:block;width:100%;aspect-ratio:356/443;border-radius:var(--r-hero);overflow:hidden;background:#111;text-align:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 55%,rgba(0,0,0,.5) 82%,rgba(0,0,0,.75))}
.hero::after,.rcard::after,.tile .art::after,.pcard .art::after,.wide .art::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;box-shadow:inset 0 0 0 1px var(--hair);pointer-events:none}
.hero .eb{position:absolute;top:20px;left:0;right:0;z-index:2;color:rgba(255,255,255,.75)}
.hero .cap{position:absolute;left:22px;right:22px;bottom:22px;z-index:2}
/* ranked (Replay, measured 240x320 r14; rank 45pt) */
.rcard{position:relative;width:240px;height:320px;border-radius:var(--r-card);overflow:hidden;background:#111;text-align:center}
.rcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.rcard::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 52%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.85))}
.rcard .rk{position:absolute;left:18px;top:9px;z-index:2;font-size:45px;line-height:54px;font-weight:700;letter-spacing:.37px}
.rcard .rn{position:absolute;left:12px;right:12px;bottom:34px;z-index:2}
.rcard .rm{position:absolute;left:12px;right:12px;bottom:14px;z-index:2;color:rgba(235,235,245,.72)}
/* square tile (Top Albums) */
.tile{width:162px;text-align:left}
.tile .art{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:var(--r-tile);overflow:hidden;background:#111}
.tile .art img,.pcard .art img,.wide .art img{width:100%;height:100%;object-fit:cover;object-position:center 15%;transition:transform .6s var(--spring)}
.tile .tt{display:block;margin-top:7px}
/* portrait card (Figures grid) */
.pcard{text-align:left;min-width:0}
.pgrid>.pcard{content-visibility:auto;contain-intrinsic-size:auto 240px}
.pcard .art{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111}
.pcard .tt{display:block;margin-top:8px}
/* wide continue card */
.wide{width:300px;text-align:left}
.wide .art{position:relative;display:block;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#111}
.wide .art .bar{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);z-index:3;overflow:hidden}
.wide .art .bar i{display:block;height:100%;background:#fff}
.wide .tt{display:block;margin-top:8px}
@media (hover:hover){ .tile:hover .art img,.pcard:hover .art img,.wide:hover .art img{transform:scale(1.04)} }
.badge{position:absolute;top:8px;left:8px;z-index:3;background:var(--ivory);color:#1a1612;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:5px}
/* category tile: content stays monochrome; imagery, not tint, differentiates shelves */
.cat{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:16/10;text-align:left;isolation:isolate;background:linear-gradient(145deg,#242426,#121213)}
.cat::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,8,9,.96) 0%,rgba(8,8,9,.84) 58%,rgba(8,8,9,.12) 100%)}
.cat::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--hair)}
.cat .bgc{position:absolute;inset:0;z-index:-2;background:radial-gradient(90% 120% at 100% 10%,rgba(255,255,255,.13),transparent 62%)}
.cat img{position:absolute;right:-5%;bottom:-8%;height:120%;width:auto;z-index:0;filter:grayscale(1) contrast(1.05);opacity:.68;transition:transform .6s var(--spring)}
.cat .copy{position:absolute;left:14px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;align-items:flex-start}
.cat .tt{display:block;width:72%;white-space:normal;overflow-wrap:normal}
.cat .sub{display:block;margin-top:2px;color:rgba(255,255,255,.56)}
.cat .mark{position:absolute;right:12px;top:4px;z-index:0;font-family:'Instrument Serif',Georgia,serif;font-size:84px;line-height:1;color:rgba(255,255,255,.10)}
@media (hover:hover){.cat:hover img{transform:scale(1.04)} .cat:hover::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}}

/* =============================== LISTS ================================== */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;position:relative}
.row .lead{flex:none;width:44px;height:44px;border-radius:6px;overflow:hidden;background:#111}
.row .lead img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .n{flex:none;width:22px;text-align:right;color:var(--label2)}
.row .mid{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:8px 0;box-shadow:inset 0 -.5px 0 var(--sep)}
.row .end{flex:none;align-self:stretch;display:flex;align-items:center;gap:12px;color:var(--label2);box-shadow:inset 0 -.5px 0 var(--sep);padding-left:4px}
.row:last-child .mid,.row:last-child .end{box-shadow:none}
.row.cur .t,.row.cur .n{color:var(--red)}
.row .prog{position:absolute;left:34px;right:0;bottom:5px;height:2px;border-radius:1px;background:var(--fill)}
.row .prog i{display:block;height:100%;background:var(--red);border-radius:1px}
@media (hover:hover){ .row:hover{background:linear-gradient(90deg,transparent,var(--fill3) 6%,var(--fill3) 94%,transparent)} }
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;border-radius:1.5px;background:var(--red);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
.eq.paused i{animation-play-state:paused;height:5px}
@keyframes eq{0%,100%{height:5px}50%{height:14px}}
/* library nav rows (Apple Music Library) */
.lnav{display:flex;align-items:center;gap:16px;height:52px;width:100%;text-align:left}
.lnav .sfi{color:var(--red)}
.lnav .mid{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 -.5px 0 var(--sep);padding-right:2px}
/* grouped inset list (Settings, iOS 26) */
.group{background:var(--raised);border-radius:var(--r-row);overflow:hidden}
.group+.group{margin-top:28px}
.gh{padding:0 16px 7px;color:var(--label2)}
.gf{padding:7px 16px 0;color:var(--label2)}
.grow{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding-left:16px;text-align:left}
.grow .ico{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.grow .mid{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:16px;box-shadow:inset 0 -.5px 0 var(--sep)}
.grow:last-child .mid{box-shadow:none}
.grow.destructive .ico{color:var(--danger);background:rgba(255,69,58,.12)}
.grow:disabled{opacity:.45;cursor:default}

/* useful terminal states */
.empty-state{display:flex;min-height:210px;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid var(--hair);border-radius:22px}
.empty-state .btn{margin-top:20px}
.loading-shell .skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.04)}
.loading-shell .search-skeleton{height:44px;border-radius:22px;margin-top:10px}
.loading-shell .card-skeleton{height:380px;border-radius:24px;margin-top:30px}
.loading-shell .line-skeleton{height:18px;border-radius:9px;margin-top:16px;width:42%}
.load-state{display:flex;min-height:70vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--m)}
.load-state p{max-width:420px;margin-top:8px}
.load-state .btn{margin-top:20px}

/* =============================== PERSON ================================= */
.pbg{position:fixed;inset:-80px;z-index:-1;pointer-events:none}
.pbg{display:none}
.phero{position:relative;height:520px;overflow:hidden}
.phero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%}
.phero .fade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),transparent 18%,transparent 48%,
  hsl(var(--gh) calc(var(--gs)*90%) 17% / .55) 72%,hsl(var(--gh) calc(var(--gs)*90%) 17%) 98%)}
.phead{position:absolute;left:var(--m);right:var(--m);bottom:24px;z-index:2;text-align:center}
.phead .ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:14px}
.ptop{position:absolute;top:calc(var(--safe-t) + 6px);left:var(--m);right:var(--m);z-index:5;display:flex;justify-content:space-between}
.pair{display:flex;height:44px;border-radius:22px;padding:0 4px}
.pair button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.lcard{display:flex;align-items:center;gap:14px;width:100%;height:105px;border-radius:18px;padding:0 16px 0 14px;text-align:left;background:var(--fill2);
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow)}
.lcard img{width:75px;height:75px;border-radius:8px;object-fit:cover;object-position:top;flex:none}
.lcard .mid{flex:1;min-width:0}
.pcols{display:flex;flex-direction:column}
.faved{color:var(--ivory)!important}

/* =============================== DOCK =================================== */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 20px calc(20px + var(--safe-b) * .3);pointer-events:none}
#dock>*{pointer-events:auto}
#mini{display:flex;align-items:center;gap:4px;width:100%;height:var(--minih);border-radius:25px;padding:3px 6px;margin-bottom:6px;text-align:left;
  transform:translateY(160%);opacity:0;visibility:hidden;pointer-events:none;transition:transform var(--dur) var(--spring),opacity .2s,visibility 0s linear var(--dur)}
body.has-track #mini{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
#mini .art{width:31px;height:31px;border-radius:7px;overflow:hidden;flex:none;background:#222}
#mini .art img{width:100%;height:100%;object-fit:cover;object-position:top}
#mini .meta{flex:1;min-width:0}
#mini .mini-main{order:0;display:flex;align-items:center;gap:8px;min-width:0;flex:1;height:44px;padding:0 4px;border-radius:22px;text-align:left}
#mini .mb{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
#mini .rw,#mini .q{display:none}
#mini .tg{order:2} #mini .ff{order:3}
#tabs{display:flex;gap:10px;align-items:center}
#tabbar{flex:1;height:var(--tabh);border-radius:29px;padding:4px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:25px;position:relative;color:#fff;
  transition:color .2s}
.tab .lb{font-size:10px;line-height:12px;font-weight:600;letter-spacing:.12px}
.tab.on{color:#fff}
.tab:not(.on){color:rgba(255,255,255,.62)}
#tabhl{position:absolute;top:4px;bottom:4px;left:4px;border-radius:25px;background:var(--fill2);
  transition:transform .35s var(--spring),width .35s var(--spring);z-index:-1}
#tabsearch{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center}
#tabsearch.on{color:var(--red)}
#topnav{display:none}

/* ============================ NOW PLAYING ================================ */
#np{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden;background:hsl(var(--gh) calc(var(--gs)*60%) 8%);
  padding:calc(var(--safe-t) + 10px) 26px calc(26px + var(--safe-b));transform:translateY(102%);visibility:hidden}
#np.show{visibility:visible}
#np .npbg{position:absolute;inset:-25%;z-index:-1}
#np .npbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(64px) brightness(.38) saturate(1.25);transform:scale(1.18)}
#np .npbg img+img{display:none}
#np .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:0 auto;flex:none}
#np .artwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:26px 0}
#np .art{height:100%;max-height:460px;aspect-ratio:1;max-width:100%;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.11),transparent 42%),linear-gradient(145deg,rgba(255,255,255,.075),rgba(0,0,0,.18));
  box-shadow:0 34px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.10)}
#np .art .cover{width:min(52%,220px)}
#np .art .letter-object{width:min(48%,190px);height:auto;aspect-ratio:3/4}
#np .art .edit-object{width:min(68%,280px);height:auto;aspect-ratio:1.4}
#np .art .speech-object{width:min(50%,205px);height:auto;aspect-ratio:.88}
#np .trow2{display:flex;align-items:center;gap:12px;flex:none}
#np .trow2 .mid{flex:1;min-width:0}
.scrub{position:relative;height:44px;display:flex;align-items:center;touch-action:none;cursor:pointer;flex:none;margin-top:8px}
.scrub .tr{width:100%;height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;transition:height .2s var(--spring)}
.scrub.dragging .tr{height:12px}
.scrub .tr i{display:block;height:100%;background:rgba(255,255,255,.9)}
.times{display:flex;justify-content:space-between;flex:none;color:rgba(255,255,255,.6)}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;flex:none}
.ctrls button{display:flex;align-items:center;justify-content:center;min-width:64px;height:64px}
.bottoms{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 0;flex:none;color:rgba(255,255,255,.65)}
.bottoms button{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:4px}
.bottoms button.on{color:#fff}

/* =============================== SHEETS ================================= */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88vh;border-radius:34px 34px 0 0;overflow:hidden;
  display:flex;flex-direction:column;background:rgba(30,30,32,.82);transform:translateY(105%);visibility:hidden}
.sheet.show{visibility:visible}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet .sh-b{overflow-y:auto;padding:4px 18px calc(24px + var(--safe-b))}
.sheet-actions{display:grid;gap:10px;margin-top:22px}
.sheet-actions .btn{width:100%}
.btn-danger{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:90;transform:translate(-50%,-160%);height:44px;border-radius:22px;
  padding:0 10px 0 18px;display:flex;align-items:center;gap:12px;opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .18s ease,visibility 0s linear .24s;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.toast button{display:none;min-width:58px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;font-weight:650;color:#fff}
.toast.has-action button{display:inline-flex;align-items:center;justify-content:center}

.rise{}


/* =========================== COMPONENTS v4 ===========================
   Each block names the Pinterest reference it is built from
   (brief for "The Greats · components"). Monochrome throughout. */

/* Tactile archive objects. Colour belongs to the content layer; operating chrome stays neutral. */
.cover{--jacket:#303033;--ink:#f4efe5;position:relative;display:block;width:132px;aspect-ratio:2/3;border-radius:5px 10px 10px 5px;overflow:hidden;text-align:left;
  color:var(--ink);background:
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.14),transparent 23%),
  repeating-linear-gradient(100deg,rgba(255,255,255,.024) 0 1px,transparent 1px 4px),var(--jacket);
  box-shadow:2px 2px 0 rgba(255,255,255,.17),5px 5px 0 rgba(218,207,186,.14),0 18px 34px rgba(0,0,0,.48),inset 0 0 0 .5px rgba(255,255,255,.16);
  transform:perspective(700px) rotateY(-3deg);transform-origin:left center;transition:transform .45s var(--spring),box-shadow .45s var(--spring)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.16) 52%,rgba(0,0,0,.12));box-shadow:1px 0 rgba(255,255,255,.12)}
.cover::after{content:"";position:absolute;right:0;top:4px;bottom:4px;width:4px;background:repeating-linear-gradient(0deg,#eee7d8 0 1px,#cfc4b1 1px 2px);opacity:.75}
.cover .no{position:absolute;left:18px;right:14px;top:13px;font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 58%,transparent)}
.cover .ti{position:absolute;left:18px;right:15px;top:38px;font-family:'Instrument Serif',Georgia,serif;font-size:19px;line-height:19px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cover .mark{position:absolute;left:18px;bottom:40px;width:25px;height:25px;border:1px solid color-mix(in srgb,var(--ink) 44%,transparent);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Instrument Serif',Georgia,serif;font-size:14px;color:color-mix(in srgb,var(--ink) 64%,transparent)}
.cover .au{position:absolute;left:18px;right:14px;bottom:15px;font-size:9px;line-height:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 66%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .pr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.18)} .cover .pr i{display:block;height:100%;background:var(--ink)}
.cover .dn{position:absolute;right:9px;top:9px;width:20px;height:20px;border-radius:10px;background:var(--ink);color:#171513;display:flex;align-items:center;justify-content:center;z-index:2}
.cover.cur{box-shadow:0 0 0 2px var(--ivory),2px 2px 0 rgba(255,255,255,.17),5px 5px 0 rgba(218,207,186,.14),0 18px 34px rgba(0,0,0,.48)}
.book{width:132px;text-align:left;padding:2px 4px 0}
.book .bm{display:block;margin-top:13px}
@media (hover:hover){.book:hover .cover,.artifact-card:hover .cover{transform:perspective(700px) rotateY(0) translateY(-5px);box-shadow:3px 3px 0 rgba(255,255,255,.2),7px 7px 0 rgba(218,207,186,.14),0 24px 46px rgba(0,0,0,.58)}}
@media (min-width:900px){ .cover,.book{width:164px} }

.artifact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px}
.artifact-card{min-width:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.artifact-card .object-stage{height:218px;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.10),transparent 42%),linear-gradient(145deg,#202022,#101011);box-shadow:inset 0 0 0 1px var(--hair)}
.artifact-card .object-stage::after{content:"";position:absolute;left:12%;right:12%;bottom:14px;height:18px;border-radius:50%;background:rgba(0,0,0,.48);filter:blur(11px)}
.archive-object{position:relative;z-index:1;display:block;transition:transform .45s var(--spring)}
@media (hover:hover){.artifact-card:hover .archive-object{transform:translateY(-5px) rotate(-.5deg)}}
.letter-object{width:138px;height:184px;padding:18px 16px;color:#2a251f;background:
  repeating-linear-gradient(0deg,transparent 0 17px,rgba(69,58,45,.09) 17px 18px),linear-gradient(135deg,#fffdf6,#e8dfce);
  border-radius:3px 4px 7px 3px;box-shadow:2px 2px 0 #cfc3ae,6px 7px 0 rgba(232,223,206,.52),0 22px 38px rgba(0,0,0,.42);transform:rotate(-1.7deg)}
.letter-object::before{content:"";position:absolute;left:0;right:0;top:49%;border-top:1px solid rgba(93,72,48,.16);box-shadow:0 1px rgba(255,255,255,.55)}
.letter-object .kicker{font-size:7px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#776b5d}
.letter-object .date{display:block;margin-top:8px;font-size:8px;color:#75695b}
.letter-object .object-title{display:block;margin-top:19px;font-family:'Instrument Serif',Georgia,serif;font-size:18px;line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.letter-object .signature{position:absolute;left:17px;bottom:16px;font-family:'Instrument Serif',Georgia,serif;font-size:15px;font-style:italic}
.letter-object .stamp{position:absolute;right:10px;bottom:13px;border:1px solid #8f3f35;color:#8f3f35;border-radius:50%;width:37px;height:37px;display:flex;align-items:center;justify-content:center;
  font-size:6px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;transform:rotate(-13deg);opacity:.72}
.edit-object{width:184px;height:132px;border-radius:14px;padding:13px;color:#e8e1d5;background:linear-gradient(145deg,#444344,#1e1e20);box-shadow:0 22px 42px rgba(0,0,0,.48),inset 0 0 0 1px rgba(255,255,255,.17)}
.edit-object .tape-label{height:74px;border-radius:8px;padding:9px;background:linear-gradient(#eee7da,#cbc0ae);color:#28231f;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.edit-object .reels{display:flex;align-items:center;justify-content:space-around;margin-top:7px}
.edit-object .reel{width:31px;height:31px;border:7px dotted #45413c;border-radius:50%;background:#d9d0c1;box-shadow:0 0 0 3px #8d8375}
.edit-object .window{width:54px;height:20px;border-radius:4px;background:linear-gradient(90deg,#27282a,#827159 49%,#27282a);box-shadow:inset 0 0 0 2px #9f9484}
.edit-object .object-title{display:block;font-size:9px;line-height:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-object .wave{display:flex;align-items:center;gap:2px;height:17px;margin-top:7px}
.edit-object .wave i{display:block;width:3px;border-radius:2px;background:#817361}
.speech-object{width:158px;height:178px;border-radius:7px;padding:15px 14px;color:#f4efe6;background:linear-gradient(160deg,#271f1b,#0e0d0d);box-shadow:3px 4px 0 #b9aa91,0 22px 40px rgba(0,0,0,.48);overflow:hidden}

/* =========================== SYSTEM v6 ===============================
   Built only from the 17 references Adam approved on 2026-10-30
   (D:/tmp/oa/approved). Measured by script; pin 746260600795600117 gave
   the Home grammar at 353px = 393pt. Two appearances of one design, the way
   Apple Music Replay ships it (pins 1046946244645170140 / 4591630998046678144). */

/* portrait cards (pin 746260600795600117: 205x313, ~24 corners, 12pt apart,
   meta overlaid bottom-left in white with a grey second tone) */
.fc,.fcw{width:205px;height:313px;border-radius:24px}
.fc .in{left:14px;right:14px;bottom:14px}
.fc .in .t-card{font-size:26px!important;line-height:27px!important}
.hrow:has(.fcw){gap:12px}
@media (min-width:900px){.fc,.fcw{width:260px;height:396px}}
/* recent cards (116x160, 8pt apart, 13pt semibold caption + grey meta) */
.tile{width:116px}
.tile .art{aspect-ratio:116/160;border-radius:16px}
.tile .tt{font-weight:600;margin-top:8px}
.hrow:has(>.tile){gap:8px}
@media (min-width:900px){.tile{width:150px}}

/* the portrait dissolves into the ground behind the title (pins 746260600795600118, 320670435991878838) */
.content{position:relative;isolation:isolate}
.veil{position:absolute;right:0;top:0;width:min(62%,560px);height:calc(var(--safe-t) + 190px);z-index:-1;pointer-events:none;overflow:hidden;
  -webkit-mask:radial-gradient(75% 85% at 78% 22%,#000 25%,transparent 72%);mask:radial-gradient(75% 85% at 78% 22%,#000 25%,transparent 72%)}
.veil img{position:absolute;right:-4%;top:-10%;height:150%;width:auto;max-width:none;filter:grayscale(1);opacity:.5;mix-blend-mode:screen}
@media (min-width:900px){.veil{height:300px}}
/* text on photographs is white in both appearances */
.pcard .ov,.fc .in,.ph .bot,.ph .top,.rcard,.hero .cap,.wide .art{color:#fff}

/* tab bar: one small floating pill of icons (pin 746260600795600117, ~151x47) */
#tabs{justify-content:center;gap:8px}
#tabbar{flex:none;height:52px;border-radius:26px;padding:4px}
.tab{width:56px;flex:none}
.tab .lb{display:none}
#tabhl{top:4px;bottom:4px;border-radius:22px}
#tabsearch{width:52px;height:52px;border-radius:26px}

html.light .acard .atile{background:#1c1c1e}
html.light .wave i{background:rgba(0,0,0,.16)} html.light .wave .wv.on i{background:#000}

/* =========================== LIQUID GLASS ============================
   Measured from Adam's blessed pins 39828777963914523 (glass pills, 3565px)
   and 10062799163732573 (iOS 26 Control Centre): fill ~3% white over a heavy
   blur; a hairline rim at ~60% white top-left falling to ~30% at the bottom;
   a second inner hairline at ~19%. No drop shadow on dark; a soft one on light. */
:root{--lg-fill:rgba(20,22,27,.70);--lg-blur:blur(40px) saturate(1.6);   /* frosted: measured, pin 1033646551994162123 */
  --lg-rim:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.2) 30%,rgba(255,255,255,.07) 55%,rgba(255,255,255,.3));
  --lg-inner:inset 0 1px 1px rgba(255,255,255,.19),inset 0 -1px 1px rgba(255,255,255,.06);
  --lg-drop:0 8px 28px rgba(0,0,0,.28)}
html.light{--lg-fill:rgba(250,250,252,.72);--lg-blur:blur(40px) saturate(1.7);
  --lg-rim:linear-gradient(150deg,rgba(255,255,255,1),rgba(255,255,255,.5) 35%,rgba(0,0,0,.06) 60%,rgba(255,255,255,.7));
  --lg-inner:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -1px 1px rgba(0,0,0,.03);--lg-drop:0 8px 26px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
#tabbar,#tabsearch,#mini,.btn-icon.glass,.btn-glass{position:relative}
.glass{isolation:isolate;background:var(--lg-fill);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),var(--lg-drop)}
.glass::after{content:"";display:block;position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:var(--lg-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
html.light .glass{background:var(--lg-fill);box-shadow:var(--lg-inner),var(--lg-drop)}
/* on photographs controls are always the dark-adapted glass, in either appearance */
.ph .top .btn-icon.glass,html.light .ph .top .btn-icon.glass,.fcfav,.pill.ghost{background:rgba(40,40,44,.42);color:#fff;
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.19),inset 0 -1px 1px rgba(255,255,255,.06),0 6px 20px rgba(0,0,0,.18)}
.fcfav::after,.pill.ghost::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.2) 30%,rgba(255,255,255,.07) 55%,rgba(255,255,255,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pill.ghost{position:relative}
/* tab pill: the selection is a clear glass lens, not a grey lozenge (pin 217650594489716463) */
/* floating bars sit over busy content, so they carry more tint (iOS deepens glass over content) */
#tabbar,#tabsearch,#mini,#topnav,.toast{background:rgba(28,28,30,.54);-webkit-backdrop-filter:blur(28px) saturate(1.45);backdrop-filter:blur(28px) saturate(1.45)}
html.light #tabbar,html.light #tabsearch,html.light #mini,html.light #topnav,html.light .toast{background:rgba(248,248,250,.62)}
/* The desktop player spans a much wider compositor tile than the phone bars;
   regular 20 px glass keeps the frost while avoiding a large-kernel repaint. */
#mini{-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
#tabhl,html.light #tabhl{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 1px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.18)}
html.light #tabhl{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,1),0 2px 10px rgba(0,0,0,.1)}
/* hairline circles on the ground become small glass buttons */
.circ{background:var(--lg-fill);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-inner),inset 0 0 0 1px rgba(255,255,255,.12)}
html.light .circ{background:#fff;box-shadow:var(--lg-inner),inset 0 0 0 1px var(--hair),0 2px 8px rgba(0,0,0,.05)}
.sheet{background:rgba(28,28,30,.72)} html.light .sheet{background:rgba(255,255,255,.82)}
/* Now Playing is immersive and stays dark in either appearance */
html.light #np{color-scheme:dark;color:#fff;--label:#fff;--label2:#8e8e93;--dim:#69696b;--text2:rgba(255,255,255,.75);
  --panel:#1c1c1e;--panel2:#323234;--hair:rgba(255,255,255,.08);--sep:rgba(255,255,255,.08)}
html.light #np .cover,html.light #np .cover .ti{color:#fff}
html.light #np .btn-icon{background:var(--panel);color:#fff}

/* Card artwork is content, not chrome: use a gradient for legibility instead of
   multiplying live backdrop filters across a scrolling collection. */
.fc::before{background:linear-gradient(transparent 55%,rgba(0,0,0,.42))}
.pcard .art::before{background:linear-gradient(transparent 60%,rgba(0,0,0,.4))}
.ph::before{background:linear-gradient(rgba(0,0,0,.22),transparent 18%,transparent 55%,rgba(0,0,0,.45) 85%,rgba(0,0,0,.6))}
.ph .bot{z-index:2} .ph .top{z-index:3}

/* =========================== DESKTOP SHELL ===========================
   iPadOS 26 floating sidebar, measured from pin 4604649247285910912
   (Photos, 735px = 820pt): panel inset ~9pt, ~271pt wide, #101010 on #000;
   rows 42pt on a 43pt pitch; selection a #2f2f2f pill inset 16pt; content
   ~25pt to the right; section headers grey. Player floats over content
   (pin 1122663013395119080 Music, pin 4608589877548880960). */
@media (min-width:900px){
  :root{--sbw:272px;--sbx:10px;--cx:calc(var(--sbw) + var(--sbx) + 28px);--m:0px}
  #topnav{display:flex!important;flex-direction:column;align-items:stretch;gap:0;position:fixed;z-index:46;
    left:var(--sbx);top:var(--sbx);bottom:var(--sbx);width:var(--sbw);height:auto;transform:none;border-radius:26px;padding:14px 12px;overflow-y:auto}
  /* The sidebar sits over a uniform field, so a full-height backdrop blur has
     no visible source detail and only forces a costly full-page recomposite. */
  #topnav{-webkit-backdrop-filter:none;backdrop-filter:none}
  html:not(.light) #topnav{background:rgba(24,24,26,.9)}
  html.light #topnav{background:rgba(248,248,250,.92)}
  /* logo row: app mark + wordmark, no box (it was picking up the old .lg glass utility) */
  #topnav .lg{display:flex;align-items:center;gap:11px;height:48px;padding:0 8px;margin:0 0 12px;border-radius:14px;background:none!important;box-shadow:none!important;
    color:var(--label);font-family:'Instrument Serif',Georgia,serif;font-size:25px;line-height:1;letter-spacing:-.01em}
  #topnav .lg::after{display:none!important}
  #topnav .lg img{width:32px;height:32px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--hair),0 2px 8px rgba(0,0,0,.25)}
  #topnav .nav-primary,#topnav .nav-tools{display:flex;flex-direction:column;gap:1px;justify-content:flex-start}
  #topnav .nav-tools{margin-top:auto;padding-top:12px}
  #topnav button:not(.lg){height:42px;width:100%;padding:0 14px;border-radius:21px;gap:12px;justify-content:flex-start;
    font-size:17px;font-weight:400;letter-spacing:-.43px;color:var(--label)}
  #topnav button:not(.lg) .sfi{color:var(--label2)}
  #topnav button.on{background:#2f2f2f;color:#fff;box-shadow:none}
  #topnav button.on .sfi{color:#fff}
  html.light #topnav button.on{background:rgba(0,0,0,.07);color:#000} html.light #topnav button.on .sfi{color:#000}
  #topnav .nav-sect{margin:18px 14px 6px;font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--label2)}
  @media (hover:hover){#topnav button:not(.on):not(.lg):hover{background:var(--fill3)}}

  .page{padding-left:var(--cx);padding-right:32px}
  .content{max-width:none;margin:0}
  .ltitle{padding-top:40px;padding-left:0;padding-right:0}
  .wrap{padding:0}
  .hrow{padding:0;scroll-padding:0}
  .bleed{margin:0}
  .veil{right:0}
  .ptop{left:calc(var(--cx) - 4px)!important;top:16px!important}
  .ltitle:has(+ .ptop),.content:has(.ptop) .ltitle{padding-top:76px}
  .pdesk{max-width:none;margin:0;padding:40px 0 0;grid-template-columns:minmax(320px,420px) minmax(0,1fr)}
  .pdesk .ptop{position:fixed}
  .pdesk>div>.ptop{display:none}
  .settings,.libwrap{max-width:820px!important;margin:0}
  .intro{max-width:620px}
  /* the player floats centred over the content column */
  #dock{left:var(--cx);right:32px;padding:0 0 18px}
  #mini{width:min(760px,100%)}
  body.np-open #view{filter:none}
  /* archive tiles get room on wide screens */
  .archive-showcase{grid-template-columns:repeat(3,minmax(0,1fr))}
  .artifact-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* =========================== ARTWORK CARDS ===========================
   Books and archive items carry real artwork (refs pin 1016054365936791041,
   805299977152614362): the figure's portrait, a progressive blur at the foot,
   the title in white serif — the same grammar as the approved portrait cards. */
.cover{position:relative;overflow:hidden;background:#1c1c1e!important;color:#fff!important}
.cover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:grayscale(1) contrast(1.05)}
.cover::before{content:"";display:block!important;position:absolute;inset:0;width:auto;z-index:1;box-shadow:none;
  background:linear-gradient(transparent 35%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.72))}
.cover::after{content:"";display:block!important;position:absolute;left:0;right:0;top:auto;bottom:0;height:55%;width:auto;z-index:1;opacity:1;
  background:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.cover .ti,.cover .au,.cover .pr,.cover .dn{z-index:2}
.cover .ti,html.light .cover .ti{top:auto;bottom:30px;color:#fff!important;font-size:17px;line-height:18px;-webkit-line-clamp:4}
.cover .au,html.light .cover .au{color:rgba(255,255,255,.7)!important;bottom:12px}
.cover .pr{background:rgba(255,255,255,.2)!important} .cover .pr i{background:#fff!important}
.cover .dn{background:#fff!important;color:#000!important}
.cover.cur{box-shadow:inset 0 0 0 2px #fff}
.art-obj{position:relative;display:block;width:100%;height:100%;overflow:hidden;border-radius:var(--r-panel);background:#1c1c1e;color:#fff}
.art-obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:grayscale(1) contrast(1.05)}
.art-obj::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 40%,rgba(0,0,0,.6))}
.art-obj::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;z-index:1;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  -webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.art-obj .ak{position:absolute;z-index:2;left:12px;top:12px;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;
  font-size:12px;font-weight:600;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 1px rgba(255,255,255,.3)}
.art-obj .object-title{position:absolute;z-index:2;left:14px;right:14px;bottom:14px;margin:0;font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:23px;color:#fff;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.artifact-card .object-stage{padding:0;background:none!important;box-shadow:none!important}
.artifact-card .object-stage .art-obj,.archive-tile .object-stage .art-obj{width:100%;height:100%}
.archive-tile .object-stage{height:auto;aspect-ratio:4/5}
.hist-object .art-obj{border-radius:inherit}
.hist-object .art-obj .ak,.hist-object .art-obj .object-title{display:none}
@media (max-width:679px){.archive-tile .object-stage{aspect-ratio:auto;height:144px}.art-obj .object-title{font-size:18px;line-height:19px}}

/* light figure page on desktop: controls are not on the photo there */
html.light .pdesk .pill:not(.ghost){background:#000;color:#fff}
html.light .pdesk .pill.ghost{background:#fff;color:#000;box-shadow:inset 0 0 0 1px var(--hair),0 2px 8px rgba(0,0,0,.05)}
html.light .pdesk .pill.ghost::after{display:none}
html.light .pdesk .stats b{color:#000} html.light .pdesk .stats span{color:var(--label2)}
.art-obj .ak{background:rgba(28,28,30,.72);-webkit-backdrop-filter:none;backdrop-filter:none}
/* performance: grid and cover cards fade with a gradient instead of a live backdrop blur per card
   (rAF probe 2026-10-31: per-card backdrop-filter made the zoom drop to 117ms frames) */
.cover::after,.art-obj::after,.pcard .art::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  background:linear-gradient(transparent,rgba(0,0,0,.35))!important;-webkit-mask:none!important;mask:none!important}
/* Repeated card actions use an opaque material. Liquid Glass is reserved for
   the persistent navigation and singular overlay controls. */
.fcfav{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(28,28,30,.74)}
/* search field: no browser ring; a quiet focus ring on the field */
.search input:focus,.search input:focus-visible{outline:none}
.search:focus-within{box-shadow:0 0 0 3px rgba(127,127,127,.25)}

/* the app owns horizontal drags (swipe-back); the browser's own history swipe is off */
html,body{overscroll-behavior-x:none}
.page{touch-action:pan-y}
.hrow{touch-action:pan-x pan-y}


/* ===================== motion polish (values from Ionic source, 2026-10-31) ===================== */
#view{position:fixed;inset:0;display:block;contain:layout size style}
/* Ionic page container (core.css .ion-page), but block layout and our own scroller */
.nav-view.ion-page{position:absolute;inset:0;display:block;contain:layout size style;z-index:0}
.page.ion-page{position:absolute;inset:0;display:block;z-index:0}
.ion-page-hidden{display:none!important}
.ion-page-invisible{opacity:0}
ion-nav:not(.hydrated) .page{position:absolute;inset:0}

#sbhl{display:none}
@media (min-width:900px){
  #topnav{position:fixed}
  #sbhl{display:block;position:absolute;left:0;top:0;z-index:0;border-radius:21px;background:#2f2f2f;pointer-events:none;
    transition:transform .24s cubic-bezier(.2,.8,.2,1),height .24s cubic-bezier(.2,.8,.2,1),width .24s cubic-bezier(.2,.8,.2,1),opacity .16s}

/* text tabs: a capsule marks the selection and slides (Ionic segment: 260ms cubic-bezier(0.4,0,0.2,1)) */
.chip,.chip.on{position:relative;isolation:isolate;padding:0 14px;border-radius:22px;transition:color .1s linear}
.chip.on::before{content:"";position:absolute;inset:2px 0;border-radius:20px;background:rgba(255,255,255,.12);z-index:-1}

/* toasts use the same short, non-bouncing motion as the rest of the frequent UI */
/* large title hand-off is scroll-driven now */

/* ===================== Ionic modal hosting ===================== */
:root{--ion-safe-area-top:env(safe-area-inset-top,0px);--ion-safe-area-bottom:env(safe-area-inset-bottom,0px);--ion-safe-area-left:env(safe-area-inset-left,0px);--ion-safe-area-right:env(safe-area-inset-right,0px)}  /* Ionic's own sizing reads these (core.css) */

  #dock::before{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(130px + var(--safe-b));z-index:-1;pointer-events:none;

body.buffering #npplay::after,body.buffering #mini .tg::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;
  border-top-color:currentColor;animation:spin .8s linear infinite;pointer-events:none}

<script>
/* ============================== icons ============================== */
const sfi=(n,s,c)=>`<i class="sfi" style="--m:url(assets/sf/${n}.svg);width:${s}px;height:${s}px${c?';background-color:'+c:''}"></i>`;
const IC={
  play:s=>sfi('play_fill',s), pause:s=>sfi('pause_fill',s), rw:s=>sfi('backward_fill',s), ff:s=>sfi('forward_fill',s),
  star:(s,f)=>sfi(f?'star_fill':'star',s,f?'#FFD60A':null), search:s=>sfi('search',s), back:s=>sfi('chevron_left',s),
  chev:s=>sfi('chevron_right',s), down:s=>sfi('chevron_down',s), x:s=>sfi('xmark',s), more:s=>sfi('ellipsis',s),
  info:s=>sfi('info_circle',s), shuffle:s=>sfi('shuffle',s), repeat:s=>sfi('repeat',s), list:s=>sfi('list_bullet',s),
  moon:s=>sfi('moon_zzz_fill',s), house:s=>sfi('house_fill',s), people:s=>sfi('person_2_fill',s),

};

/* ============================== data ============================== */
const META = {
 "Elon Musk":{cat:"business",sub:"SpaceX · Tesla · PayPal",bio:"Serial founder running the most ambitious industrial portfolio in history — rockets, cars, energy, tunnels, AI.\n\nThe episodes trace how he actually works: reasoning from first principles, setting insane deadlines, and committing everything he has, every time."},
 "Jeff Bezos":{cat:"business",sub:"Amazon · Blue Origin",bio:"Built Amazon from a garage bookstore into an everything company through long-term thinking, customer obsession, and written narratives instead of slides.\n\nHis shareholder letters are the closest thing modern business has to a syllabus."},
 "Bill Gates":{cat:"business",sub:"Microsoft",bio:"Co-founded Microsoft at nineteen and out-worked and out-positioned everyone through software's land-grab decade.\n\nA case study in leverage, focus, and knowing the whole board better than anyone playing on it."},
 "Jensen Huang":{cat:"business",sub:"Nvidia",bio:"Thirty-plus years running Nvidia from arcade graphics chips to the engine of the AI era — the longest-serving founder-CEO in tech.\n\nObsessed with work as craft, pain as fuel, and building for markets that don't exist yet."},
 "Mark Zuckerberg":{cat:"business",sub:"Facebook / Meta",bio:"Dropped out at nineteen and turned a dorm-room project into a communications empire, refusing to sell at every price on the way."},
 "Steve Jobs":{cat:"business",sub:"Apple · Pixar",bio:"Founded Apple twice — the second time from the ashes — and built the most valuable products company in history on taste, focus, and saying no.\n\nSenra has covered him more than anyone: the episodes span his heroes, his exile, and his return."},
 "John D. Rockefeller":{cat:"business",sub:"Standard Oil",bio:"Turned one Cleveland refinery into Standard Oil, history's most disciplined monopoly, through cost accounting, silence, and patience.\n\nThe most-covered founder in the catalog for a reason: every mechanism is on display."},
 "Andrew Carnegie":{cat:"business",sub:"Carnegie Steel",bio:"Scottish telegraph boy who became the richest man in the world by riding technological shifts and hiring men smarter than himself — then spent the rest of his life giving it all away."},
 "Henry Ford":{cat:"business",sub:"Ford Motor Company",bio:"Put the world on wheels by obsessing over one product at one falling price, and relentlessly removing waste from the production line.\n\nToday and Tomorrow — his 1926 book — reads like the source code for Toyota."},
 "Edwin Land - Polaroid":{cat:"business",sub:"Polaroid",bio:"Steve Jobs's hero. Ran Polaroid as an instrument for turning science into products people didn't know they needed — thirty years before the iPhone playbook existed."},
 "Intel - Noyce Grove Shockley":{cat:"business",sub:"Intel",bio:"Noyce, Grove, and the physics-to-fab lineage that invented the integrated circuit and then survived every wave that killed its rivals.\n\nGrove's paranoia is doctrine; Noyce's optimism is the counterweight."},
 "Peter Thiel":{cat:"business",sub:"PayPal · Palantir · Founders Fund",bio:"Contrarian operator behind PayPal, Palantir, and the sharpest question in tech: what important truth do very few people agree with you on?"},
 "Alexander the Great":{cat:"military",sub:"King of Macedon",bio:"Conquered the known world by thirty and never lost a battle.\n\nThe founding case study in speed, logistics, shared hardship, and leading from the front."},
 "Napoleon":{cat:"military",sub:"Emperor of the French",bio:"Artillery officer who became Emperor and rewrote the art of war, administration, and ambition itself.\n\nSenra calls his biography one of the best books on the will to power ever written."},
 "Winston Churchill":{cat:"military",sub:"Britain",bio:"Half a century of failure, exile, and writing — then the one job only he could do.\n\nThe definitive study in endurance, preparation, and language as a weapon."},
 "Charles de Gaulle":{cat:"military",sub:"France",bio:"Rebuilt a nation's spine twice on sheer will and a refusal to be small. Statecraft as a study in identity."},
 "Nikola Tesla":{cat:"science",sub:"AC power · Invention",bio:"Inventor of the alternating-current world who saw entire machines complete in his mind — and died broke.\n\nThe cautionary half of the genius equation: invention without commercialization."},
 "J. Robert Oppenheimer":{cat:"science",sub:"Manhattan Project",bio:"The physicist who ran Los Alamos and delivered the atomic bomb in twenty-seven months.\n\nWith General Groves, the deepest study of scientific project leadership ever run."},
 "Claude Shannon":{cat:"science",sub:"Information theory",bio:"Invented information theory in a single paper and treated the frontier as a playground — juggling, unicycles, and the mathematics underneath the entire digital age."},
 "Vannevar Bush":{cat:"science",sub:"OSRD · Science policy",bio:"Ran American science during World War II — six thousand scientists pointed at one goal.\n\nThe blueprint for organizing research at scale."},
 "Alfred Lee Loomis":{cat:"science",sub:"Tuxedo Park · Rad Lab",bio:"Wall Street tycoon who built a private physics lab and bankrolled the radar work that arguably won the war before the bomb ended it."},
 "Demis Hassabis - DeepMind":{cat:"science",sub:"DeepMind",bio:"Chess prodigy and game designer who built DeepMind to solve intelligence itself — a live case study in organizing frontier research."},
 "Cornelius Vanderbilt":{cat:"money",sub:"Shipping · Railroads",bio:"The Commodore — ferries to steamships to railroads, crushing rivals with price wars and nerve for sixty straight years."},
 "J.P. Morgan":{cat:"money",sub:"Banking",bio:"The banker who reorganized America's railroads, bailed out the U.S. Treasury, and ran finance as a one-man central bank."},
 "The Rothschilds":{cat:"money",sub:"Banking dynasty",bio:"Five brothers in five cities running Europe's money as one organism — the original network business."},
 "Jacob Fugger":{cat:"money",sub:"Renaissance finance",bio:"The Renaissance banker who financed emperors and died the richest man who ever lived. Leverage, information, and God."},
 "James J. Hill":{cat:"money",sub:"Great Northern Railway",bio:"Built the only transcontinental railroad that never went bankrupt — by walking the ground himself, mile by mile, before laying track."},
 "Jim Simons":{cat:"money",sub:"Renaissance Technologies",bio:"Mathematician who left academia and built the best-performing investment machine in history by hiring scientists and trusting the model."},

 "Bill Walsh":{cat:"systems",sub:"San Francisco 49ers",bio:"Took the worst team in football to three Super Bowls by scripting everything.\n\n'The score takes care of itself' is a complete operating system."},

/* set the page ground: one figure's hue, or the neutral graphite ground */
function ground(p){ const [h,s]=p?pal(p):[220,.06]; const d=document.documentElement.style; d.setProperty('--gh',h); d.setProperty('--gs',s);
  document.querySelector('meta[name=theme-color]').content=document.documentElement.classList.contains('light')?'#f7f7f7':'#000000'; }
function epTitle(p, e){
  const t = e.title;
  const short = p.shortName || p.name;
  const words = short.split(/\s+/);
  const vars = [p.name, short];
  if (words.length === 2) vars.push(words[1]);       // surname, only for "First Last"
  const uniq = [...new Set(vars.filter(v => v && v.length > 2))]
                 .sort((a, b) => b.length - a.length);
  for (const v of uniq){
    const q = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // "Name (Subtitle)" -> "Subtitle"
    let m = t.match(new RegExp('^' + q + '\\s*\\((.+)\\)\\s*$', 'i'));
    if (m && m[1].length > 2) return m[1];
    // "Name: X" / "Name - X" only. Conjunctions are excluded on purpose:
    // "Steve Jobs and His Heroes" must stay whole, not become "His Heroes".
    m = t.match(new RegExp('^' + q + '\\s*(?::|\\u2013|\\u2014|-)\\s*(.+)$', 'i'));
    if (m && m[1].length > 2) return m[1];
  }
  return t;
}

/* Each Founders episode is built on one book, and that book is what actually
   separates two episodes about the same person — "Steve Jobs" #5 is Isaacson,
   #204 is Kahney. So on a person's shelf the book is the headline and the
   author replaces the feed's global episode number, which carries no meaning
   once you are looking at one person rather than the whole chronology. */
const rowTitle = (p, e) => (e.book && e.book.trim()) ? e.book.trim() : epTitle(p, e);
const rowSub = (p, e) => {
  if (e.sub) return e.sub;
  const a = (e.author || '').trim(), d = mon(e.date);
  return a ? a + ' · ' + d : d;
};
