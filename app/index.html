<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Founders</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Founders">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
/* ==== tokens sampled from the reference recordings ==== */
:root{
  --bg:#000000;
  --field:#1F2123;          /* search fields on black */
  --card:#181818;           /* list container */
  --tile:#2A2A2A;           /* number tiles */
  --pill:#1A1A1A;           /* mini player pill */
  --circle:#252525;         /* circular buttons on detail */
  --text:#FFFFFF;
  --grey:#848389;
  --blue:#4082FF;
  --green:#2E9E22;
  /* player surface */
  --pbg:#020111;
  --glowA:#0060EA; --glowB:#0A46BE; --glowC:#001050;
  --ptitle:#EBF6FF; --psub:#7683C3; --ptrack:#374874;
  --toppill:#2C2D37;
  /* queue sheet */
  --sheet:#181825; --sheetfield:#2B2C36; --sheettile:#23242A; --sheetactive:#2B2C36;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.32,.72,.33,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color:var(--text); overscroll-behavior-y:none; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;outline:none}
img{-webkit-user-drag:none;user-select:none}
svg{display:block}
.press{transition:transform .16s var(--ease), opacity .16s var(--ease)}
.press:active{transform:scale(.94);opacity:.8}

/* ===================== view stack (push navigation) ===================== */
.view{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--bg);
  -webkit-overflow-scrolling:touch;
  max-width:560px; margin:0 auto;
}
.view.under{transform:translateX(0)}
.view.push-in{animation:pushIn .42s var(--ease) both}
.view.push-under{animation:pushUnder .42s var(--ease) both}
.view.pop-out{animation:popOut .38s var(--ease) both}
.view.pop-back{animation:popBack .38s var(--ease) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pushUnder{from{transform:translateX(0)}to{transform:translateX(-24%)}}
@keyframes popOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes popBack{from{transform:translateX(-24%)}to{transform:translateX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both}

/* ===================== browse ===================== */
#browse{padding:calc(14px + var(--safe-t)) 16px 150px}
.navtitle{text-align:center;font-size:17px;font-weight:600;padding:2px 0 16px}
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--field);
  border-radius:12px;height:44px;padding:0 12px;margin-bottom:10px;
}
.searchbar svg{flex:none}
.searchbar input{
  flex:1;background:none;border:none;color:var(--text);font-size:17px;
}
.searchbar input::placeholder{color:#8E8E93}
.sect{margin-top:30px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:.2px}
.seeall{font-size:15px;color:var(--blue);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-width:0}
.disc{display:block;border-radius:50%;overflow:hidden;position:relative;flex:none;background:#151515}
.discwrap{display:block}
.disc img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pcard .discwrap{position:relative}
.pcard .disc{width:108px;height:108px;max-width:29vw;max-height:29vw}
.badge-new{
  position:absolute;top:2px;right:-2px;z-index:2;background:var(--green);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.3px;border-radius:7px;padding:2.5px 7px;
}
.pcard .pname{font-size:15px;line-height:1.4;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===================== bottom floating cluster ===================== */
#dock{
  position:fixed;left:0;right:0;bottom:max(10px, calc(var(--safe-b) - 12px));z-index:40;
  max-width:560px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;gap:10px;
  pointer-events:none;
}
#dock>*{pointer-events:auto}
.dock-circle{
  width:54px;height:54px;flex:none;border-radius:50%;background:rgba(26,26,26,.88);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#minipill{
  flex:1;min-width:0;height:56px;border-radius:28px;background:rgba(26,26,26,.88);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  display:flex;align-items:center;gap:10px;padding:0 14px 0 7px;text-align:left;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
  transform:translateY(140%);transition:transform .5s var(--ease);
}
body.has-track #minipill{transform:none}
#minipill .disc{width:42px;height:42px;border-radius:10px}
#minipill .mp-meta{flex:1;min-width:0}
#minipill .mp-t{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minipill .mp-s{display:block;font-size:12px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#minipill .mp-btn{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}

/* ===================== detail ===================== */
#detail{padding-bottom:150px}
.hero{position:relative;height:51.5vh;min-height:380px;max-height:520px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:108%;object-fit:cover;object-position:center top;will-change:transform}
.hero .fade{position:absolute;inset:0;background:linear-gradient(to bottom, transparent 0%, transparent 58%, rgba(0,0,0,.28) 73%, rgba(0,0,0,.52) 82%, rgba(0,0,0,.74) 90%, rgba(0,0,0,.92) 96%, #000 100%)}
.hero-top{position:absolute;top:calc(1px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;z-index:3}
.hero-circle{
  width:40px;height:40px;border-radius:50%;background:rgba(24,24,24,.55);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
}
.hero-body{position:absolute;left:16px;right:16px;bottom:4px;z-index:2;text-align:center}
.hero-name{font-size:28px;font-weight:700;letter-spacing:.2px;line-height:1.2;
  text-shadow:0 1px 18px rgba(0,0,0,.35)}
.hero-sub{font-size:15px;color:#C6C6CB;margin-top:3px}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}
.act-circle{width:44px;height:44px;border-radius:50%;background:var(--circle);
  display:flex;align-items:center;justify-content:center}
.act-circle.faved svg{fill:#FFD60A}
.playpill{
  height:42px;border-radius:21px;background:#fff;color:#000;font-size:19px;font-weight:600;
  display:flex;align-items:center;gap:9px;padding:0 17px;
}
.playpill svg{fill:#000}
.bio-wrap{margin:16px 16px 0;position:relative}
.bio{font-size:13px;line-height:17px;color:#8E8E93;display:inline}
.bio-more{color:var(--blue);font-size:13px;display:inline;margin-left:4px}
.epsect{margin:20px 16px 0}
.epsect-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.epsect-head h2{font-size:20px;font-weight:700}
.epsect-head .tot{font-size:13px;color:var(--grey)}
.eplist{background:var(--card);border-radius:24px;overflow:hidden;padding:3px 0}
.eprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;position:relative}
.numtile{
  width:50px;height:50px;flex:none;border-radius:12px;background:var(--tile);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
}
.eprow.done .numtile{color:var(--grey)}
.ep-main{flex:1;min-width:0}
.ep-t{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eprow.active .ep-t{color:var(--blue)}
.ep-s{display:block;font-size:13px;color:var(--grey);margin-top:2px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-side{flex:none;font-size:13px;color:var(--grey);font-variant-numeric:tabular-nums}
.ep-side.left{color:var(--blue);font-weight:600}
.ep-side.donecheck svg{fill:var(--green)}
.ep-prog{position:absolute;left:78px;right:16px;bottom:6px;height:2px;border-radius:1px;background:rgba(255,255,255,.07)}
.ep-prog i{display:block;height:100%;background:var(--blue);border-radius:1px}
.eq{display:inline-flex;align-items:flex-end;gap:2.5px;height:16px}
.eq i{width:3px;background:var(--blue);border-radius:1.5px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
.eq.paused i{animation-play-state:paused;height:5px}
@keyframes eq{0%,100%{height:5px}50%{height:16px}}

/* ===================== player (full-screen sheet) ===================== */
#player{
  position:fixed;inset:0;z-index:60;max-width:560px;margin:0 auto;
  background:var(--pbg);
  display:flex;flex-direction:column;
  padding:calc(6px + var(--safe-t)) 24px calc(13px + var(--safe-b));
  transform:translateY(103%);transition:transform .52s var(--ease);
  overflow:hidden;
}
#player.show{transform:none}
#player::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70% 30% at 0% 103%, rgba(60,200,255,.55), transparent 70%),
    radial-gradient(70% 28% at 100% 103%, rgba(10,200,255,.45), transparent 70%),
    linear-gradient(to top,#0080F6 0,#0248C6 7%,#022B9A 13%,#01175F 19%,#000F5B 24%,#001455 31%,#001147 37%,#000F3C 43%,#000B28 49%,#010516 55%,#000212 61%,#020111 67%);
}
#player>*{position:relative;z-index:1}
.grab{width:40px;height:5px;border-radius:2.5px;background:#4A4D66;margin:0 auto 32px;flex:none}
.toppill-wrap{display:flex;justify-content:center;flex:none}
.toppill{
  display:flex;align-items:center;gap:7px;background:var(--toppill);
  height:34px;border-radius:17px;padding:0 16px;
  font-size:15px;font-weight:600;color:#DCDCE6;max-width:80%;
}
.toppill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .spacer{flex:1}
.np-row{display:flex;align-items:center;gap:13px;flex:none}
.np-row .disc{width:44px;height:44px;flex:none}
.np-meta{flex:1;min-width:0}
.np-t{display:block;font-size:21px;font-weight:700;color:var(--ptitle);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.np-s{display:block;font-size:16px;color:var(--psub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-star{width:37px;height:37px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(150,168,255,.13);margin-left:4px}
.np-star.faved svg{fill:#FFD60A;stroke:#FFD60A}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex:none}
.ctl-speed{font-size:16px;font-weight:600;color:rgba(235,240,255,.6);width:44px;text-align:left;font-variant-numeric:tabular-nums}
.ctl-skip svg{fill:#fff}
.ctl-play{width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.ctl-play svg{fill:#fff}
.ctl-moon{width:44px;text-align:right;display:flex;justify-content:flex-end;position:relative}
.ctl-moon svg{fill:#979DB4}
.ctl-moon.armed svg{fill:#FFD60A}
.ctl-moon .zz{position:absolute;top:-7px;right:-4px;font-size:10px;font-weight:700;color:#FFD60A}
.scrub-wrap{margin-top:18px;flex:none}
.scrub-bar{position:relative;height:26px;display:flex;align-items:center;touch-action:none}
.scrub-track{width:100%;height:5px;border-radius:2.5px;background:var(--ptrack);transition:height .2s var(--ease)}
.scrub-bar.grab .scrub-track{height:9px}
.scrub-track i{display:block;position:relative;height:100%;max-width:100%;background:#fff;border-radius:2.5px}
.scrub-track i::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;
  color:#fff;font-variant-numeric:tabular-nums;margin-top:6px}
.times .rem{color:var(--psub)}
.bottomicons{display:flex;align-items:center;justify-content:space-between;margin:27px -8px 0;flex:none}
.bottomicons button{width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.bottomicons svg{fill:rgba(235,241,255,.62)}
.bottomicons .on svg{fill:#fff}
.bottomicons .fglyph{font-size:25px;font-weight:700;color:rgba(235,241,255,.62);font-family:Georgia,"Times New Roman",serif;font-style:italic}

/* ===================== queue sheet (materialize) ===================== */
#queue{
  position:fixed;left:16px;right:16px;top:calc(86px + var(--safe-t));z-index:70;
  max-width:520px;margin:0 auto;max-height:min(372px,55vh);
  background:rgba(26,26,40,.94);
  -webkit-backdrop-filter:blur(36px) saturate(1.4);backdrop-filter:blur(36px) saturate(1.4);
  border-radius:24px;padding:20px 14px 8px;
  display:flex;flex-direction:column;
  opacity:0;transform:scale(.94);transform-origin:50% 20%;pointer-events:none;
  transition:opacity .32s var(--ease), transform .32s var(--ease);
  box-shadow:0 10px 36px rgba(0,0,0,.3);
}
#queue.show{opacity:1;transform:none;pointer-events:auto}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:0 3px 9px;flex:none}
.q-head h3{font-size:20px;font-weight:700}
.q-ic{display:flex;gap:10px}
.q-ic button{width:34px;height:34px;border-radius:50%;background:#31323C;
  display:flex;align-items:center;justify-content:center}
.q-ic svg{fill:#A6A6B0}
.q-ic button.on svg{fill:#fff}
.q-search{display:flex;align-items:center;gap:8px;background:var(--sheetfield);
  border-radius:12px;height:44px;padding:0 12px;margin:0 2px 10px;flex:none}
.q-search input{flex:1;background:none;border:none;color:#fff;font-size:16px}
.q-search input::placeholder{color:#7C7C88}
.q-list{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;margin:0 -4px}
.q-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 6px;border-radius:14px}
.q-row.active{background:var(--sheetactive)}
.q-tile{width:40px;height:40px;flex:none;border-radius:10px;background:var(--sheettile);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.q-row.active .q-tile{background:transparent}
.q-main{flex:1;min-width:0}
.q-t{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-s{display:block;font-size:12px;color:#9EA0AB;margin-top:1px}
.q-side{flex:none;font-size:12px;color:#9EA0AB;font-variant-numeric:tabular-nums;padding-right:6px}
.q-playcircle{width:29px;height:29px;flex:none;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center}
.q-playcircle svg{fill:#000}

/* ===================== about sheet ===================== */
#about{
  position:fixed;inset:0;z-index:80;overflow-y:auto;
  background:rgba(18,18,22,.72);
  -webkit-backdrop-filter:blur(40px) saturate(1.2);backdrop-filter:blur(40px) saturate(1.2);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
  padding:calc(15px + var(--safe-t)) 16px 60px;
}
#about.show{opacity:1;pointer-events:auto}
#about .inner{max-width:420px;margin:0 auto;animation:rise .45s var(--ease) both}
.about-x{width:40px;height:40px;border-radius:50%;background:rgba(60,60,66,.6);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.about-disc{display:flex;justify-content:center}
.about-disc .disc{width:72px;height:72px}
.about-name{text-align:center;font-size:21px;font-weight:700;margin-top:16px}
.about-sub{text-align:center;font-size:15px;color:#B9B9BE;margin-top:12px}
.about-body{margin-top:44px;font-size:16px;line-height:1.5;color:#E4E4E9;white-space:pre-line}

/* scrim for queue */
#qscrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.02);
  opacity:0;pointer-events:none;transition:opacity .32s var(--ease)}
#qscrim.show{opacity:1;pointer-events:auto}

::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div class="view" id="browse"></div>
<div class="view" id="detail" style="display:none"></div>

<div id="dock">
  <button class="dock-circle press" id="dock-person" aria-label="Now playing figure"></button>
  <button id="minipill" aria-label="Open player">
    <span class="disc"><img id="mp-img" alt=""></span>
    <span class="mp-meta">
      <span class="mp-t" id="mp-t"></span>
      <span class="mp-s" id="mp-s"></span>
    </span>
    <span class="mp-btn" id="mp-toggle"></span>
    <span class="mp-btn" id="mp-fwd"></span>
  </button>
  <button class="dock-circle press" id="dock-search" aria-label="Search"></button>
</div>

<div id="player">
  <div class="grab"></div>
  <div class="toppill-wrap"><button class="toppill press" id="toppill"><span id="tp-name"></span></button></div>
  <div class="spacer"></div>
  <div class="np-row">
    <span class="disc"><img id="np-img" alt=""></span>
    <span class="np-meta">
      <span class="np-t" id="np-t"></span>
      <span class="np-s" id="np-s"></span>
    </span>
    <button class="np-star press" id="np-star"></button>
  </div>
  <div class="controls">
    <button class="ctl-speed press" id="ctl-speed">1×</button>
    <button class="ctl-skip press" id="ctl-rw"></button>
    <button class="ctl-play press" id="ctl-play"></button>
    <button class="ctl-skip press" id="ctl-ff"></button>
    <button class="ctl-moon press" id="ctl-moon"></button>
  </div>
  <div class="scrub-wrap">
    <div class="scrub-bar" id="scrubbar"><div class="scrub-track"><i id="scrubfill" style="width:0%"></i></div></div>
    <div class="times"><span id="t-el">0:00</span><span class="rem" id="t-rem">-0:00</span></div>
  </div>
  <div class="bottomicons">
    <button class="press" id="bi-vol"></button>
    <button class="press fglyph" id="bi-home">ƒ</button>
    <button class="press" id="bi-cast"></button>
    <button class="press" id="bi-queue"></button>
  </div>
</div>

<div id="qscrim"></div>
<div id="queue">
  <div class="q-head">
    <h3>Continue Playing</h3>
    <div class="q-ic">
      <button class="press" id="q-shuffle"></button>
      <button class="press" id="q-repeat"></button>
    </div>
  </div>
  <div class="q-search" id="q-searchwrap"><input id="q-search" type="text" placeholder="Search" autocomplete="off"></div>
  <div class="q-list" id="q-list"></div>
</div>

<div id="about">
  <div class="inner">
    <button class="about-x press" id="about-x"></button>
    <div class="about-disc"><span class="disc"><img id="ab-img" alt=""></span></div>
    <div class="about-name" id="ab-name"></div>
    <div class="about-sub" id="ab-sub"></div>
    <div class="about-body" id="ab-body"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ============ SF-geometry icon set ============ */
const IC = {
  play:(s=24,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="fill:${c}"><path d="M7.5 4.2c0-1 1.1-1.7 2-1.1l11.2 6.8c.9.5.9 1.8 0 2.3L9.5 19c-.9.6-2-.1-2-1.1V4.2z"/></svg>`,
  pause:(s=24,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="fill:${c}"><rect x="5" y="3.4" width="4.6" height="17.2" rx="1.4"/><rect x="14.4" y="3.4" width="4.6" height="17.2" rx="1.4"/></svg>`,

/* ============ people meta (category · descriptor · bio) ============ */
const META = {
 "Elon Musk":{cat:"business",sub:"SpaceX · Tesla · PayPal",bio:"Serial founder running the most ambitious industrial portfolio in history — rockets, cars, energy, tunnels, AI.\n\nThe episodes trace how he actually works: reasoning from first principles, setting insane deadlines, and committing everything he has, every time."},
 "Jeff Bezos":{cat:"business",sub:"Amazon · Blue Origin",bio:"Built Amazon from a garage bookstore into an everything company through long-term thinking, customer obsession, and written narratives instead of slides.\n\nHis shareholder letters are the closest thing modern business has to a syllabus."},
 "Bill Gates":{cat:"business",sub:"Microsoft",bio:"Co-founded Microsoft at nineteen and out-worked and out-positioned everyone through software's land-grab decade.\n\nA case study in leverage, focus, and knowing the whole board better than anyone playing on it."},
 "Jensen Huang":{cat:"business",sub:"Nvidia",bio:"Thirty-plus years running Nvidia from arcade graphics chips to the engine of the AI era — the longest-serving founder-CEO in tech.\n\nObsessed with work as craft, pain as fuel, and building for markets that don't exist yet."},
 "Mark Zuckerberg":{cat:"business",sub:"Facebook / Meta",bio:"Dropped out at nineteen and turned a dorm-room project into a communications empire, refusing to sell at every price on the way."},
 "Steve Jobs":{cat:"business",sub:"Apple · Pixar",bio:"Founded Apple twice — the second time from the ashes — and built the most valuable products company in history on taste, focus, and saying no.\n\nSenra has covered him more than anyone: the episodes span his heroes, his exile, and his return."},
 "John D. Rockefeller":{cat:"business",sub:"Standard Oil",bio:"Turned one Cleveland refinery into Standard Oil, history's most disciplined monopoly, through cost accounting, silence, and patience.\n\nThe most-covered founder in the catalog for a reason: every mechanism is on display."},
 "Andrew Carnegie":{cat:"business",sub:"Carnegie Steel",bio:"Scottish telegraph boy who became the richest man in the world by riding technological shifts and hiring men smarter than himself — then spent the rest of his life giving it all away."},
 "Henry Ford":{cat:"business",sub:"Ford Motor Company",bio:"Put the world on wheels by obsessing over one product at one falling price, and relentlessly removing waste from the production line.\n\nToday and Tomorrow — his 1926 book — reads like the source code for Toyota."},
 "Edwin Land - Polaroid":{cat:"business",sub:"Polaroid",bio:"Steve Jobs's hero. Ran Polaroid as an instrument for turning science into products people didn't know they needed — thirty years before the iPhone playbook existed."},
 "Intel - Noyce Grove Shockley":{cat:"business",sub:"Intel",bio:"Noyce, Grove, and the physics-to-fab lineage that invented the integrated circuit and then survived every wave that killed its rivals.\n\nGrove's paranoia is doctrine; Noyce's optimism is the counterweight."},
 "Peter Thiel":{cat:"business",sub:"PayPal · Palantir · Founders Fund",bio:"Contrarian operator behind PayPal, Palantir, and the sharpest question in tech: what important truth do very few people agree with you on?"},

 "Napoleon":{cat:"military",sub:"Emperor of the French",bio:"Artillery officer who became Emperor and rewrote the art of war, administration, and ambition itself.\n\nSenra calls his biography one of the best books on the will to power ever written."},
 "Winston Churchill":{cat:"military",sub:"Britain",bio:"Half a century of failure, exile, and writing — then the one job only he could do.\n\nThe definitive study in endurance, preparation, and language as a weapon."},
 "Charles de Gaulle":{cat:"military",sub:"France",bio:"Rebuilt a nation's spine twice on sheer will and a refusal to be small. Statecraft as a study in identity."},
 "Nikola Tesla":{cat:"science",sub:"AC power · Invention",bio:"Inventor of the alternating-current world who saw entire machines complete in his mind — and died broke.\n\nThe cautionary half of the genius equation: invention without commercialization."},
 "J. Robert Oppenheimer":{cat:"science",sub:"Manhattan Project",bio:"The physicist who ran Los Alamos and delivered the atomic bomb in twenty-seven months.\n\nWith General Groves, the deepest study of scientific project leadership ever run."},
 "Claude Shannon":{cat:"science",sub:"Information theory",bio:"Invented information theory in a single paper and treated the frontier as a playground — juggling, unicycles, and the mathematics underneath the entire digital age."},
 "Vannevar Bush":{cat:"science",sub:"OSRD · Science policy",bio:"Ran American science during World War II — six thousand scientists pointed at one goal.\n\nThe blueprint for organizing research at scale."},
 "Alfred Lee Loomis":{cat:"science",sub:"Tuxedo Park · Rad Lab",bio:"Wall Street tycoon who built a private physics lab and bankrolled the radar work that arguably won the war before the bomb ended it."},

 "Cornelius Vanderbilt":{cat:"money",sub:"Shipping · Railroads",bio:"The Commodore — ferries to steamships to railroads, crushing rivals with price wars and nerve for sixty straight years."},
 "J.P. Morgan":{cat:"money",sub:"Banking",bio:"The banker who reorganized America's railroads, bailed out the U.S. Treasury, and ran finance as a one-man central bank."},
 "The Rothschilds":{cat:"money",sub:"Banking dynasty",bio:"Five brothers in five cities running Europe's money as one organism — the original network business."},
 "Jacob Fugger":{cat:"money",sub:"Renaissance finance",bio:"The Renaissance banker who financed emperors and died the richest man who ever lived. Leverage, information, and God."},
 "James J. Hill":{cat:"money",sub:"Great Northern Railway",bio:"Built the only transcontinental railroad that never went bankrupt — by walking the ground himself, mile by mile, before laying track."},

const SECTIONS = [
 ["fav","Your favourites"],
 ["business","Business & industry"],
 ["military","War & statecraft"],
 ["science","Science & invention"],
 ["money","Money & markets"],
 ["systems","Capability factories"],
];

/* ============ state ============ */
let DATA=null, PORTRAITS=null;
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
// debug hook: ?safe=47 emulates iPhone safe-area insets for pixel-parity screenshots
(()=>{ const sv=new URLSearchParams(location.search).get('safe');
  if(sv){ document.documentElement.style.setProperty('--safe-t',(parseInt(sv)||47)+'px');
          document.documentElement.style.setProperty('--safe-b','34px'); } })();
const store = {
  get(k,d){ try{const v=localStorage.getItem('fs.'+k);return v===null?d:JSON.parse(v)}catch(e){return d} },
  set(k,v){ try{localStorage.setItem('fs.'+k,JSON.stringify(v))}catch(e){} },
};
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const epKey = (p,e) => p.slug+'::'+(e.n!==null?e.n:e.title);
const pos  = (p,e) => store.get('pos.'+epKey(p,e),0);
const done = (p,e) => store.get('done.'+epKey(p,e),false);
let cur=null, saveTick=0, scrubbing=false, shuffleOn=false, repeatOn=false;
let sleepUntil=null, sleepMin=0, muted=false;
let favs = store.get('favs',[]);
let curDetail=null;

const fmtDur = s => {s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~((s%3600)/60);return h?h+'h '+String(m).padStart(2,'0'):m+' min'};
const fmtClock = s => {s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~((s%3600)/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const mon = d => d? new Date(d).toLocaleDateString(undefined,{month:'short',year:'numeric'}) : '';

/* ============ browse view ============ */
function renderBrowse(filter=''){
  const v=$('browse'); const f=filter.trim().toLowerCase();
  const people = DATA.people.filter(p=>!f||p.name.toLowerCase().includes(f)||p.shortName.toLowerCase().includes(f));
  const card = p => {
    const isNew = p.episodes.some(e=>e.date && e.date>='2026-01-01');
    return `
    <button class="pcard press" data-p="${p.slug}">
      <span class="discwrap">
        ${isNew?'<span class="badge-new">NEW</span>':''}
        <span class="disc"><img loading="lazy" src="${PORTRAITS[p.name]}" alt="${p.shortName}"></span>
      </span>
      <span class="pname">${p.shortName}</span>
    </button>`;
  };
  let html = `<div class="navtitle rise">Founders</div>
  <div class="searchbar rise">${IC.search()}<input id="b-search" type="text" placeholder="Search figures" value="${filter.replace(/"/g,'&quot;')}" autocomplete="off"></div>`;
  for (const [key,label] of SECTIONS){
    const ps = key==='fav'
      ? people.filter(p=>favs.includes(p.name))
      : people.filter(p=>(META[p.name]||{}).cat===key && !favs.includes(p.name));
    if (!ps.length) continue;
    html += `<section class="sect">
      <div class="sect-head"><h2>${label}</h2><span class="seeall">See all</span></div>
      <div class="pgrid">${ps.map(card).join('')}</div>
    </section>`;
  }
  v.innerHTML = html;
  const si=$('b-search');
  si.addEventListener('input',()=>{ const val=si.value;
    // re-render only sections, keep focus
    const sel=si.selectionStart; renderBrowse(val);
    const si2=$('b-search'); si2.focus(); si2.setSelectionRange(sel,sel);
  });
  v.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>openDetail(b.dataset.p));
}

/* ============ push navigation ============ */
let navBusy=false;
function openDetail(pslug){
  if (navBusy) return; navBusy=true;
  const p=DATA.people.find(x=>x.slug===pslug); if(!p){navBusy=false;return}
  curDetail=p;
  renderDetail(p);
  const b=$('browse'), d=$('detail');
  d.style.display='block'; d.scrollTop=0;
  d.classList.add('push-in'); b.classList.add('push-under');
  setTimeout(()=>{ d.classList.remove('push-in'); b.classList.remove('push-under'); b.style.display='none'; navBusy=false; },440);
  history.pushState({v:'detail',p:pslug},'','#/p/'+pslug);
}
function closeDetail(fromPop){
  if (navBusy) return; navBusy=true;
  const b=$('browse'), d=$('detail');
  b.style.display='block';
  d.classList.add('pop-out'); b.classList.add('pop-back');
  setTimeout(()=>{ d.classList.remove('pop-out'); b.classList.remove('pop-back'); d.style.display='none'; curDetail=null; navBusy=false; },400);
  if (!fromPop) history.back();
}
window.addEventListener('popstate',e=>{
  if (curDetail) closeDetail(true);
  else if (e.state && e.state.v==='detail') { /* forward nav */ openDetail(e.state.p); }
});

/* ============ detail view ============ */
function renderDetail(p){
  const v=$('detail');
  const m=META[p.name]||{sub:'',bio:''};
  const st={d:0}; p.episodes.forEach(e=>{if(done(p,e))st.d++});
  const rows=p.episodes.map((e,i)=>{
    const isCur=cur&&cur.p.slug===p.slug&&cur.i===i;
    const dn=done(p,e), ps=pos(p,e), started=ps>60&&!dn;
    const tile=isCur?`<span class="eq${audio.paused?' paused':''}"><i></i><i></i><i></i></span>`:(i+1);
    const side= started? `<span class="ep-side left">${fmtDur((e.sec||0)-ps)} left</span>`
              : dn? `<span class="ep-side donecheck"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:var(--green)"><path d="M9.6 16.2l-4-4-1.7 1.7 5.7 5.7L21.8 7.4l-1.7-1.7z"/></svg></span>`
              : `<span class="ep-side">${fmtDur(e.sec)}</span>`;
    const prog= started? `<span class="ep-prog"><i style="width:${Math.min(99,100*ps/(e.sec||1))}%"></i></span>`:'';
    return `<button class="eprow press ${isCur?'active':''} ${dn?'done':''}" data-i="${i}">
      <span class="numtile">${tile}</span>
      <span class="ep-main">
        <span class="ep-t">${e.title}</span>
        <span class="ep-s">${e.n!==null?'#'+e.n+' · ':''}${mon(e.date)}</span>
      </span>
      ${side}${prog}
    </button>`;
  }).join('');
  const faved=favs.includes(p.name);
  v.innerHTML=`
    <div class="hero">
      <img id="heroimg" src="${PORTRAITS[p.name]}" alt="">
      <div class="fade"></div>
      <div class="hero-top">
        <button class="hero-circle press" id="d-back">${IC.chevL()}</button>
        <button class="hero-circle press" id="d-info">${IC.info()}</button>
      </div>
      <div class="hero-body">
        <div class="hero-name">${p.shortName}</div>
        <div class="hero-sub">${m.sub||''}</div>
        <div class="hero-actions">
          <button class="act-circle press" id="d-shuffle">${IC.shuffle(24)}</button>
          <button class="playpill press" id="d-play">${IC.play(17,'#000')} Play</button>
          <button class="act-circle press ${faved?'faved':''}" id="d-star">${IC.star(25,faved)}</button>
        </div>
      </div>
    </div>
    <div class="bio-wrap rise"><span class="bio" id="d-bio">${(m.bio||'').split('\n')[0]}</span><button class="bio-more" id="d-more">More</button></div>
    <div class="epsect">
      <div class="epsect-head"><h2>${p.episodes.length} episodes recorded</h2><span class="tot">${p.hours} h${st.d?` · ${st.d} done`:''}</span></div>
      <div class="eplist">${rows}</div>
    </div>`;
  // clamp bio to two lines like the reference ("... More" at end of line 2)
  requestAnimationFrame(()=>{ const bio=$('d-bio'); if(!bio) return; const wrap=bio.parentElement;
    let words=bio.textContent.split(' '); let guard=0;
    while(wrap.scrollHeight>46 && words.length>4 && guard++<200){
      words.pop(); bio.textContent=words.join(' ').replace(/[,.;:]$/,'')+'...';
    }
  });
  $('d-back').onclick=()=>closeDetail(false);
  $('d-info').onclick=()=>openAbout(p);
  $('d-more').onclick=()=>openAbout(p);
  $('d-star').onclick=()=>{ toggleFav(p.name); renderDetail(p); };
  $('d-play').onclick=()=>{ const i=resumeIndex(p); playEp(p,i,true); openPlayer(); };
  $('d-shuffle').onclick=()=>{ shuffleOn=true; const i=~~(Math.random()*p.episodes.length); playEp(p,i,true); openPlayer(); paintQueueIcons(); };
  v.querySelectorAll('.eprow').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if (cur&&cur.p.slug===p.slug&&cur.i===i){ toggle(); refreshDetail(); return; }
    playEp(p,i,true); openPlayer();
  });
  // hero parallax
  v.onscroll=()=>{ const y=v.scrollTop, img=$('heroimg');
    if(img&&y<600){ img.style.transform=`translateY(${y*.42}px) scale(${1+Math.max(0,-y)*.002})`; } };
}
function refreshDetail(){ if(curDetail) renderDetail(curDetail); }
function resumeIndex(p){
  let i=p.episodes.findIndex(e=>pos(p,e)>60&&!done(p,e));
  if(i<0) i=p.episodes.findIndex(e=>!done(p,e));
  return i<0?0:i;
}
function toggleFav(name){
  favs = favs.includes(name)? favs.filter(x=>x!==name) : [...favs,name];
  store.set('favs',favs);
  renderBrowse($('b-search')?$('b-search').value:'');
}

/* ============ about sheet ============ */
function openAbout(p){
  const m=META[p.name]||{};
  $('ab-img').src=PORTRAITS[p.name];
  $('ab-name').textContent=p.shortName;
  $('ab-sub').textContent=m.sub||'';
  $('ab-body').textContent=m.bio||'';
  $('about').classList.add('show');
}
$('about-x').innerHTML=IC.x();
$('about-x').onclick=()=>$('about').classList.remove('show');
$('about').addEventListener('click',e=>{ if(e.target.id==='about') $('about').classList.remove('show'); });

/* ============ playback engine ============ */
function playEp(p,i,fromSaved){
  const e=p.episodes[i];
  cur={p,i};
  audio.src=e.url;
  const start=fromSaved?pos(p,e):0;
  audio.play().then(()=>{ if(start>5&&start<(e.sec||1)-20) audio.currentTime=start; }).catch(()=>{});
  audio.playbackRate=store.get('speed',1);
  audio.muted=muted;
  store.set('last',{slug:p.slug,i});
  document.body.classList.add('has-track');
  paintShells(); setMediaSession(p,e); renderQueue();
  if(curDetail) refreshDetail();
}
function toggle(){ if(!cur)return; audio.paused?audio.play():audio.pause(); }
function seekBy(d){ if(cur) audio.currentTime=Math.max(0,audio.currentTime+d); }
function nextEp(auto){
  if(!cur)return; const {p,i}=cur;
  if(repeatOn&&auto){ playEp(p,i,false); return; }
  if(shuffleOn){ const cand=p.episodes.map((_,j)=>j).filter(j=>j!==i); if(cand.length){playEp(p,cand[~~(Math.random()*cand.length)],true);} return; }
  if(i+1<p.episodes.length) playEp(p,i+1,true);
}
function prevEp(){ if(cur&&audio.currentTime>10){audio.currentTime=0;return} if(cur&&cur.i>0) playEp(cur.p,cur.i-1,true); }

audio.addEventListener('timeupdate',()=>{
  if(!cur)return;
  const now=Date.now();
  if(now-saveTick>4000){ saveTick=now; store.set('pos.'+epKey(cur.p,cur.p.episodes[cur.i]),Math.round(audio.currentTime)); }
  if(sleepUntil&&now>=sleepUntil){ audio.pause(); sleepUntil=null; sleepMin=0; paintMoon(); }
  paintProgress();
});
audio.addEventListener('ended',()=>{
  if(!cur)return;
  const e=cur.p.episodes[cur.i];
  store.set('done.'+epKey(cur.p,e),true);
  store.set('pos.'+epKey(cur.p,e),0);
  nextEp(true);
});
audio.addEventListener('play',()=>{paintShells()});
audio.addEventListener('pause',()=>{ paintShells();
  if(cur) store.set('pos.'+epKey(cur.p,cur.p.episodes[cur.i]),Math.round(audio.currentTime)); });

function setMediaSession(p,e){
  if(!('mediaSession' in navigator))return;
  const art=new URL(PORTRAITS[p.name],location.href).href;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:e.title,artist:p.shortName,album:'Founders',
    artwork:[{src:art,sizes:'800x800',type:'image/jpeg'}]});
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward',()=>seekBy(-15));
  navigator.mediaSession.setActionHandler('seekforward',()=>seekBy(30));
  navigator.mediaSession.setActionHandler('previoustrack',prevEp);
  navigator.mediaSession.setActionHandler('nexttrack',()=>nextEp(false));
  try{navigator.mediaSession.setActionHandler('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime})}catch(e){}
}

/* ============ shells: mini pill + player ============ */
function paintShells(){
  if(!cur)return;
  const {p,i}=cur, e=p.episodes[i];
  $('mp-img').src=PORTRAITS[p.name];
  $('mp-t').textContent=(i+1)+'. '+e.title;
  $('mp-s').textContent=p.shortName;
  $('mp-toggle').innerHTML=audio.paused?IC.play(20):IC.pause(20);
  $('mp-fwd').innerHTML=IC.ff(22);
  $('np-img').src=PORTRAITS[p.name];
  $('np-t').textContent=e.title;
  $('np-s').textContent=p.shortName;
  $('tp-name').textContent=p.shortName;
  $('ctl-play').innerHTML=audio.paused?IC.bigplay():IC.bigpause();
  const fv=favs.includes(p.name);
  const star=$('np-star'); star.innerHTML=IC.star(22,fv); star.classList.toggle('faved',fv);
  $('ctl-speed').textContent=store.get('speed',1)+'×';
  paintProgress(); paintQueueIcons();
  if(curDetail&&curDetail.slug===p.slug) refreshDetail();
}
function paintProgress(){
  if(!cur)return;
  const e=cur.p.episodes[cur.i];
  const d=audio.duration&&isFinite(audio.duration)?audio.duration:(e.sec||1);
  const t=audio.currentTime||0;
  if(!scrubbing) $('scrubfill').style.width=(100*t/d)+'%';
  $('t-el').textContent=fmtClock(scrubbing?scrubT:t);
  $('t-rem').textContent='-'+fmtClock(Math.max(0,d-(scrubbing?scrubT:t)));
}

function openPlayer(){ $('player').classList.add('show'); }
function closePlayer(){ $('player').classList.remove('show'); closeQueue(); }

$('minipill').onclick=e=>{
  if(e.target.closest('#mp-toggle')){toggle();return}
  if(e.target.closest('#mp-fwd')){nextEp(false);return}
  openPlayer();
};
$('dock-person').innerHTML=IC.person(24,'#fff');
$('dock-person').onclick=()=>{ if(cur){ if(!curDetail||curDetail.slug!==cur.p.slug){ if(curDetail) {renderDetail(cur.p); curDetail=cur.p;} else openDetail(cur.p.slug); } } };
$('dock-search').innerHTML=IC.search(20,'#fff');
$('dock-search').onclick=()=>{ if(curDetail) closeDetail(false); setTimeout(()=>{const s=$('b-search'); if(s){s.focus(); $('browse').scrollTo({top:0,behavior:'smooth'});}},curDetail?420:0); };

$('toppill').innerHTML=IC.chevD()+'<span id="tp-name"></span>';
$('toppill').onclick=()=>closePlayer();
$('ctl-rw').innerHTML=IC.rw(34);
$('ctl-ff').innerHTML=IC.ff(34);
$('ctl-rw').onclick=()=>seekBy(-15);
$('ctl-ff').onclick=()=>seekBy(30);
$('ctl-play').onclick=toggle;
$('ctl-speed').onclick=()=>{
  const opts=[1,1.25,1.5,1.75,2];
  const nxt=opts[(opts.indexOf(store.get('speed',1))+1)%opts.length];
  store.set('speed',nxt); audio.playbackRate=nxt; $('ctl-speed').textContent=nxt+'×';
};
$('ctl-moon').innerHTML=IC.moon(21);
function paintMoon(){
  const b=$('ctl-moon');
  b.classList.toggle('armed',!!sleepUntil);
  b.innerHTML=IC.moon(21)+(sleepUntil?`<span class="zz">${sleepMin}</span>`:'');
}
$('ctl-moon').onclick=()=>{
  const opts=[0,15,30,60];
  sleepMin=opts[(opts.indexOf(sleepMin)+1)%opts.length];
  sleepUntil=sleepMin?Date.now()+sleepMin*60000:null;
  paintMoon();
};
$('np-star').onclick=()=>{ if(cur){toggleFav(cur.p.name); paintShells();} };
$('bi-vol').innerHTML=IC.vol(27);
$('bi-vol').onclick=()=>{ muted=!muted; audio.muted=muted; $('bi-vol').innerHTML=IC.vol(27,muted); $('bi-vol').classList.toggle('on',muted); };
$('bi-home').onclick=()=>{ closePlayer(); if(curDetail) closeDetail(false); };
$('bi-cast').innerHTML=IC.airplay(27);
$('bi-cast').onclick=()=>{ if(audio.remote&&audio.remote.prompt) audio.remote.prompt().catch(()=>{}); };
$('bi-queue').innerHTML=IC.list(26);
$('bi-queue').onclick=()=>{ $('queue').classList.contains('show')?closeQueue():openQueue(); };

/* scrubbing (drag anywhere on bar) */
let scrubT=0;
const bar=$('scrubbar');
function barSeek(clientX,commit){
  if(!cur)return;
  const r=bar.getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  const e=cur.p.episodes[cur.i];
  const d=audio.duration&&isFinite(audio.duration)?audio.duration:(e.sec||1);
  scrubT=f*d;
  $('scrubfill').style.width=(f*100)+'%';
  paintProgress();
  if(commit){ audio.currentTime=scrubT; }
}
bar.addEventListener('pointerdown',e=>{ scrubbing=true; bar.classList.add('grab'); bar.setPointerCapture(e.pointerId); barSeek(e.clientX,false); });
bar.addEventListener('pointermove',e=>{ if(scrubbing) barSeek(e.clientX,false); });
bar.addEventListener('pointerup',e=>{ if(scrubbing){ barSeek(e.clientX,true); scrubbing=false; bar.classList.remove('grab'); } });

/* swipe-down to close player */
(()=>{ let y0=null,t0=0;
  const sh=$('player');
  sh.addEventListener('touchstart',e=>{ if(e.target.closest('#queue'))return; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
  sh.addEventListener('touchend',e=>{ if(y0===null)return;
    const dy=e.changedTouches[0].clientY-y0, dt=Date.now()-t0;
    if(dy>80&&dt<600&&!scrubbing) closePlayer(); y0=null; },{passive:true});
})();

/* ============ queue sheet ============ */
function openQueue(){ renderQueue(); $('queue').classList.add('show'); $('qscrim').classList.add('show'); $('bi-queue').classList.add('on'); }
function closeQueue(){ $('queue').classList.remove('show'); $('qscrim').classList.remove('show'); $('bi-queue').classList.remove('on'); }
$('qscrim').onclick=closeQueue;
$('q-shuffle').innerHTML=IC.shuffle(20);
$('q-repeat').innerHTML=IC.repeat(20);
function paintQueueIcons(){
  $('q-shuffle').classList.toggle('on',shuffleOn);
  $('q-repeat').classList.toggle('on',repeatOn);
}
$('q-shuffle').onclick=()=>{shuffleOn=!shuffleOn;paintQueueIcons()};
$('q-repeat').onclick=()=>{repeatOn=!repeatOn;paintQueueIcons()};
$('q-search').addEventListener('input',()=>renderQueue($('q-search').value));
function renderQueue(filter=''){
  if(!cur)return;
  const {p,i}=cur; const f=filter.trim().toLowerCase();
  const list=$('q-list');
  list.innerHTML=p.episodes.map((e,j)=>{
    if(f&&!e.title.toLowerCase().includes(f))return '';
    const active=j===i;
    return `<button class="q-row press ${active?'active':''}" data-j="${j}">
      <span class="q-tile">${j+1}</span>
      <span class="q-main">
        <span class="q-t">${e.title}</span>
        <span class="q-s">${e.n!==null?'#'+e.n+' · ':''}${mon(e.date)}</span>
      </span>
      ${active?`<span class="q-playcircle">${audio.paused?IC.play(14,'#000'):IC.pause(14,'#000')}</span>`:`<span class="q-side">${fmtDur(e.sec)}</span>`}
    </button>`;
  }).join('');
  list.querySelectorAll('.q-row').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;
    if(j===i){toggle();renderQueue(filter);return}
    playEp(p,j,true);
  });
}

/* ============ boot ============ */
document.querySelector('#q-searchwrap').insertAdjacentHTML('afterbegin',IC.search(16,'#7C7C88'));
Promise.all([fetch('episodes.json').then(r=>r.json()),fetch('portraits.json').then(r=>r.json())])
.then(([d,pr])=>{
  DATA=d;PORTRAITS=pr;
  DATA.people.forEach(p=>{p.slug=slug(p.name);p.shortName=p.name.split(' - ')[0]});
  renderBrowse();
  // deep link
  const m=location.hash.match(/^#\/p\/(.+)$/);
  if(m){const p=DATA.people.find(x=>x.slug===decodeURIComponent(m[1]));
    if(p){curDetail=p;renderDetail(p);$('browse').style.display='none';$('detail').style.display='block';
      history.replaceState({v:'detail',p:p.slug},'','#/p/'+p.slug);}}
  // restore last track (paused) so Continue is one tap
  const last=store.get('last',null);
  if(last){const p=DATA.people.find(x=>x.slug===last.slug);
    if(p&&p.episodes[last.i]){cur={p,i:last.i};document.body.classList.add('has-track');
      const e=p.episodes[last.i];
      $('mp-img').src=PORTRAITS[p.name];$('mp-t').textContent=(last.i+1)+'. '+e.title;$('mp-s').textContent=p.shortName;
      $('mp-toggle').innerHTML=IC.play(20);$('mp-fwd').innerHTML=IC.ff(22);
      $('np-img').src=PORTRAITS[p.name];$('np-t').textContent=e.title;$('np-s').textContent=p.shortName;
      $('tp-name').textContent=p.shortName;$('ctl-play').innerHTML=IC.bigplay();
      audio.src=e.url;audio.preload='none';
      paintShells();
      const sv=pos(p,e); if(sv>5){ // show saved progress on the bar
        const d=e.sec||1;$('scrubfill').style.width=(100*sv/d)+'%';
        $('t-el').textContent=fmtClock(sv);$('t-rem').textContent='-'+fmtClock(Math.max(0,d-sv));
        audio.addEventListener('loadedmetadata',()=>{audio.currentTime=sv},{once:true});
      }
      paintQueueIcons();
    }}
  // static-state debug hook (?state=player|queue|about) — renders surfaces without starting audio
  const st=new URLSearchParams(location.search).get('state');
  if(st){
    const p=curDetail||DATA.people[0];
    if(st==='about'){ openAbout(p); }
    else if(st==='player'||st==='queue'||st==='browse'){
      cur={p,i:0}; document.body.classList.add('has-track');
      audio.src=p.episodes[0].url; paintShells();
      if(st!=='browse') openPlayer();
      if(st==='queue'){ renderQueue(); openQueue(); }
    }
  }
});
</script>
